<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AFPK gesture preview v9</title>
<style>
  html,body{margin:0;background:#111;font:13px/1.4 -apple-system,sans-serif;color:#eee}
  #box{position:relative;width:390px;height:844px;transform-origin:0 0;overflow:hidden;background:#F2F4F6}
  #box iframe{display:block;width:390px;height:844px;border:0}
  #st{position:fixed;left:8px;bottom:8px;z-index:9;background:#000d;padding:4px 8px;border-radius:8px}
</style>
</head>
<body>
<div id="box"><iframe id="f" src="./index.html"></iframe></div>
<div id="st">loading</div>
<script>
(function () {
  var P = new URLSearchParams(location.search);
  var state = P.get("state") || "rest";
  var d = Number(P.get("d") || 300);
  var f = document.getElementById("f");
  var st = document.getElementById("st");

  /* keep the 390x844 frame fully visible on any browser window */
  var FIT = P.get("fit") !== "0";
  function fit() {
    if (!FIT) { document.getElementById("box").style.transform = "scale(1)"; return; }
    var s = Math.min(1, (window.innerHeight - 40) / 844, (window.innerWidth - 20) / 390);
    document.getElementById("box").style.transform = "scale(" + s + ")";
  }
  fit(); addEventListener("resize", fit);

  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  function inert(w) {
    function touch(el, type, x, y) {
      var t = new w.Touch({ identifier: 1, target: el, clientX: x, clientY: y, pageX: x, pageY: y, screenX: x, screenY: y, radiusX: 2, radiusY: 2, force: 1 });
      var list = type === "touchend" ? [] : [t];
      var ev = new w.TouchEvent(type, { touches: list, targetTouches: list, changedTouches: [t], bubbles: true, cancelable: true, composed: true });
      el.dispatchEvent(ev);
    }
    function at(x, y) { return w.document.elementFromPoint(x, y) || w.document.getElementById("app"); }
    return { touch: touch, at: at };
  }

  f.addEventListener("load", async function () {
    var w = f.contentWindow, doc = w.document;
    var app = doc.getElementById("app");
    try { w.localStorage.removeItem("afpk-all-ox-v1"); } catch (e) {}

    /* iPhone with dynamic island: 67px header padding-top */
    var s = doc.createElement("style");
    s.textContent = "header{padding-top:67px !important}";
    doc.head.appendChild(s);
    w.dispatchEvent(new w.Event("resize"));

    await sleep(400);
    var io = inert(w);
    var realSetTimeout = w.setTimeout;

    /* stretch the refresh sequence so a screenshot can catch one step */
    w.setTimeout = function (fn, ms) {
      if (state === "loading" && (ms === 240 || ms === 300)) ms = 20000;
      return realSetTimeout.call(w, fn, ms);
    };

    if (state === "rest") { st.textContent = "ready:rest"; return; }

    if (state === "up") {
      var card = doc.getElementById("card");
      io.touch(card, "touchstart", 195, 640);
      await sleep(30);
      for (var u = 1; u <= 5; u++) { io.touch(card, "touchmove", 195, 640 - (d * u / 5)); await sleep(16); }
      st.textContent = "ready:up";
      return;
    }

    /* pull down: rest -> paint -> (optional release) */
    var target = io.at(195, 260);
    io.touch(target, "touchstart", 195, 140);
    await sleep(30);
    for (var i = 1; i <= 6; i++) { io.touch(target, "touchmove", 195, 140 + (d * i / 6)); await sleep(16); }

    if (state === "down") { st.textContent = "ready:down"; return; }

    io.touch(target, "touchend", 195, 140 + d);
    if (state === "loading") { await sleep(320); st.textContent = "ready:loading"; return; }
    if (state === "after") {
      await sleep(1000);
      w.__afpk.toast("새 문제를 불러왔어요");
      await sleep(150);
      st.textContent = "ready:after";
      return;
    }
    await sleep(1600);
    st.textContent = "ready:landed";
  });
})();
</script>
</body>
</html>
