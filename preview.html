<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AFPK 물리 스크롤 미리보기</title>
<style>
  html,body{margin:0;height:100%;background:#1B2028;font:12px/1.4 -apple-system,system-ui,sans-serif;color:#AEB6C2}
  .wrap{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:14px 0}
  .cap{padding:0 0 8px;letter-spacing:.02em}
  iframe{width:390px;height:844px;border:0;border-radius:22px;background:#F2F4F6;box-shadow:0 8px 40px rgba(0,0,0,.45)}
</style>
</head>
<body>
<div class="wrap"><div class="cap" id="cap">preview</div><iframe id="f" src="./index.html?v=7"></iframe></div>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var state = q.get("state") || "rest";
  var d = Number(q.get("d") || 140);
  var f = document.getElementById("f");
  document.getElementById("cap").textContent = "state=" + state + (state === "rest" ? "" : " d=" + d);

  f.addEventListener("load", function () {
    var w = f.contentWindow, doc = f.contentDocument;
    if (!w || !doc) return;
    /* 앱의 타이머를 붙잡아 두어(hold 220ms / exit 145ms) 화면을 멈춘 채로 확인한다 */
    var orig = w.setTimeout.bind(w);
    w.setTimeout = function (fn, ms) {
      if (ms === 220 || ms === 145) { w.__held = fn; return 0; }
      return orig(fn, ms);
    };
    var app = doc.getElementById("app");
    var card = doc.getElementById("card");
    var stem = doc.getElementById("stem");
    function T(y, tgt) {
      return new w.Touch({ identifier: 1, target: tgt, clientX: 195, clientY: y, pageX: 195, pageY: y });
    }
    function fire(el, type, y) {
      var t = T(y, el);
      var empty = type === "touchend" || type === "touchcancel";
      el.dispatchEvent(new w.TouchEvent(type, {
        bubbles: true, cancelable: true,
        touches: empty ? [] : [t],
        targetTouches: empty ? [] : [t],
        changedTouches: [t]
      }));
    }
    orig(function () {
      if (state === "rest") return;
      if (state === "down") {
        fire(app, "touchstart", 100);
        fire(app, "touchmove", 130);
        fire(app, "touchmove", 130 + d);
        return;
      }
      if (state === "hold") {
        fire(app, "touchstart", 100);
        fire(app, "touchmove", 130);
        fire(app, "touchmove", 130 + d);
        fire(app, "touchend", 130 + d);
        return;
      }
      if (state === "rise") {
        fire(app, "touchstart", 100);
        fire(app, "touchmove", 130);
        fire(app, "touchmove", 130 + d);
        fire(app, "touchend", 130 + d);
        orig(function () { if (w.__held) { var fn = w.__held; w.__held = null; fn(); } }, 420);
        return;
      }
      if (state === "up" || state === "upfire") {
        stem.scrollTop = 99999;
        fire(card, "touchstart", 600);
        fire(card, "touchmove", 570);
        fire(card, "touchmove", 570 - (d - 30));
        if (state === "upfire") fire(card, "touchend", 570 - (d - 30));
        return;
      }
    }, 400);
  });
})();
</script>
</body>
</html>
