<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F2F4F6">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>AFPK 전범위 O/X</title>
<style>
:root{
  --blue:#3182F6; --blue-deep:#1B64DA;
  --green:#03B26C; --green-soft:#F0FBF6;
  --coral:#F04452; --coral-soft:#FEF2F3;
  --ink:#191F28; --sub:#8B95A1; --sub2:#4E5968;
  --bg:#F2F4F6;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none !important}
html,body{height:100%}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic",system-ui,sans-serif;
  font-size:17px;line-height:1.5;overflow:hidden;overscroll-behavior:none;
}
button{font-family:inherit;cursor:pointer;touch-action:manipulation;border:0;background:none;color:inherit}
.app{display:flex;flex-direction:column;height:100%;max-width:540px;margin:0 auto;position:relative;
  z-index:2;will-change:transform}

/* ---------- 헤더 ---------- */
header{padding:calc(8px + env(safe-area-inset-top)) 16px 4px;flex:0 0 auto}
.title{margin:0 0 8px;font-size:18px;font-weight:700;letter-spacing:-.02em}
.title em{font-style:normal;color:var(--blue-deep)}
.modrow{display:flex;gap:8px;align-items:stretch}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:#E3E8EE;border-radius:14px;padding:4px;flex:1}
.seg button{height:50px;border-radius:11px;font-size:18px;font-weight:600;color:var(--sub2);transition:background .15s,color .15s,box-shadow .15s}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(25,31,40,.10)}
.iconbtn{width:50px;flex:0 0 50px;border-radius:14px;background:#fff;font-size:22px;line-height:1;
  box-shadow:0 1px 4px rgba(25,31,40,.06)}
.iconbtn.on{background:#FFF4E0;color:#FF9F00}
.shuffle{width:54px;flex:0 0 54px;border-radius:14px;background:#fff;font-size:24px;line-height:1;box-shadow:0 1px 4px rgba(25,31,40,.06)}
.shuffle:active{background:#E9EDF2}
.tools{display:flex;gap:7px;align-items:stretch;margin-top:8px}
.vseg{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:4px;background:#E3E8EE;border-radius:14px;padding:4px}
.vseg button{height:42px;border-radius:11px;font-size:16px;font-weight:600;color:var(--sub2);transition:background .15s,color .15s,box-shadow .15s}
.vseg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(25,31,40,.10)}
.chip{flex:0 0 auto;padding:0 13px;border-radius:14px;background:#fff;
  font-size:16px;font-weight:600;color:var(--sub2);white-space:nowrap;
  display:inline-flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(25,31,40,.05)}
.chip.on{background:var(--ink);color:#fff}

/* ---------- 카드 ---------- */
main{flex:1 1 auto;min-height:0;padding:8px 14px 6px;position:relative;overflow:hidden}
.pane{height:100%;position:relative}
.card{
  height:100%;display:flex;flex-direction:column;
  background:#fff;border-radius:24px;padding:18px 18px 14px;
  box-shadow:0 2px 16px rgba(25,31,40,.05);will-change:transform,opacity;
}
.card.in-next{animation:inNext .22s ease-out both}
.card.in-prev{animation:inPrev .22s ease-out both}
.card.nudge{animation:nudge .18s ease-out both}
@keyframes inNext{from{opacity:.35;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes inPrev{from{opacity:.35;transform:translateX(-28px)}to{opacity:1;transform:none}}
@keyframes nudge{0%,100%{transform:none}35%{transform:translateX(-8px)}70%{transform:translateX(8px)}}

.cardTop{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.badge{background:#EBF2FE;color:var(--blue-deep);border-radius:9px;padding:6px 10px;
  font-size:16px;font-weight:600;letter-spacing:-.01em;max-width:84%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.star{margin-left:auto;width:44px;height:44px;margin-top:-8px;margin-right:-8px;border-radius:12px;font-size:26px;line-height:1;color:#C9CFD6}
.star.on{color:#FFB020}
.star:active{background:#F4F6F9}

.stem{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  margin:16px 0 14px;font-size:23px;line-height:1.58;font-weight:400;
  letter-spacing:-.02em;word-break:keep-all;overflow-wrap:anywhere;color:var(--ink)}
.stem::-webkit-scrollbar{width:0}
.kw{color:var(--blue-deep);font-weight:500}

.fb{flex:0 0 auto;display:none;border-radius:18px;padding:14px 16px;margin:0 0 14px}
.fb.show{display:block;animation:pop .18s ease-out both}
.fb.ok{background:var(--green-soft)}
.fb.no{background:var(--coral-soft)}
.fb .v{margin:0 0 4px;font-size:18px;font-weight:700;letter-spacing:-.01em}
.fb.ok .v{color:#009E60}
.fb.no .v{color:#E13B49}
.fb .e{margin:0;font-size:19.5px;line-height:1.55;font-weight:400;color:#333D4B;word-break:keep-all;overflow-wrap:anywhere}
@keyframes pop{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}

.oxrow{flex:0 0 auto;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ox{height:100px;border-radius:20px;background:#F2F4F6;color:#4E5968;
  font-size:40px;font-weight:400;letter-spacing:.02em;
  transition:transform .08s ease,background .12s,color .12s,box-shadow .12s}
.ox:active{transform:scale(.98)}
.ox.hint{background:#fff;color:var(--green);box-shadow:inset 0 0 0 3px var(--green)}
.ox.ok{background:var(--green);color:#fff}
.ox.no{background:var(--coral);color:#fff}
.ox.faded{background:#F7F8FA;color:#C2C8CF}

.nav{flex:0 0 auto;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.nav button{height:58px;border-radius:16px;background:#F2F4F6;color:#333D4B;font-size:17px;font-weight:600;
  display:flex;align-items:center;justify-content:center}
.nav button:active{background:#E7EBF0}
.nav button:disabled{color:#C2C8CF}

.card.empty .stem{display:flex;align-items:center;justify-content:center;text-align:center;
  font-size:18px;line-height:1.6;color:var(--sub);font-weight:500;padding:0 10px}
.card.empty .oxrow,.card.empty .nav,.card.empty .fb{display:none}
.card.empty .star{visibility:hidden}

/* ---------- 여러 개 보기 ---------- */
.list{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:12px;padding-bottom:8px}
.list::-webkit-scrollbar{width:0}
.li{background:#fff;border-radius:22px;padding:18px 18px 16px;box-shadow:0 2px 14px rgba(25,31,40,.05)}
.liTop{display:flex;align-items:center;margin-bottom:8px}
.liBadge{background:#EBF2FE;color:var(--blue-deep);border-radius:8px;padding:5px 9px;font-size:16px;font-weight:600;
  max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.liStem{margin:0 0 14px;font-size:22px;line-height:1.55;font-weight:400;letter-spacing:-.02em;word-break:keep-all;overflow-wrap:anywhere}
.liOx{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.liBtn{height:56px;border-radius:14px;background:#F2F4F6;color:#4E5968;font-size:24px;font-weight:400}
.liBtn.ok{background:var(--green);color:#fff}
.liBtn.no{background:var(--coral);color:#fff}
.liBtn.hint{background:#fff;color:var(--green);box-shadow:inset 0 0 0 3px var(--green)}
.liFb{margin-top:12px;border-radius:14px;padding:12px 14px}
.liFb.ok{background:var(--green-soft)}
.liFb.no{background:var(--coral-soft)}
.liFb b{display:block;font-size:16.5px;font-weight:700;margin-bottom:3px}
.liFb.ok b{color:#009E60}
.liFb.no b{color:#E13B49}
.liFb p{margin:0;font-size:19px;line-height:1.55;font-weight:400;color:#333D4B;word-break:keep-all}
.emptyList{background:#fff;border-radius:22px;padding:40px 20px;text-align:center;color:var(--sub);font-size:18px;font-weight:500;line-height:1.6}

/* ---------- 하단 진행 ---------- */
.prog{flex:0 0 auto;display:flex;align-items:center;gap:10px;
  padding:6px 16px calc(10px + env(safe-area-inset-bottom))}
.progTrack{flex:1 1 auto;height:4px;border-radius:999px;background:#E3E8EE;overflow:hidden}
.progBar{display:block;height:100%;width:0;border-radius:999px;background:var(--blue);
  transition:width .2s ease}
.progNum{flex:0 0 auto;font-size:12px;font-weight:500;color:var(--sub);font-variant-numeric:tabular-nums}

/* ---------- AI 바로 질문 ---------- */
.cardTop .star{margin-left:auto}
.liTop .liBadge{max-width:100%}

/* 지문·해설 끝에 붙는 인라인 질문 아이콘 */
.qi{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;margin-left:8px;
  border-radius:999px;background:#E8F1FE;color:var(--blue-deep);vertical-align:-8px;flex:0 0 auto}
.qi svg{width:19px;height:19px;display:block;pointer-events:none}
.qi:active{background:#D7E6FD}
.fb .qi{background:#fff;box-shadow:0 1px 3px rgba(25,31,40,.10)}
.liFb .qi{background:#fff;width:29px;height:29px;vertical-align:-7px}
.liFb .qi svg{width:18px;height:18px}
.stem .kw:active,.fb .kw:active,.liStem .kw:active,.liFb .kw:active{opacity:.6}

/* 선택한 표현 질문 칩 */
.selAsk{position:fixed;z-index:75;display:inline-flex;align-items:center;gap:6px;max-width:250px;height:38px;
  padding:0 14px;border-radius:999px;background:var(--ink);color:#fff;font-size:13.5px;font-weight:600;
  letter-spacing:-.01em;box-shadow:0 8px 22px rgba(25,31,40,.26);white-space:nowrap;overflow:hidden;
  transform:translate(-50%,-100%)}
.selAsk.below{transform:translate(-50%,0)}
.selAsk span{overflow:hidden;text-overflow:ellipsis}
.selAsk b{font-size:14px;font-weight:400;line-height:1}
.selAsk:active{background:#000}

.aiWrap{position:fixed;left:0;right:0;top:0;height:var(--aiH,100svh);z-index:60;
  display:flex;align-items:flex-end;justify-content:center}
.aiWrap[hidden]{display:none !important}
.aiBack{position:absolute;inset:0;background:rgba(25,31,40,.44);opacity:0;transition:opacity .22s ease}
.aiWrap.open .aiBack{opacity:1}
.aiSheet{position:relative;width:100%;max-width:540px;max-height:calc(100% - 6px);background:#fff;
  border-radius:24px 24px 0 0;display:flex;flex-direction:column;
  padding:8px 16px calc(10px + env(safe-area-inset-bottom));
  transform:translateY(102%);transition:transform .26s cubic-bezier(.22,.9,.3,1);
  box-shadow:0 -6px 28px rgba(25,31,40,.18)}
.aiWrap.open .aiSheet{transform:none}
/* 모바일 Safari 하단 글래스 툴바(닫힌 상태)에 입력줄이 가리지 않도록 시트 아래 여백 48px 확보.
   키보드가 열려 있으면(.kb) 여백을 걷어 입력줄이 키보드 바로 위에 붙는다. */
.aiWrap.padB .aiSheet{padding-bottom:calc(48px + env(safe-area-inset-bottom))}
.aiWrap.kb .aiSheet{padding-bottom:calc(10px + env(safe-area-inset-bottom))}
.aiGrab{flex:0 0 auto;width:36px;height:4px;border-radius:999px;background:#E3E8EE;margin:2px auto 10px}
.aiHead{flex:0 0 auto;display:flex;align-items:center;gap:8px}
.aiBadge{min-width:0;background:#EBF2FE;color:var(--blue-deep);border-radius:8px;padding:5px 9px;
  font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.aiKeyBtn{flex:0 0 auto;margin-left:auto;height:30px;padding:0 10px;border-radius:9px;background:#F2F4F6;
  color:var(--sub2);font-size:13.5px;font-weight:600}
.aiKeyBtn.need{background:#EBF2FE;color:var(--blue-deep)}
.aiKeyBtn.set{width:32px;padding:0;font-size:14px}
.aiKeyBtn.open{box-shadow:inset 0 0 0 1.5px var(--blue)}
.aiClose{flex:0 0 auto;width:32px;height:32px;border-radius:9px;font-size:16px;line-height:1;color:var(--sub2)}
.aiClose:active{background:#F2F4F6}
.aiPrev{flex:0 0 auto;margin:8px 0 0;font-size:14px;line-height:1.45;color:var(--sub);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  word-break:keep-all;overflow-wrap:anywhere}
.aiPrevSel{color:var(--blue-deep);font-weight:600}
.aiToast{position:absolute;left:50%;top:50px;z-index:3;transform:translate(-50%,-6px);
  background:rgba(25,31,40,.94);color:#fff;font-size:13px;font-weight:600;letter-spacing:-.01em;
  padding:8px 14px;border-radius:999px;white-space:nowrap;opacity:0;pointer-events:none;
  transition:opacity .18s ease,transform .18s ease}
.aiToast.on{opacity:1;transform:translate(-50%,0)}
.aiPanel{flex:0 0 auto;margin-top:10px;border-radius:16px;background:#F7F8FA;padding:11px 11px 12px}
.aiSeg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:3px;background:#E3E8EE;border-radius:11px;padding:3px}
.aiSeg button{height:34px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--sub2)}
.aiSeg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(25,31,40,.10)}
.aiField{display:flex;gap:6px;margin-top:8px}
.aiField input{flex:1 1 auto;min-width:0;height:42px;border:0;border-radius:11px;background:#fff;padding:0 12px;
  font-family:inherit;font-size:15px;color:var(--ink);outline:none;box-shadow:inset 0 0 0 1.5px #E3E8EE}
.aiField input:focus{box-shadow:inset 0 0 0 1.5px var(--blue)}
#aiKeyInput{-webkit-text-security:disc}
.aiFieldBtns button{flex:1 1 0;height:40px;border-radius:11px;font-size:14.5px;font-weight:700}
#aiKeySave{background:var(--blue);color:#fff}
#aiKeySave:active{background:var(--blue-deep)}
.aiGhost{background:#fff;color:var(--sub2);box-shadow:inset 0 0 0 1.5px #E3E8EE}
.aiHint{margin:9px 0 0;font-size:12.5px;line-height:1.5;color:var(--sub)}
.aiHint b{color:var(--sub2);font-weight:700}
.aiHint a{color:var(--blue-deep);font-weight:600;text-decoration:none;word-break:break-all}
.aiChips{flex:0 0 auto;display:flex;flex-wrap:nowrap;gap:6px;margin:10px -16px 0;padding:0 16px;
  overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;
  scrollbar-width:none}
.aiChips::-webkit-scrollbar{display:none}
.aiChips button{flex:0 0 auto;height:33px;padding:0 13px;border-radius:999px;background:#F2F4F6;color:#333D4B;
  font-size:13.5px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.aiChips button:active{background:#E7EBF0}
.aiChat{flex:0 1 auto;min-height:0;margin-top:10px;overflow-y:auto;-webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;display:flex;flex-direction:column;gap:8px;padding-bottom:2px}
.aiChat:empty{display:none;margin:0}
.aiChat::-webkit-scrollbar{width:0}
.aiMsg{max-width:88%;border-radius:16px;padding:10px 13px;font-size:15px;line-height:1.55;
  word-break:keep-all;overflow-wrap:anywhere;white-space:pre-wrap}
.aiMsg.user{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:6px}
.aiMsg.ai{align-self:flex-start;background:#F2F4F6;color:#333D4B;border-bottom-left-radius:6px}
.aiMsg.err{align-self:flex-start;background:var(--coral-soft);color:#C4343F;font-size:13.5px;border-bottom-left-radius:6px}
.aiMsg.typing{align-self:flex-start;background:#F2F4F6;color:var(--sub);animation:blink 1.1s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.45}}
.aiInputRow{flex:0 0 auto;display:flex;gap:6px;margin-top:10px}
.aiInputRow input{flex:1 1 auto;min-width:0;height:46px;border:0;border-radius:14px;background:#F2F4F6;
  padding:0 14px;font-family:inherit;font-size:15.5px;color:var(--ink);outline:none}
.aiInputRow input:focus{background:#fff;box-shadow:inset 0 0 0 1.5px var(--blue)}
.aiIcon{flex:0 0 auto;width:46px;height:46px;border-radius:14px;background:#F2F4F6;color:var(--sub2);font-size:16px}
.aiIcon:active{background:#E7EBF0}
.aiIcon.done{background:#EBF2FE;color:var(--blue-deep);font-size:12.5px;font-weight:700}
.aiSend{flex:0 0 auto;height:46px;padding:0 16px;border-radius:14px;background:var(--blue);color:#fff;
  font-size:15px;font-weight:700}
.aiSend:active{background:var(--blue-deep)}
.aiSend:disabled{background:#D6DCE4}
.aiMic{position:relative;font-size:17px;line-height:1}
.aiMic:active{background:#E7EBF0}
.aiMic.recording{background:var(--coral-soft);color:var(--coral);font-size:15px}
.aiMic.recording::after{content:"";position:absolute;inset:0;border-radius:14px;pointer-events:none;
  animation:micRing 1.3s ease-out infinite}
@keyframes micRing{0%{box-shadow:0 0 0 0 rgba(240,68,82,.34)}70%{box-shadow:0 0 0 8px rgba(240,68,82,0)}100%{box-shadow:0 0 0 0 rgba(240,68,82,0)}}
.aiVoiceHint{flex:0 0 auto;display:flex;align-items:center;gap:6px;margin:9px 2px 0;
  font-size:12.5px;line-height:1.4;font-weight:600;letter-spacing:-.01em;color:var(--blue-deep)}
.aiVoiceHint::before{content:"";flex:0 0 auto;width:6px;height:6px;border-radius:999px;background:currentColor}
.aiVoiceHint.rec{color:var(--coral)}
.aiVoiceHint.warn{color:#B4471F}
@media (max-width:400px){
  .aiInputRow{gap:5px}
  .aiIcon{width:44px}
  .aiSend{padding:0 14px}
}

/* ---------- 당겨서 새 문제(새로고침) ---------- */
.card.in-up{animation:inUp .26s cubic-bezier(.22,.9,.3,1) both}
.card.in-down{animation:inDown .26s cubic-bezier(.22,.9,.3,1) both}
@keyframes inUp{from{opacity:.3;transform:translateY(40px)}to{opacity:1;transform:none}}
@keyframes inDown{from{opacity:.3;transform:translateY(-40px)}to{opacity:1;transform:none}}
.list.in-up{animation:listUp .24s ease-out both}
.list.in-down{animation:listUp .24s ease-out both}
@keyframes listUp{from{opacity:.3;transform:translateY(14px)}to{opacity:1;transform:none}}

/* 상단 새로고침 인디케이터: #app 뒤쪽(아래 레이어)에 있어 #app이 밀려 내려오며 열린 여백에 드러난다 */
.ptr{position:fixed;left:50%;top:0;z-index:1;display:inline-flex;align-items:center;gap:7px;
  height:auto;padding:0;border-radius:0;background:transparent;box-shadow:none;color:var(--sub2);
  font-size:15px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;
  opacity:0;pointer-events:none;
  transform:translate(-50%,0)}
.ptr .ring{flex:0 0 auto;width:19px;height:19px;background:transparent;color:inherit;
  display:inline-flex;align-items:center;justify-content:center;transform-origin:50% 50%}
.ptr svg{width:19px;height:19px;display:block}
.ptr.ready{color:var(--blue-deep)}
.ptr.loading{color:var(--blue-deep)}
.ptr.loading .ring svg{animation:ptrSpin .62s linear infinite}
@keyframes ptrSpin{to{transform:rotate(360deg)}}

/* 카드가 위로 밀려 올라가며 카드 아래에 드러나는 인디케이터 */
.upInd{position:absolute;left:50%;bottom:0;z-index:3;display:inline-flex;align-items:center;gap:6px;
  height:auto;padding:0;border-radius:0;background:transparent;color:var(--sub2);
  font-size:15px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;
  opacity:0;pointer-events:none;transform:translate(-50%,0)}
.upInd .ico{flex:0 0 auto;width:auto;height:auto;background:transparent;box-shadow:none;
  display:inline-flex;align-items:center;justify-content:center;font-size:17px;line-height:1;
  color:inherit}
.upInd.ready{color:var(--blue-deep)}

@media (prefers-reduced-motion:reduce){
  .card.in-up,.card.in-down,.list.in-up,.list.in-down{animation:none}
  .ptr.loading .ring svg{animation:none}
}

/* 헤더(제목·모듈 버튼)를 절대 가리지 않도록 화면 하단에서 올라온다 */
.toast{position:fixed;left:50%;top:auto;bottom:calc(36px + env(safe-area-inset-bottom));z-index:95;
  background:rgba(25,31,40,.82);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  color:#fff;font-size:15px;font-weight:600;letter-spacing:-.01em;
  padding:11px 20px;border-radius:999px;white-space:nowrap;pointer-events:none;
  opacity:0;transform:translate(-50%,10px);transition:opacity .2s ease,transform .22s cubic-bezier(.22,.9,.3,1)}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-height:720px){
  .stem{font-size:22px;line-height:1.55;margin:12px 0 10px}
  .ox{height:86px}
  .nav button{height:52px}
  .nav{margin-top:10px}
  .title{font-size:17px;margin-bottom:6px}
  .seg button{height:46px}
  .tools{margin-top:6px}
  .prog{padding-top:4px;padding-bottom:calc(8px + env(safe-area-inset-bottom))}
}

<body>
<div class="ptr" id="ptr" aria-hidden="true">
  <span class="ring" id="ptrRing">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M19.4 9.1A7.6 7.6 0 1 0 19.6 12"/>
      <path d="M19.8 4.6v4.6h-4.6"/>
    </svg>
  </span>
  <span class="lbl" id="ptrLbl">당겨서 새 문제</span>
</div>
<div class="app" id="app">
  <header>
    <h1 class="title">AFPK <em>전범위</em> O/X</h1>
    <div class="modrow">
      <div class="seg" id="seg">
        <button type="button" id="seg1" class="on">모듈 1</button>
        <button type="button" id="seg2">모듈 2</button>
      </div>
      <button type="button" class="iconbtn" id="chipStar" aria-label="별표한 문제만">★</button>
      <button type="button" class="shuffle" id="shuffle" aria-label="섞기">🔀</button>
    </div>
    <div class="tools">
      <div class="vseg" id="vseg">
        <button type="button" id="viewOne" class="on">한 개 보기</button>
        <button type="button" id="viewMany">여러 개 보기</button>
      </div>
      <button type="button" class="chip" id="chipWrong">틀린 것만</button>
    </div>
  </header>

  <main>
    <section class="pane" id="onePane">
      <article class="card" id="card">
        <div class="cardTop">
          <span class="badge" id="badge"></span>
          <button type="button" class="star" id="star" aria-label="별표">☆</button>
        </div>
        <p class="stem" id="stem"></p>
        <div class="fb" id="fb" role="status" aria-live="polite">
          <p class="v" id="fbTitle"></p>
          <p class="e" id="fbBody"></p>
        </div>
        <div class="oxrow">
          <button type="button" class="ox" id="btnO" aria-label="O">O</button>
          <button type="button" class="ox" id="btnX" aria-label="X">X</button>
        </div>
        <div class="nav">
          <button type="button" id="btnPrev">◀ 이전</button>
          <button type="button" id="btnNext">다음 ▶</button>
        </div>
      </article>
      <div class="upInd" id="upInd" aria-hidden="true"><span class="ico" id="upIndIco">↑</span><span class="lbl" id="upIndLbl">당겨서 새 문제</span></div>
    </section>

    <section class="pane" id="manyPane" hidden>
      <div class="list" id="list"></div>
    </section>
  </main>

  <footer class="prog" id="prog" aria-label="진행 현황">
    <span class="progTrack"><span class="progBar" id="progBar"></span></span>
    <span class="progNum" id="progNum">0 / 0</span>
  </footer>

</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<button type="button" class="selAsk" id="selAsk" hidden><span id="selAskLbl"></span><b>💬</b></button>

<div class="aiWrap" id="aiWrap" hidden>
  <div class="aiBack" id="aiBack"></div>
  <section class="aiSheet" id="aiSheet" role="dialog" aria-modal="true" aria-label="AI에게 바로 질문">
    <div class="aiGrab"></div>
    <div class="aiHead">
      <span class="aiBadge" id="aiBadge"></span>
      <button type="button" class="aiKeyBtn need" id="aiKeyBtn" aria-label="API 키 설정">키 설정</button>
      <button type="button" class="aiClose" id="aiClose" aria-label="닫기">✕</button>
    </div>
    <p class="aiPrev" id="aiPrev"><span class="aiPrevSel" id="aiPrevSel" hidden></span><span id="aiPrevText"></span></p>
    <div class="aiPanel" id="aiKeyPanel" hidden>
      <div class="aiSeg" id="aiProv">
        <button type="button" data-prov="gemini" class="on">Gemini 무료</button>
        <button type="button" data-prov="groq">Groq 무료</button>
        <button type="button" data-prov="openai">OpenAI 유료</button>
      </div>
      <div class="aiField">
        <input type="text" id="aiKeyInput" placeholder="API 키 붙여넣기" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" data-1p-ignore="true" data-lpignore="true" data-form-type="other" aria-label="API 키">
      </div>
      <div class="aiField aiFieldBtns">
        <button type="button" id="aiKeySave">저장</button>
        <button type="button" id="aiKeyDel" class="aiGhost">키 삭제</button>
      </div>
      <p class="aiHint" id="aiHint"></p>
    </div>
    <div class="aiChat" id="aiChat" aria-live="polite"></div>
    <p class="aiVoiceHint" id="aiVoiceHint" role="status" aria-live="polite" hidden></p>
    <div class="aiChips" id="aiChips"></div>
    <div class="aiInputRow">
      <input type="text" id="aiInput" placeholder="궁금한 걸 바로 물어보세요" autocomplete="off" aria-label="질문 입력">
      <button type="button" class="aiIcon aiMic" id="aiMic" aria-label="음성으로 질문하기" title="음성 입력" aria-pressed="false">🎙️</button>
      <button type="button" class="aiIcon" id="aiCopy" aria-label="문제와 해설 복사" title="복사">⧉</button>
      <button type="button" class="aiSend" id="aiSend">전송</button>
    </div>
    <div class="aiToast" id="aiToast" aria-live="polite"></div>
  </section>
</div>

<script>
(function(){
  "use strict";
  var KEY = "afpk-all-ox-v1";
  var Q = [{"module":1,"subject":"재무설계 개론·직업윤리","topic":"재무설계의 개념","ans":"O","html":"<span class=\"kw\">재무설계</span>는 <span class=\"kw\">재무적 목표</span>뿐 아니라 <span class=\"kw\">비재무적 목표</span>까지 다루며, <span class=\"kw\">재테크와는 본질적으로 다르다</span>.","explain":"<span class=\"kw\">재무설계</span>는 목표 설정부터 실행·모니터링까지 <span class=\"kw\">전 과정</span>을 설계하고, 재테크는 수익을 추구하는 수단이라는 점에서 구분된다.","id":"q1"},{"module":1,"subject":"재무설계 개론·직업윤리","topic":"자격 갱신","ans":"X","html":"<span class=\"kw\">AFPK 자격</span>의 유효기간은 <span class=\"kw\">3년</span>이고, 갱신에 필요한 학점은 <span class=\"kw\">20학점</span>(윤리 2학점)이다.","explain":"<span class=\"kw\">유효기간</span>은 <span class=\"kw\">2년</span>이다. 20학점·윤리 2학점 조건은 맞다.","id":"q2"},{"module":1,"subject":"재무설계 개론·직업윤리","topic":"재무상태표","ans":"O","html":"<span class=\"kw\">재무상태표</span>는 <span class=\"kw\">일정 시점</span>의 재무상태를 <span class=\"kw\">시가평가</span>로 표시하며, <span class=\"kw\">공적연금</span>은 재무상태표에 포함하지 않는다.","explain":"<span class=\"kw\">재무상태표</span>는 특정 시점의 자산·부채·순자산을 공정한 시장가격으로 평가하며, 공적연금 수급권은 <span class=\"kw\">평가 대상에서 제외</span>한다.","id":"q3"},{"module":1,"subject":"재무설계 개론·직업윤리","topic":"자산의 가치평가","ans":"X","html":"<span class=\"kw\">저축성보험</span>은 <span class=\"kw\">재무상태표</span>에 <span class=\"kw\">납입원금</span>으로 평가한다.","explain":"저축성보험은 납입원금이 <span class=\"kw\">아니라</span> <span class=\"kw\">작성일 현재의 해약환급금</span>으로 평가한다.","id":"q4"},{"module":1,"subject":"재무설계 개론·직업윤리","topic":"재무비율","ans":"O","html":"<span class=\"kw\">비상예비자금지표</span>는 <span class=\"kw\">현금성자산 ÷ 월 총지출</span>로 계산하며, <span class=\"kw\">3~6개월</span>분을 적정 수준으로 본다.","explain":"비상예비자금은 3~<span class=\"kw\">6개월</span>치 <span class=\"kw\">고정지출+변동지출</span>에 해당하는 금액을 현금성자산으로 확보하는 것이 기준이다.","id":"q5"},{"module":1,"subject":"재무설계 개론·직업윤리","topic":"재무비율","ans":"X","html":"<span class=\"kw\">가계수지상태지표</span>는 <span class=\"kw\">월 총지출 ÷ 월 총수입</span>으로 계산한다.","explain":"분모는 월 총수입이 <span class=\"kw\">아니라</span> <span class=\"kw\">월 순수입</span>이다.","id":"q6"},{"module":1,"subject":"재무설계 개론·직업윤리","topic":"부채 적정성","ans":"O","html":"<span class=\"kw\">소비성부채비율</span>의 분모는 <span class=\"kw\">월 순수입</span>이지만, 주거관련부채비율과 총부채상환비율의 분모는 <span class=\"kw\">월 총수입</span>이다.","explain":"<span class=\"kw\">주거관련부채</span>는 이자상환액이 소득공제 대상이 될 수 있어 <span class=\"kw\">세금 계산 전 총수입</span>을 분모로 쓴다.","id":"q7"},{"module":1,"subject":"재무설계 개론·직업윤리","topic":"현금흐름표","ans":"X","html":"<span class=\"kw\">재무비율</span> 계산에서 <span class=\"kw\">저축 및 투자금액</span>은 <span class=\"kw\">월 총지출에 포함</span>한다.","explain":"월 총지출은 변동지출+<span class=\"kw\">고정지출</span>이며 <span class=\"kw\">저축·투자액은 포함하지 않는다</span>.","id":"q8"},{"module":1,"subject":"재무설계 개론·직업윤리","topic":"재무설계 프로세스","ans":"O","html":"<span class=\"kw\">재무설계</span> <span class=\"kw\">1단계</span>는 고객과의 <span class=\"kw\">관계 정립 및 계약</span> 단계로, <span class=\"kw\">업무수행범위</span>와 이해상충 가능성을 명확히 안내한다.","explain":"<span class=\"kw\">1단계</span>의 핵심은 서비스 범위·역할·이해상충 안내와 <span class=\"kw\">신뢰관계 구축</span>이다.","id":"q9"},{"module":1,"subject":"재무설계 개론·직업윤리","topic":"재무설계 프로세스","ans":"X","html":"<span class=\"kw\">2단계</span> 고객 정보 수집 단계에서는 <span class=\"kw\">재무적 정보만</span> 수집하고 비재무적 정보는 다루지 않는다.","explain":"<span class=\"kw\">2단계</span>에서는 재무적 정보와 함께 <span class=\"kw\">비재무적 정보</span>(가치관·기대수준 등)를 모두 수집한다.","id":"q10"},{"module":1,"subject":"재무설계 개론·직업윤리","topic":"윤리원칙","ans":"O","html":"윤리원칙 중 <span class=\"kw\">이해상충 관리의 원칙</span>은 <span class=\"kw\">고객 이익 우선의 원칙</span>을 실질적으로 실현하는 핵심 장치다.","explain":"수수료 등 <span class=\"kw\">이해상충</span> 가능성을 <span class=\"kw\">사전에 공개</span>하고 고객에게 가장 유리한 선택을 제안하는 것이 이 원칙이다.","id":"q11"},{"module":1,"subject":"재무설계 개론·직업윤리","topic":"윤리원칙","ans":"X","html":"<span class=\"kw\">비밀유지의 원칙</span>은 <span class=\"kw\">예외가 전혀 없이</span> 고객 정보를 제공해서는 안 된다는 원칙이다.","explain":"법령에 따른 요구나 <span class=\"kw\">자기 방어권</span> 행사 등 예외적으로 정보 제공이 <span class=\"kw\">허용</span>되는 경우가 있다.","id":"q12"},{"module":1,"subject":"재무설계 개론·직업윤리","topic":"결격사유","ans":"O","html":"파산자로서 복권되지 않았거나 <span class=\"kw\">파산신청 후 5년</span>이 지나지 않은 자는 재무설계사 <span class=\"kw\">결격사유</span>에 해당한다.","explain":"파산 관련 결격은 <span class=\"kw\">복권 여부</span>와 <span class=\"kw\">5년</span> 경과 여부로 판단한다.","id":"q13"},{"module":1,"subject":"재무설계 개론·직업윤리","topic":"결격사유","ans":"X","html":"금고 이상의 형의 <span class=\"kw\">집행유예</span>를 선고받고 그 기간이 경과한 후 <span class=\"kw\">3년</span>이 지나지 않은 자가 <span class=\"kw\">결격사유</span>다.","explain":"집행유예 기간 경과 후 <span class=\"kw\">1년</span>이 지나지 않은 자가 결격사유다(금고 이상 실형은 <span class=\"kw\">3년</span>).","id":"q14"},{"module":1,"subject":"재무설계 개론·직업윤리","topic":"금융소비자보호","ans":"O","html":"금융소비자보호법상 <span class=\"kw\">적합성·적정성 원칙</span>은 <span class=\"kw\">전문금융소비자</span>에게는 적용되지 않는다.","explain":"<span class=\"kw\">전문금융소비자에게</span>는 <span class=\"kw\">설명의무·불공정영업행위금지·부당권유·위법계약해지권</span>만 적용된다.","id":"q15"},{"module":1,"subject":"재무설계 개론·직업윤리","topic":"금융소비자보호","ans":"X","html":"<span class=\"kw\">전문금융소비자</span>도 모든 금융상품에 대해 <span class=\"kw\">청약철회권</span>을 행사할 수 있다.","explain":"청약철회권은 <span class=\"kw\">일반금융소비자</span>에게 <span class=\"kw\">인정</span>되는 권리다.","id":"q16"},{"module":1,"subject":"재무설계 개론·직업윤리","topic":"채무자 구제제도","ans":"O","html":"<span class=\"kw\">신용회복위원회</span>의 채무조정은 <span class=\"kw\">보증인</span>에게 <span class=\"kw\">동일한 효력</span>이 미치지만, 법원의 개인회생·파산에서는 인정되지 않는다.","explain":"<span class=\"kw\">보증인 피해</span>를 줄이려면 <span class=\"kw\">신용회복위원회</span> 제도가 유리하다.","id":"q17"},{"module":1,"subject":"재무설계 개론·직업윤리","topic":"채무자 구제제도","ans":"X","html":"법원의 <span class=\"kw\">개인회생</span>은 총채무액이 <span class=\"kw\">15억 원</span>을 넘으면 신청할 수 없다.","explain":"개인회생 총채무액 한도는 <span class=\"kw\">25억 원</span>(담보 15억·무담보 10억)이다. 15억은 <span class=\"kw\">신용회복위원회</span> 채무조정 한도다.","id":"q18"},{"module":1,"subject":"은퇴설계","topic":"국민연금 보험료","ans":"O","html":"<span class=\"kw\">국민연금</span>의 <span class=\"kw\">보험료율은 9.5%</span>이고, 40년 가입 기준 <span class=\"kw\">소득대체율은 43%</span>이다.","explain":"보험료율은 매년 <span class=\"kw\">0.5%</span>p 올라 <span class=\"kw\">2033년 13%</span>가 된다.","id":"q19"},{"module":1,"subject":"은퇴설계","topic":"조기노령연금","ans":"X","html":"<span class=\"kw\">조기노령연금</span>은 최대 <span class=\"kw\">10년</span>까지 앞당겨 받을 수 있고, 1년당 <span class=\"kw\">6%</span>씩 감액된다.","explain":"앞당길 수 있는 기간은 최대 <span class=\"kw\">5년</span>이다(<span class=\"kw\">1년</span>당 6% 감액은 맞다).","id":"q20"},{"module":1,"subject":"은퇴설계","topic":"노령연금 연기","ans":"O","html":"<span class=\"kw\">노령연금</span>연기제도는 <span class=\"kw\">5년</span> 이내에서 신청할 수 있고 <span class=\"kw\">신청횟수 제한이 없으며</span>, 1년당 <span class=\"kw\">7.2%</span>씩 가산된다.","explain":"수급연령 도달일부터 <span class=\"kw\">5년</span> 이내에서 <span class=\"kw\">나눠 신청</span>할 수 있다.","id":"q21"},{"module":1,"subject":"은퇴설계","topic":"수급개시연령","ans":"X","html":"노령연금 <span class=\"kw\">수급개시연령</span>은 <span class=\"kw\">1969년생 이후</span> 출생자도 <span class=\"kw\">60세</span>다.","explain":"<span class=\"kw\">1969년</span>생 이후는 <span class=\"kw\">65세</span>다. 60세는 1952년생 이전 출생자 기준이다.","id":"q22"},{"module":1,"subject":"은퇴설계","topic":"분할연금","ans":"O","html":"분할연금은 <span class=\"kw\">혼인기간 5년 이상</span>이고 <span class=\"kw\">수급개시연령</span>에 도달한 뒤 이혼한 경우 <span class=\"kw\">연금액의 1/2</span>을 받는다.","explain":"이혼·수급개시연령 도달·혼인기간 <span class=\"kw\">5년</span> 이상이 <span class=\"kw\">3대 요건</span>이다.","id":"q23"},{"module":1,"subject":"은퇴설계","topic":"유족연금","ans":"X","html":"유족연금은 가입기간이 <span class=\"kw\">10년 이상 20년 미만</span>이면 <span class=\"kw\">기본연금액</span>의 <span class=\"kw\">40%</span>다.","explain":"10~<span class=\"kw\">20년</span> 미만은 <span class=\"kw\">50%</span>다(10년 미만 40%, 20년 이상 60%).","id":"q24"},{"module":1,"subject":"은퇴설계","topic":"장애연금","ans":"O","html":"장애연금 <span class=\"kw\">4급</span>은 <span class=\"kw\">기본연금액</span>의 <span class=\"kw\">225%</span>를 <span class=\"kw\">일시보상금</span>으로 지급한다.","explain":"<span class=\"kw\">1급</span> 100%, 2급 80%, 3급 60%는 연금, 4급만 <span class=\"kw\">일시금</span>이다.","id":"q25"},{"module":1,"subject":"은퇴설계","topic":"중복급여 조정","ans":"X","html":"노령연금과 유족연금이 중복되면 <span class=\"kw\">유족연금을 선택</span>해 <span class=\"kw\">노령연금 + 유족연금의 30%</span>를 받는다.","explain":"<span class=\"kw\">노령연금을 선택</span>할 때 노령연금+유족연금의 <span class=\"kw\">30%</span>이고, 유족연금을 선택하면 유족연금만 받는다.","id":"q26"},{"module":1,"subject":"은퇴설계","topic":"공적연금 연계","ans":"O","html":"<span class=\"kw\">공적연금 연계</span>는 <span class=\"kw\">10년</span>(군인연금은 20년)이며, <span class=\"kw\">임의계속가입기간</span>은 연계대상기간에는 빠지지만 연금액 산정에는 포함된다.","explain":"<span class=\"kw\">연계대상기간</span>과 급여산정기간을 <span class=\"kw\">구분</span>하는 것이 포인트다.","id":"q27"},{"module":1,"subject":"은퇴설계","topic":"크레딧","ans":"X","html":"<span class=\"kw\">실업크레딧</span>은 구직급여 수급자가 보험료의 <span class=\"kw\">50%</span>를 부담하고 <span class=\"kw\">24개월</span>까지 지원된다.","explain":"본인부담은 <span class=\"kw\">25%</span>, 지원 한도는 <span class=\"kw\">12개월</span>이다.","id":"q28"},{"module":1,"subject":"은퇴설계","topic":"출산크레딧","ans":"O","html":"2026년 이후 <span class=\"kw\">출산크레딧</span>은 <span class=\"kw\">1자녀 12개월</span>, 2자녀 24개월, 3자녀 이상은 <span class=\"kw\">1명당 18개월</span>에 <span class=\"kw\">상한이 없다</span>.","explain":"<span class=\"kw\">2025년</span> 이전 출생 자녀는 3자녀 이상 가산 상한이 <span class=\"kw\">50개월</span>이었다.","id":"q29"},{"module":1,"subject":"은퇴설계","topic":"추후납부","ans":"X","html":"국민연금 <span class=\"kw\">추후납부</span>는 <span class=\"kw\">10년(120개월)</span>까지 가능하다.","explain":"<span class=\"kw\">10년 미만(119개월)</span> 범위에서 최대 <span class=\"kw\">60회</span> 분납할 수 있다.","id":"q30"},{"module":1,"subject":"은퇴설계","topic":"기초연금","ans":"O","html":"<span class=\"kw\">기초연금</span>은 <span class=\"kw\">65세 이상</span> 노인의 <span class=\"kw\">70%</span>에게 지급되고, <span class=\"kw\">부부 감액 20%</span>가 적용된다.","explain":"소득 하위 <span class=\"kw\">70%</span>를 대상으로 하며, 부부가 함께 받으면 <span class=\"kw\">20% 감액</span>된다.","id":"q31"},{"module":1,"subject":"은퇴설계","topic":"주택연금","ans":"X","html":"<span class=\"kw\">주택연금</span>은 <span class=\"kw\">60세 이상</span>이면 가입할 수 있다.","explain":"<span class=\"kw\">가입 연령</span>은 <span class=\"kw\">55세 이상</span>이다.","id":"q32"},{"module":1,"subject":"은퇴설계","topic":"주택연금","ans":"O","html":"<span class=\"kw\">주택연금</span>은 <span class=\"kw\">부부 모두 사망</span>할 때까지 지급되고, 이자비용은 <span class=\"kw\">소득공제 200만 원</span> 한도로 공제된다.","explain":"<span class=\"kw\">평생 지급</span>되는 <span class=\"kw\">종신형</span>이 기본 구조다.","id":"q33"},{"module":1,"subject":"은퇴설계","topic":"퇴직연금","ans":"X","html":"<span class=\"kw\">DB형</span> 퇴직연금은 근로자가 <span class=\"kw\">중도인출</span>을 자유롭게 할 수 있다.","explain":"<span class=\"kw\">DB형</span>은 <span class=\"kw\">중도인출이 금지</span>된다.","id":"q34"},{"module":1,"subject":"은퇴설계","topic":"퇴직연금","ans":"O","html":"<span class=\"kw\">DC형</span>은 <span class=\"kw\">근로자가 운용책임</span>을 지고 <span class=\"kw\">추가납입</span>이 가능하며, 위험자산은 <span class=\"kw\">집합투자</span> 방법으로만 투자할 수 있다.","explain":"<span class=\"kw\">상장·비상장 주식</span>은 <span class=\"kw\">직접투자가 금지</span>된다.","id":"q35"},{"module":1,"subject":"은퇴설계","topic":"IRP","ans":"X","html":"<span class=\"kw\">IRP</span>는 <span class=\"kw\">1개 금융회사</span>에 <span class=\"kw\">여러 개</span> 계좌를 개설할 수 있다.","explain":"<span class=\"kw\">여러 금융회사</span>에 개설할 수 있지만 <span class=\"kw\">1개 회사에는 1개</span>만 가능하다.","id":"q36"},{"module":1,"subject":"은퇴설계","topic":"연금계좌 세액공제","ans":"O","html":"<span class=\"kw\">연금계좌 세액공제</span>는 총급여 <span class=\"kw\">5,500만 원 이하</span>면 <span class=\"kw\">900만 원</span>까지 <span class=\"kw\">15%</span> 공제된다.","explain":"<span class=\"kw\">5,500만</span> 원 초과는 900만 원 한도에 <span class=\"kw\">12%</span>가 적용된다(연금저축 단독은 600만 원).","id":"q37"},{"module":1,"subject":"은퇴설계","topic":"ISA 전환","ans":"X","html":"<span class=\"kw\">ISA 만기</span> 전환금액의 세액공제는 전환금액의 <span class=\"kw\">5%(200만 원 한도)</span>다.","explain":"<span class=\"kw\">전환금액</span>의 <span class=\"kw\">10%(300만 원 한도)</span>가 추가 공제된다.","id":"q38"},{"module":1,"subject":"은퇴설계","topic":"연금수령한도","ans":"O","html":"<span class=\"kw\">연금수령한도</span>는 <span class=\"kw\">연금계좌평가액</span> ÷ <span class=\"kw\">(11 - 연금수령연차)</span> × 120%로 계산한다.","explain":"한도를 넘겨 인출하면 초과분은 <span class=\"kw\">기타소득세 15%</span>로 <span class=\"kw\">과세</span>된다.","id":"q39"},{"module":1,"subject":"은퇴설계","topic":"연금저축","ans":"X","html":"<span class=\"kw\">연금저축</span>은 <span class=\"kw\">가입 후 5년</span>이 지나면 <span class=\"kw\">50세</span>부터 연금으로 수령할 수 있다.","explain":"가입 후 <span class=\"kw\">5년</span> 경과 + <span class=\"kw\">55세 이후</span>가 연금수령 요건이다.","id":"q40"},{"module":1,"subject":"부동산설계","topic":"토지의 자연적 특성","ans":"O","html":"토지의 <span class=\"kw\">부동성</span> 때문에 부동산 시장이 <span class=\"kw\">국지화</span>되고 <span class=\"kw\">현장답사</span>가 필요하며, 부동산중개업 제도화의 근거가 된다.","explain":"<span class=\"kw\">부동산활동</span>에서 가장 중요한 <span class=\"kw\">입지설정</span>이 필요한 이유도 부동성이다.","id":"q41"},{"module":1,"subject":"부동산설계","topic":"토지의 자연적 특성","ans":"X","html":"토지의 <span class=\"kw\">부증성</span> 때문에 <span class=\"kw\">감가상각이 배제</span>된다.","explain":"감가상각 배제는 <span class=\"kw\">영속성</span>의 효과다. 부증성은 <span class=\"kw\">공급곡선을 비탄력적</span>으로 만든다.","id":"q42"},{"module":1,"subject":"부동산설계","topic":"토지의 자연적 특성","ans":"O","html":"토지의 <span class=\"kw\">개별성</span>으로 <span class=\"kw\">비대체성</span>을 갖고 <span class=\"kw\">일물일가의 법칙</span>이 배제된다.","explain":"<span class=\"kw\">물리적</span>으로 완전히 같은 토지는 <span class=\"kw\">존재하지 않는다</span>.","id":"q43"},{"module":1,"subject":"부동산설계","topic":"수요·공급 변화","ans":"X","html":"금리가 <span class=\"kw\">인하</span>되면 부동산 수요가 <span class=\"kw\">감소</span>한다.","explain":"<span class=\"kw\">금리 인하</span>는 자금조달 비용을 낮춰 수요를 <span class=\"kw\">증가</span>시킨다.","id":"q44"},{"module":1,"subject":"부동산설계","topic":"보유세 효과","ans":"O","html":"주택 보유세가 강화되면 임대주택 <span class=\"kw\">공급이 감소</span>해 <span class=\"kw\">임대료가 상승</span>한다.","explain":"<span class=\"kw\">자가 수요</span>는 줄고 <span class=\"kw\">임대 공급</span>도 줄어 주택가격 하락·임대료 상승이 나타난다.","id":"q45"},{"module":1,"subject":"부동산설계","topic":"물권과 채권","ans":"X","html":"<span class=\"kw\">물권</span>은 대체로 임의규정이고, <span class=\"kw\">채권</span>은 대체로 강행규정이다.","explain":"반대다. 물권은 <span class=\"kw\">강행규정</span>, 채권은 <span class=\"kw\">임의규정</span>이 지배한다.","id":"q46"},{"module":1,"subject":"부동산설계","topic":"지목","ans":"O","html":"<span class=\"kw\">지목</span> 부호는 <span class=\"kw\">초성</span>으로 사용하는 것이 원칙이고, <span class=\"kw\">장·차·천·원</span>은 예외로 제외된다.","explain":"<span class=\"kw\">지목 부호</span>는 <span class=\"kw\">초성</span>이 원칙이고, 공장용지·주차장·하천·유원지가 <span class=\"kw\">예외</span>다.","id":"q47"},{"module":1,"subject":"부동산설계","topic":"경매와 공매","ans":"O","html":"<span class=\"kw\">공매</span>의 입찰보증금은 <span class=\"kw\">입찰가격의 10%</span>이고, <span class=\"kw\">1천만 원</span> 초과 시 분할납부할 수 있다.","explain":"<span class=\"kw\">경매</span>는 <span class=\"kw\">최저매각가격의 10%</span>를 보증금으로 낸다.","id":"q48"},{"module":1,"subject":"부동산설계","topic":"경매와 공매","ans":"X","html":"<span class=\"kw\">공매</span>는 <span class=\"kw\">인도명령</span>을 받은 뒤 <span class=\"kw\">명도소송</span>을 진행한다.","explain":"<span class=\"kw\">공매</span>에는 <span class=\"kw\">인도명령 제도가 없고</span> 명도소송만 가능하다.","id":"q49"},{"module":1,"subject":"부동산설계","topic":"해제와 해지","ans":"O","html":"계약 <span class=\"kw\">해제</span>는 <span class=\"kw\">소급효</span>와 원상복구의무, <span class=\"kw\">해지</span>는 장래효와 청산의무를 갖는다.","explain":"<span class=\"kw\">1회성 거래</span>(매매)는 해제, <span class=\"kw\">계속적 거래</span>(임대차)는 해지가 적용된다.","id":"q50"},{"module":1,"subject":"부동산설계","topic":"주택임대차보호법","ans":"X","html":"주택임대차 <span class=\"kw\">대항력</span>은 인도와 전입신고를 마치면 <span class=\"kw\">즉시</span> 발생한다.","explain":"<span class=\"kw\">인도+전입신고</span>를 마친 <span class=\"kw\">다음 날 0시</span>부터 발생한다.","id":"q51"},{"module":1,"subject":"부동산설계","topic":"계약 갱신","ans":"X","html":"<span class=\"kw\">계약갱신요구권</span>은 기간 종료 <span class=\"kw\">3개월 전부터 1개월 전</span>까지 행사할 수 있다.","explain":"<span class=\"kw\">6개월 전부터 2개월 전</span>까지 행사하며, <span class=\"kw\">1회</span>에 한해 요구할 수 있다.","id":"q52"},{"module":1,"subject":"부동산설계","topic":"차임 증감","ans":"X","html":"<span class=\"kw\">차임</span> 증액 청구는 약정 차임의 <span class=\"kw\">20분의 1</span>을 초과할 수 있고, <span class=\"kw\">6개월</span>이 지나면 다시 청구할 수 있다.","explain":"20분의 1을 <span class=\"kw\">초과할 수 없고</span>, 증액 후 <span class=\"kw\">1년 이내</span>에는 다시 청구할 수 없다.","id":"q53"},{"module":1,"subject":"부동산설계","topic":"보증금 전환","ans":"O","html":"주택 <span class=\"kw\">보증금</span>의 월차임 전환률은 <span class=\"kw\">연 10%</span> 또는 <span class=\"kw\">기준금리 + 2%</span> 중 <span class=\"kw\">낮은 비율</span>로 제한된다.","explain":"상가건물은 <span class=\"kw\">연 12%</span> 또는 기준금리×<span class=\"kw\">4.5배</span> 중 낮은 비율이다.","id":"q54"},{"module":1,"subject":"부동산설계","topic":"상가건물임대차보호법","ans":"X","html":"<span class=\"kw\">상가건물임대차보호법</span>은 서울특별시의 경우 <span class=\"kw\">보증금 5억 원</span> 이하인 임대차에 적용된다.","explain":"<span class=\"kw\">서울</span>은 <span class=\"kw\">9억 원</span> 이하다.","id":"q55"},{"module":1,"subject":"부동산설계","topic":"재개발과 재건축","ans":"O","html":"<span class=\"kw\">재개발</span>은 세입자 대책이 있고 개발부담금이 <span class=\"kw\">없지만</span>, <span class=\"kw\">재건축</span>은 재건축진단을 실시하고 <span class=\"kw\">개발부담금을 부과</span>한다.","explain":"<span class=\"kw\">재건축</span>은 정비기반시설이 <span class=\"kw\">양호</span>한 공동주택 밀집지역에서 진행된다.","id":"q56"},{"module":1,"subject":"부동산설계","topic":"재개발과 재건축","ans":"X","html":"<span class=\"kw\">재건축</span> 조합설립은 <span class=\"kw\">구분소유자 100분의 70 이상</span>과 <span class=\"kw\">토지면적 2분의 1</span> 이상의 동의로 이루어진다.","explain":"재건축은 <span class=\"kw\">토지면적 100분의 70 이상</span> + 각 동 과반수 동의가 필요하다. 2분의 1은 <span class=\"kw\">재개발</span> 기준이다.","id":"q57"},{"module":1,"subject":"부동산설계","topic":"리츠","ans":"O","html":"<span class=\"kw\">자기관리</span> 부동산투자회사(일반 REITs)는 <span class=\"kw\">실체회사</span>이고, 위탁관리·기업구조조정 <span class=\"kw\">리츠</span>는 <span class=\"kw\">명목회사</span>다.","explain":"<span class=\"kw\">자기관리</span>는 임직원을 상근으로 두고 <span class=\"kw\">직접 운용</span>한다.","id":"q58"},{"module":1,"subject":"부동산설계","topic":"생활형 숙박시설","ans":"X","html":"<span class=\"kw\">생활형 숙박시설</span>은 <span class=\"kw\">주택법</span>의 적용을 받고 <span class=\"kw\">주택 수에 포함</span>된다.","explain":"<span class=\"kw\">건축법</span> 적용을 받는 숙박시설이며 주택 수에 <span class=\"kw\">포함</span>되지 않는다.","id":"q59"},{"module":1,"subject":"부동산설계","topic":"건축허가","ans":"O","html":"<span class=\"kw\">건축허가</span>는 받은 날부터 <span class=\"kw\">2년</span> 안에 착수해야 하고, 정당한 사유가 있으면 <span class=\"kw\">1년</span> 범위에서 연장할 수 있다.","explain":"<span class=\"kw\">21층 이상</span> 또는 연면적 <span class=\"kw\">10만㎡ 이상</span>은 특별시장·광역시장 허가 대상이다.","id":"q60"},{"module":1,"subject":"상속설계","topic":"상속결격","ans":"O","html":"<span class=\"kw\">상속결격</span>에서 상해로 사망에 이르게 한 경우 <span class=\"kw\">상해의 고의</span>만 있으면 되고, <span class=\"kw\">상속에 유리하다는 인식</span>은 필요 없다.","explain":"<span class=\"kw\">살해·살해 미수</span>는 고의만 있으면 되고, <span class=\"kw\">낙태</span>도 상속결격에 해당한다.","id":"q61"},{"module":1,"subject":"상속설계","topic":"상속결격","ans":"X","html":"<span class=\"kw\">낙태</span>는 <span class=\"kw\">상속결격 사유</span>에 해당하지 않는다.","explain":"<span class=\"kw\">낙태</span>도 <span class=\"kw\">상속결격</span>에 해당한다.","id":"q62"},{"module":1,"subject":"상속설계","topic":"대습상속","ans":"X","html":"<span class=\"kw\">대습상속</span>은 <span class=\"kw\">상속을 포기한 자</span>의 직계비속에게도 인정된다.","explain":"대습상속 요건은 <span class=\"kw\">선사망·상속결격·동시사망 추정</span>이며, 상속포기는 <span class=\"kw\">포함</span>되지 않는다.","id":"q63"},{"module":1,"subject":"상속설계","topic":"대습상속","ans":"O","html":"<span class=\"kw\">대습상속</span>에서 <span class=\"kw\">피대습자의 배우자</span>는 피대습자가 <span class=\"kw\">피상속인보다 먼저 사망</span>한 경우에만 인정된다.","explain":"<span class=\"kw\">배우자</span>의 대습상속은 <span class=\"kw\">선사망</span> 요건을 엄격히 본다.","id":"q64"},{"module":1,"subject":"상속설계","topic":"상속포기","ans":"X","html":"<span class=\"kw\">상속포기</span>는 <span class=\"kw\">채권자 취소</span>의 대상이 된다.","explain":"<span class=\"kw\">상속포기</span>는 <span class=\"kw\">채권자 취소 대상이 되지 않는다</span>.","id":"q65"},{"module":1,"subject":"상속설계","topic":"승인과 포기","ans":"O","html":"상속의 승인·포기 고려기간은 상속개시를 안 날부터 <span class=\"kw\">3개월</span>이고, <span class=\"kw\">한정승인·포기</span>는 고려기간 내에도 <span class=\"kw\">취소할 수 없다</span>.","explain":"<span class=\"kw\">고려기간</span> 내에는 <span class=\"kw\">철회</span>가 제한된다.","id":"q66"},{"module":1,"subject":"상속설계","topic":"법정단순승인","ans":"X","html":"<span class=\"kw\">장례비용</span>을 지출하면 <span class=\"kw\">법정단순승인</span>이 된다.","explain":"<span class=\"kw\">장례비용</span>은 상속재산의 <span class=\"kw\">처분행위에 해당하지 않는다</span>.","id":"q67"},{"module":1,"subject":"상속설계","topic":"유언의 방식","ans":"O","html":"<span class=\"kw\">비밀증서</span>는 봉서 표면 기재일부터 <span class=\"kw\">5일</span> 내 확정일자를, <span class=\"kw\">구수증서</span>는 급박한 사유 종료일부터 <span class=\"kw\">7일</span> 내 검인을 신청한다.","explain":"구수증서는 <span class=\"kw\">다른 방식의 유언이 불가능한 경우</span>에만 예외적으로 <span class=\"kw\">허용</span>된다.","id":"q68"},{"module":1,"subject":"상속설계","topic":"유언의 검인","ans":"X","html":"유언은 법원의 <span class=\"kw\">검인</span>을 받지 않으면 <span class=\"kw\">효력이 없다</span>.","explain":"<span class=\"kw\">검인 절차</span>의 유무는 유언의 <span class=\"kw\">효력에 영향을 주지 않는다</span>.","id":"q69"},{"module":1,"subject":"상속설계","topic":"유류분","ans":"O","html":"<span class=\"kw\">유류분</span> 비율은 배우자·직계비속 <span class=\"kw\">1/2</span>, 직계존속 <span class=\"kw\">1/3</span>이며 <span class=\"kw\">형제자매</span>는 대상에서 제외된다.","explain":"<span class=\"kw\">형제자매 유류분</span>은 <span class=\"kw\">법 개정으로 폐지</span>되었다.","id":"q70"},{"module":1,"subject":"상속설계","topic":"유류분 반환","ans":"X","html":"<span class=\"kw\">유류분 반환</span>청구권은 사실을 안 때부터 <span class=\"kw\">3년</span>, 상속개시부터 <span class=\"kw\">10년</span>의 소멸시효가 적용된다.","explain":"안 때부터 <span class=\"kw\">1년</span>, 상속개시부터 <span class=\"kw\">10년</span>이다.","id":"q71"},{"module":1,"subject":"상속설계","topic":"유류분 산정","ans":"O","html":"<span class=\"kw\">유류분</span> 산정의 기초재산은 <span class=\"kw\">상속재산 + 증여재산 − 상속채무</span>로 계산한다.","explain":"공동상속인에 대한 증여는 <span class=\"kw\">기간 제한 없이</span> <span class=\"kw\">가산</span>된다.","id":"q72"},{"module":1,"subject":"상속설계","topic":"간주상속재산","ans":"O","html":"<span class=\"kw\">간주상속재산</span>에는 생명·손해보험금, 신탁재산, 퇴직금이 포함되지만 법령에 따른 <span class=\"kw\">유족연금</span>은 포함되지 않는다.","explain":"<span class=\"kw\">법령</span>에 따른 <span class=\"kw\">유족연금 등은 제외</span>된다.","id":"q73"},{"module":1,"subject":"상속설계","topic":"추정상속재산","ans":"O","html":"<span class=\"kw\">추정상속재산</span>은 상속개시 전 <span class=\"kw\">1년 이내 2억 원</span>, <span class=\"kw\">2년 이내 5억 원</span>을 기준으로 한다.","explain":"용도가 입증된 금액과 <span class=\"kw\">Min(처분금액×20%, 2억)</span>은 <span class=\"kw\">차감</span>한다.","id":"q74"},{"module":1,"subject":"상속설계","topic":"상속세 신고","ans":"X","html":"<span class=\"kw\">상속세</span> 신고기한은 상속개시일이 속한 달의 말일부터 <span class=\"kw\">3개월</span>이다.","explain":"상속세는 <span class=\"kw\">6개월</span>(비거주자 등 9개월)이다. 3개월은 <span class=\"kw\">증여세</span> 신고기한이다.","id":"q75"},{"module":1,"subject":"상속설계","topic":"상속공제","ans":"O","html":"<span class=\"kw\">일괄공제</span>는 5억 원이며, <span class=\"kw\">배우자 단독상속</span>인 경우에는 적용할 수 없다.","explain":"<span class=\"kw\">일괄공제</span>와 <span class=\"kw\">기초공제+인적공제</span> 중 유리한 방법을 선택한다.","id":"q76"},{"module":1,"subject":"상속설계","topic":"배우자상속공제","ans":"X","html":"<span class=\"kw\">배우자상속공제</span>는 최소 5억 원에서 최대 <span class=\"kw\">50억 원</span>까지 가능하다.","explain":"<span class=\"kw\">배우자상속공제</span>의 최대 한도는 <span class=\"kw\">30억 원</span>이다.","id":"q77"},{"module":1,"subject":"상속설계","topic":"증여재산공제","ans":"O","html":"<span class=\"kw\">증여재산공제</span>는 배우자 <span class=\"kw\">6억 원</span>, 직계존속 <span class=\"kw\">5천만 원</span>(미성년 자녀 2천만 원), 기타 친족 <span class=\"kw\">1천만 원</span>이다.","explain":"<span class=\"kw\">혼인·출산공제</span>는 기간 제한 없이 수증자별 <span class=\"kw\">1억 원</span>이 추가된다.","id":"q78"},{"module":1,"subject":"상속설계","topic":"재산 평가","ans":"X","html":"상속·증여재산의 <span class=\"kw\">평가기간</span>은 증여의 경우 평가기준일 <span class=\"kw\">전 6개월·후 6개월</span>이다.","explain":"증여는 전 <span class=\"kw\">6개월</span>·<span class=\"kw\">후 3개월</span>이다(상속은 전·후 각 6개월).","id":"q79"},{"module":1,"subject":"상속설계","topic":"보험금 과세","ans":"X","html":"<span class=\"kw\">계약자</span>와 피보험자가 모두 배우자이고 <span class=\"kw\">수익자</span>가 자녀인 보험은 피보험자 사망 시 <span class=\"kw\">상속세</span>가 과세된다.","explain":"계약자(배우자)가 생존하므로 <span class=\"kw\">증여세</span>가 <span class=\"kw\">과세</span>된다.","id":"q80"},{"module":2,"subject":"위험관리와 보험설계","topic":"위태의 종류","ans":"O","html":"빙판길 운전·주유소에서 담배는 <span class=\"kw\">물리적 위태</span>, 부정직·보험사기는 <span class=\"kw\">도덕적 위태</span>에 해당한다.","explain":"정신적 위태는 부주의·무관심처럼 <span class=\"kw\">고의가 없는</span> 상태이며, 넓은 의미에서 도덕적 위태에 <span class=\"kw\">포함</span>된다.","id":"q81"},{"module":2,"subject":"위험관리와 보험설계","topic":"위태의 종류","ans":"X","html":"<span class=\"kw\">도덕적 위태</span>에는 고의성이 없는 <span class=\"kw\">부주의나 무관심</span>이 포함된다.","explain":"부주의·무관심은 <span class=\"kw\">정신적 위태</span>다. 도덕적 위태는 부정직·사기 등 <span class=\"kw\">고의</span>가 전제된다.","id":"q82"},{"module":2,"subject":"위험관리와 보험설계","topic":"보험의 원리","ans":"O","html":"보험제도의 기본원리는 <span class=\"kw\">대수의 법칙</span>, <span class=\"kw\">수지상등의 원칙</span>, 급부·반대급부의 원칙이다.","explain":"<span class=\"kw\">손해보험</span>에는 이에 더해 <span class=\"kw\">실손보상(이득금지)의 원칙</span>이 적용된다.","id":"q83"},{"module":2,"subject":"위험관리와 보험설계","topic":"보험계약의 무효","ans":"X","html":"사망보험은 계약 당시 피보험자가 <span class=\"kw\">15세 미만</span>이면 <span class=\"kw\">예외 없이 무효</span>다.","explain":"<span class=\"kw\">심신박약자</span>가 <span class=\"kw\">의사능력이 있는 경우</span>나 단체보험 피보험자는 유효할 수 있다.","id":"q84"},{"module":2,"subject":"위험관리와 보험설계","topic":"보험계약의 취소","ans":"O","html":"약관 부본 미교부, 중요내용 미설명, <span class=\"kw\">청약서 자필서명</span> 누락이 있으면 <span class=\"kw\">3개월</span> 내에 계약을 <span class=\"kw\">취소</span>할 수 있다.","explain":"<span class=\"kw\">이 세 가지</span>가 실무상 <span class=\"kw\">3대 기본 지키기</span>다.","id":"q85"},{"module":2,"subject":"위험관리와 보험설계","topic":"부활","ans":"X","html":"실효된 보험계약은 <span class=\"kw\">5년</span> 이내에 <span class=\"kw\">부활</span>할 수 있다.","explain":"<span class=\"kw\">부활</span>은 <span class=\"kw\">3년</span> 이내에 약정이자와 함께 신청한다.","id":"q86"},{"module":2,"subject":"위험관리와 보험설계","topic":"계약유지 제도","ans":"O","html":"<span class=\"kw\">감액완납</span>은 보험금을 감액하고 보장기간은 유지하며, <span class=\"kw\">연장정기</span>는 보험금은 같고 보장기간을 단축하며 둘 다 해약환급금을 지급하지 않는다.","explain":"<span class=\"kw\">두 제</span>도 모두 <span class=\"kw\">보험료 미납</span> 시 활용된다.","id":"q87"},{"module":2,"subject":"위험관리와 보험설계","topic":"소멸시효","ans":"X","html":"보험금 청구권의 <span class=\"kw\">소멸시효</span>는 <span class=\"kw\">2년</span>이다.","explain":"보험금·해약환급금·보험료 반환 청구권의 <span class=\"kw\">소멸시효</span>는 모두 <span class=\"kw\">3년</span>이다.","id":"q88"},{"module":2,"subject":"위험관리와 보험설계","topic":"고지의무","ans":"O","html":"<span class=\"kw\">고지의무</span>를 위반해도 <span class=\"kw\">계약 체결 후 3년</span>이 지나거나 <span class=\"kw\">보장개시일부터 2년</span> 동안 지급사유가 없으면 해지할 수 없다.","explain":"진단계약은 <span class=\"kw\">2년</span>이 <span class=\"kw\">1년</span>으로 단축된다.","id":"q89"},{"module":2,"subject":"위험관리와 보험설계","topic":"사기 계약","ans":"X","html":"<span class=\"kw\">사기</span>에 의한 보험계약은 <span class=\"kw\">3년</span> 이내에 취소할 수 있다.","explain":"사기 계약은 보장개시일부터 <span class=\"kw\">5년</span> 이내(안 날부터 <span class=\"kw\">1개월</span>) 취소할 수 있다.","id":"q90"},{"module":2,"subject":"위험관리와 보험설계","topic":"주택화재보험","ans":"O","html":"<span class=\"kw\">주택화재보험</span>은 보험가입금액이 보험가액의 <span class=\"kw\">80%</span> 미만이면 <span class=\"kw\">비례보상</span>한다.","explain":"<span class=\"kw\">80% Co-Insurance</span>로 계산해 <span class=\"kw\">비례보상</span>한다.","id":"q91"},{"module":2,"subject":"위험관리와 보험설계","topic":"배상책임보험","ans":"X","html":"<span class=\"kw\">배상책임보험</span>에도 <span class=\"kw\">보험가액</span>·중복보험·초과보험 개념이 있다.","explain":"<span class=\"kw\">배상책임보험</span>에는 세 개념이 모두 <span class=\"kw\">없다</span>.","id":"q92"},{"module":2,"subject":"위험관리와 보험설계","topic":"자동복원제도","ans":"O","html":"<span class=\"kw\">자동복원제도</span>는 지급보험금이 보험가입금액의 <span class=\"kw\">80% 미만</span>이면 잔여기간의 보험가입금액을 <span class=\"kw\">감액하지 않는다</span>.","explain":"<span class=\"kw\">일반손해보험</span>으로 설계하면 사고 후 <span class=\"kw\">가입금액이 차감</span>된다.","id":"q93"},{"module":2,"subject":"위험관리와 보험설계","topic":"자동차 의무보험","ans":"X","html":"<span class=\"kw\">자동차 의무보험</span>의 <span class=\"kw\">대물보상</span>은 1사고당 <span class=\"kw\">1억 원</span> 한도로 보상한다.","explain":"<span class=\"kw\">대물</span>은 <span class=\"kw\">2천만 원</span> 한도이고, 대인배상Ⅰ은 1인당 유한·1사고당 무한이다.","id":"q94"},{"module":2,"subject":"위험관리와 보험설계","topic":"교통사고처리특례법","ans":"X","html":"사망사고·뺑소니·<span class=\"kw\">12대 중과실</span> 사고에도 <span class=\"kw\">보험가입 특례</span>가 적용된다.","explain":"<span class=\"kw\">이 세 경우</span>는 형사합의와 관계없이 <span class=\"kw\">형사처벌</span>을 받는다.","id":"q95"},{"module":2,"subject":"위험관리와 보험설계","topic":"자동차손해배상보장법","ans":"O","html":"<span class=\"kw\">자동차손해배상보장법</span>은 <span class=\"kw\">조건부 무과실책임</span>을 채택하고, 입증책임은 <span class=\"kw\">가해자(운행자)</span>에게 있다.","explain":"<span class=\"kw\">민법</span>은 <span class=\"kw\">과실책임</span>·피해자 입증이 원칙이다.","id":"q96"},{"module":2,"subject":"위험관리와 보험설계","topic":"실손의료보험","ans":"X","html":"<span class=\"kw\">실손의료보험</span>의 <span class=\"kw\">비급여</span> 자기부담률은 <span class=\"kw\">20%</span>다.","explain":"급여 <span class=\"kw\">20%</span>, <span class=\"kw\">비급여 30%</span>다.","id":"q97"},{"module":2,"subject":"위험관리와 보험설계","topic":"질병보험","ans":"O","html":"<span class=\"kw\">암보험</span>의 <span class=\"kw\">대기기간은 90일</span>이고, 갱신형은 갱신 후 <span class=\"kw\">대기기간을 두지 않는다</span>.","explain":"<span class=\"kw\">대기기간</span>은 <span class=\"kw\">역선택</span> 방지를 위한 장치다.","id":"q98"},{"module":2,"subject":"위험관리와 보험설계","topic":"노인장기요양보험","ans":"X","html":"<span class=\"kw\">노인장기요양보험</span>은 <span class=\"kw\">시설급여 85%</span>, <span class=\"kw\">재가급여 80%</span>를 지급한다.","explain":"시설 <span class=\"kw\">80%</span>, 재가 <span class=\"kw\">85%</span>다.","id":"q99"},{"module":2,"subject":"위험관리와 보험설계","topic":"제3보험","ans":"O","html":"<span class=\"kw\">제3보험</span>에서 <span class=\"kw\">질병사망</span>은 <span class=\"kw\">특약</span>으로만 담보되고, <span class=\"kw\">보장성</span> 상품으로만 개발할 수 있다.","explain":"<span class=\"kw\">제3보험</span>은 보험업법상 <span class=\"kw\">독립된 보험</span>이다.","id":"q100"},{"module":2,"subject":"위험관리와 보험설계","topic":"보험자대위","ans":"X","html":"<span class=\"kw\">생명보험</span>에도 <span class=\"kw\">보험자대위</span>가 원칙적으로 적용된다.","explain":"<span class=\"kw\">생명보험</span>은 대위가 <span class=\"kw\">적용되지 않는다</span>. 상해보험은 약정이 있으면 가능하다.","id":"q101"},{"module":2,"subject":"위험관리와 보험설계","topic":"장애인전용보험","ans":"O","html":"<span class=\"kw\">장애인전용보장성보험</span>은 세액공제 <span class=\"kw\">100만 원</span>(16.5%)과 보험금 연 <span class=\"kw\">4천만 원</span> 증여세 비과세 혜택이 있다.","explain":"일반 보장성보험(<span class=\"kw\">13.2%</span>)과 <span class=\"kw\">별개 한도</span>로 공제된다.","id":"q102"},{"module":2,"subject":"투자설계","topic":"금융투자상품","ans":"O","html":"이익·손실 회피 목적이 없거나 <span class=\"kw\">실물자산</span>이면 <span class=\"kw\">금융투자상품</span>이 아니며, <span class=\"kw\">원화표시 CD</span>·관리형 신탁은 제외되지만 <span class=\"kw\">변액보험</span>은 해당한다.","explain":"<span class=\"kw\">금융투자상품</span>은 <span class=\"kw\">원금손실 가능성</span>이 있는 권리여야 한다.","id":"q103"},{"module":2,"subject":"투자설계","topic":"고용지표","ans":"X","html":"<span class=\"kw\">실업률</span>은 실업자를 <span class=\"kw\">만 15세 이상 인구</span>로 나누어 계산한다.","explain":"분모는 <span class=\"kw\">경제활동인구</span>다. 고용률의 분모가 만 <span class=\"kw\">15세</span> 이상 인구다.","id":"q104"},{"module":2,"subject":"투자설계","topic":"고용지표","ans":"O","html":"<span class=\"kw\">고용률</span>은 취업자를 <span class=\"kw\">만 15세 이상 인구</span>로 나눈 비율이다.","explain":"<span class=\"kw\">취업률</span>은 취업자 ÷ <span class=\"kw\">경제활동인구</span> = 100 − 실업률이다.","id":"q105"},{"module":2,"subject":"투자설계","topic":"GDP 갭","ans":"O","html":"<span class=\"kw\">GDP 갭</span>이 <span class=\"kw\">양수</span>이면 실제 GDP가 잠재 GDP보다 높아 <span class=\"kw\">경기 과열</span> 상태다.","explain":"<span class=\"kw\">음수이면 생산요소</span>가 <span class=\"kw\">유휴</span> 상태임을 의미한다.","id":"q106"},{"module":2,"subject":"투자설계","topic":"금리와 물가","ans":"X","html":"<span class=\"kw\">물가 상승</span> 시 <span class=\"kw\">실질금리</span>도 함께 상승한다.","explain":"실질금리는 <span class=\"kw\">변동하지 않고</span> 명목금리만 <span class=\"kw\">상승</span>한다.","id":"q107"},{"module":2,"subject":"투자설계","topic":"환율","ans":"O","html":"<span class=\"kw\">환율 상승</span>은 <span class=\"kw\">원화가치 하락</span>(평가절하)을 의미한다.","explain":"<span class=\"kw\">환율</span>이 오르면 같은 달러를 사는 데 <span class=\"kw\">더 많은 원화</span>가 필요하다.","id":"q108"},{"module":2,"subject":"투자설계","topic":"기대수익률","ans":"O","html":"<span class=\"kw\">기대수익률</span>이 요구수익률보다 <span class=\"kw\">높으면</span> <span class=\"kw\">저평가</span> 상태이고 내재가치가 시장가격보다 크다.","explain":"<span class=\"kw\">기대수익률</span>이 낮으면 <span class=\"kw\">고평가</span> 상태다.","id":"q109"},{"module":2,"subject":"투자설계","topic":"자본시장선","ans":"X","html":"<span class=\"kw\">자본시장선(CML)</span>은 <span class=\"kw\">체계적 위험(β)</span>과 기대수익률의 관계를 나타낸다.","explain":"<span class=\"kw\">CML</span>은 <span class=\"kw\">총위험(σ)</span>과의 관계다. β와의 관계는 증권시장선(SML)이다.","id":"q110"},{"module":2,"subject":"투자설계","topic":"증권시장선","ans":"O","html":"<span class=\"kw\">증권시장선</span>(SML)에는 <span class=\"kw\">개별 자산</span>과 <span class=\"kw\">비효율적 포트폴리오</span>도 존재한다.","explain":"<span class=\"kw\">CML</span>은 <span class=\"kw\">효율적 포트폴리오</span>만 위치한다.","id":"q111"},{"module":2,"subject":"투자설계","topic":"상관계수","ans":"X","html":"<span class=\"kw\">상관계수</span>가 <span class=\"kw\">−1</span>에 가까울수록 분산투자 효과가 <span class=\"kw\">작아진다</span>.","explain":"<span class=\"kw\">상관계수 −1</span>에 가까울수록 위험이 줄어 분산효과가 <span class=\"kw\">커진다</span>.","id":"q112"},{"module":2,"subject":"투자설계","topic":"상대가치평가","ans":"O","html":"<span class=\"kw\">PER</span>은 <span class=\"kw\">주가 ÷ EPS</span>, PBR은 <span class=\"kw\">주가 ÷ BPS</span>로 계산한다.","explain":"<span class=\"kw\">PSR</span>은 <span class=\"kw\">주가 ÷ 주당매출액</span>이다.","id":"q113"},{"module":2,"subject":"투자설계","topic":"주식스타일","ans":"X","html":"<span class=\"kw\">가치스타일</span>은 <span class=\"kw\">고PER</span>·고PBR 주식에 투자하는 전략이다.","explain":"<span class=\"kw\">가치스타일</span>은 <span class=\"kw\">저PER</span>·고배당주에 투자한다.","id":"q114"},{"module":2,"subject":"투자설계","topic":"배당할인모형","ans":"X","html":"<span class=\"kw\">고든모형</span>은 배당성장률(g)이 요구수익률(k)보다 <span class=\"kw\">클 때</span> 성립한다.","explain":"<span class=\"kw\">고든모형</span>은 <span class=\"kw\">g가 k보다 작을 때</span>만 성립한다.","id":"q115"},{"module":2,"subject":"투자설계","topic":"채권가격","ans":"O","html":"채권은 수익률이 <span class=\"kw\">하락</span>할 때 가격 <span class=\"kw\">상승 폭</span>이 수익률 상승 시 하락 폭보다 <span class=\"kw\">크다</span>.","explain":"수익률 <span class=\"kw\">하락</span> 시 가격 상승 폭이 더 큰 것을 <span class=\"kw\">볼록성</span>이라 한다.","id":"q116"},{"module":2,"subject":"투자설계","topic":"듀레이션 전략","ans":"X","html":"<span class=\"kw\">금리 상승</span>이 예상되면 <span class=\"kw\">듀레이션을 확대</span>해 손실을 줄인다.","explain":"금리 <span class=\"kw\">상승</span> 시에는 듀레이션을 <span class=\"kw\">축소</span>한다.","id":"q117"},{"module":2,"subject":"투자설계","topic":"펀드 기준가격","ans":"X","html":"<span class=\"kw\">해외주식형 펀드</span>의 <span class=\"kw\">기준가격</span>은 <span class=\"kw\">전일 종가</span>를 반영해 산정한다.","explain":"<span class=\"kw\">해외자산 펀드</span>는 <span class=\"kw\">이틀 전 종가</span>를 반영한다.","id":"q118"},{"module":2,"subject":"투자설계","topic":"ETF","ans":"X","html":"패시브 <span class=\"kw\">ETF</span>의 괴리율은 국내자산 <span class=\"kw\">2%</span>, 해외자산 <span class=\"kw\">1%</span> 이내로 제한된다.","explain":"국내 <span class=\"kw\">1%</span>, 해외 <span class=\"kw\">2%</span>다.","id":"q119"},{"module":2,"subject":"투자설계","topic":"ETF","ans":"O","html":"<span class=\"kw\">액티브 ETF</span>는 기초지수와의 <span class=\"kw\">상관계수 0.7</span> 미만이 <span class=\"kw\">3개월</span> 이상 지속되면 상장폐지 사유가 된다.","explain":"<span class=\"kw\">패시브 ETF</span>의 기준은 <span class=\"kw\">0.9</span>다.","id":"q120"},{"module":2,"subject":"투자설계","topic":"주가연계상품","ans":"O","html":"<span class=\"kw\">ELS</span>는 <span class=\"kw\">예금자보호가 없고</span>, ELD는 <span class=\"kw\">예금자보호</span>가 된다.","explain":"<span class=\"kw\">ELD</span>는 <span class=\"kw\">은행법</span>상 예금으로 취급된다.","id":"q121"},{"module":2,"subject":"투자설계","topic":"자산배분","ans":"O","html":"<span class=\"kw\">전술적 자산배분</span>은 액티브 전략이지만, <span class=\"kw\">리밸런싱</span>은 원래 비중으로 재조정하는 <span class=\"kw\">수동적</span> 성격이다.","explain":"<span class=\"kw\">리밸런싱</span>은 <span class=\"kw\">저점매수·고점매도</span>를 자동 실행한다.","id":"q122"},{"module":2,"subject":"투자설계","topic":"마켓타이밍","ans":"X","html":"<span class=\"kw\">마켓타이밍</span>은 <span class=\"kw\">비교지수</span> 대비 초과수익을 추구하는 전략이다.","explain":"<span class=\"kw\">마켓타이밍</span>은 비교지수 없이 <span class=\"kw\">절대수익률</span>을 추구한다.","id":"q123"},{"module":2,"subject":"투자설계","topic":"대체투자","ans":"O","html":"<span class=\"kw\">대체투자</span>상품은 전통 자산과 <span class=\"kw\">낮은 상관관계</span>를 가지며 <span class=\"kw\">인플레이션 헤지</span>가 가능하다.","explain":"<span class=\"kw\">대체투자</span>는 포트폴리오 <span class=\"kw\">다변화</span> 수단으로 활용된다.","id":"q124"},{"module":2,"subject":"투자설계","topic":"TDF","ans":"X","html":"<span class=\"kw\">TDF</span>는 은퇴가 가까워질수록 <span class=\"kw\">주식 비중을 늘린다</span>.","explain":"<span class=\"kw\">은퇴</span>가 가까워지면 주식 비중을 <span class=\"kw\">줄인다</span>. 그 경로가 글라이드패스다.","id":"q125"},{"module":2,"subject":"투자설계","topic":"헤지펀드","ans":"X","html":"<span class=\"kw\">헤지펀드</span>의 <span class=\"kw\">차익거래전략</span>은 <span class=\"kw\">방향성 전략</span>에 속한다.","explain":"<span class=\"kw\">차익거래·이벤트드리븐</span>은 <span class=\"kw\">비방향성 전략</span>이다.","id":"q126"},{"module":2,"subject":"세금설계","topic":"납세의무 소멸","ans":"O","html":"<span class=\"kw\">소멸시효</span>는 <span class=\"kw\">5년</span>이지만 <span class=\"kw\">5억 원 이상</span>의 국세는 <span class=\"kw\">10년</span>이다.","explain":"납부·충당·부과처분 취소·<span class=\"kw\">제척기간 만료</span>도 <span class=\"kw\">소멸사유</span>에 해당한다.","id":"q127"},{"module":2,"subject":"세금설계","topic":"조세불복","ans":"X","html":"<span class=\"kw\">이의신청</span>은 처분이 있음을 안 날부터 <span class=\"kw\">60일</span> 이내에 제기한다.","explain":"<span class=\"kw\">이의신청</span> 기한은 <span class=\"kw\">90일</span>이다.","id":"q128"},{"module":2,"subject":"세금설계","topic":"조세불복","ans":"X","html":"<span class=\"kw\">이의신청</span>과 <span class=\"kw\">감사원 심사청구</span>를 <span class=\"kw\">동시에</span> 제기할 수 있다.","explain":"<span class=\"kw\">이의신청</span>을 하면 감사원 심사청구는 <span class=\"kw\">제기할 수 없다</span>.","id":"q129"},{"module":2,"subject":"세금설계","topic":"절세와 탈세","ans":"O","html":"<span class=\"kw\">조세회피</span>는 가산세가 부과되지만 <span class=\"kw\">형사처벌</span>은 받지 않는다.","explain":"<span class=\"kw\">탈세</span>는 <span class=\"kw\">조세범처벌법</span>에 따라 형사처벌될 수 있다.","id":"q130"},{"module":2,"subject":"세금설계","topic":"과점주주","ans":"O","html":"과점주주의 제2차 <span class=\"kw\">납세의무</span> 한도는 <span class=\"kw\">징수부족액 × 지분율</span>이고, <span class=\"kw\">상장법인</span>은 제외된다.","explain":"<span class=\"kw\">납세의무자</span>는 납세의무 성립일 현재의 <span class=\"kw\">과점주주</span>다.","id":"q131"},{"module":2,"subject":"세금설계","topic":"소득세 과세원칙","ans":"O","html":"<span class=\"kw\">종합소득</span>세율은 <span class=\"kw\">6~45%</span>의 8단계 초과누진세율이고, 이자·배당소득은 <span class=\"kw\">유형별 포괄주의</span>가 적용된다.","explain":"법인세는 <span class=\"kw\">포괄주의</span>(<span class=\"kw\">순자산증가설</span>)를 채택한다.","id":"q132"},{"module":2,"subject":"세금설계","topic":"결손금","ans":"X","html":"일반 사업소득의 <span class=\"kw\">결손금</span>은 <span class=\"kw\">배당소득</span>부터 공제한다.","explain":"<span class=\"kw\">결손금</span>은 <span class=\"kw\">근로 → 연금 → 기타 → 이자 → 배당</span> 순으로 공제한다.","id":"q133"},{"module":2,"subject":"세금설계","topic":"결손금","ans":"O","html":"<span class=\"kw\">부동산임대업</span>의 <span class=\"kw\">결손금</span>은 다른 소득에서 공제하지 않고 <span class=\"kw\">다음 과세기간으로 이월</span>한다.","explain":"<span class=\"kw\">부동산임대업</span> 결손금은 <span class=\"kw\">일반 사업소득</span>과 달리 이월해서만 공제한다.","id":"q134"},{"module":2,"subject":"세금설계","topic":"기준경비율","ans":"X","html":"<span class=\"kw\">기준경비율</span>은 <span class=\"kw\">복식부기의무자</span>도 <span class=\"kw\">100%</span>를 적용한다.","explain":"<span class=\"kw\">복식부기의무자</span>는 기준경비율의 <span class=\"kw\">50%</span>만 적용한다.","id":"q135"},{"module":2,"subject":"세금설계","topic":"단순경비율","ans":"O","html":"<span class=\"kw\">기준경비율</span> 대상자가 단순경비율로 신고하면 복식부기의무자는 <span class=\"kw\">3.4배</span>, 간편장부대상자는 <span class=\"kw\">2.8배</span>를 소득금액으로 계산한다.","explain":"<span class=\"kw\">단순경비율 대상자</span>는 <span class=\"kw\">기준경비율 신고</span>를 선택할 수 있다.","id":"q136"},{"module":2,"subject":"세금설계","topic":"비과세 근로소득","ans":"O","html":"<span class=\"kw\">자가운전보조금</span> 월 20만 원, <span class=\"kw\">식사대</span> 월 20만 원, 출산·보육수당 월 20만 원은 <span class=\"kw\">비과세</span>다.","explain":"단체보장성보험료는 연 <span class=\"kw\">70만 원</span>까지 <span class=\"kw\">비과세</span>다.","id":"q137"},{"module":2,"subject":"세금설계","topic":"인적공제","ans":"X","html":"<span class=\"kw\">기본공제</span>는 1인당 <span class=\"kw\">100만 원</span>이다.","explain":"<span class=\"kw\">기본공제</span>는 1인당 <span class=\"kw\">150만 원</span>이다.","id":"q138"},{"module":2,"subject":"세금설계","topic":"자녀세액공제","ans":"X","html":"<span class=\"kw\">자녀세액공제</span>는 <span class=\"kw\">6세 이상</span> 자녀를 대상으로 한다.","explain":"<span class=\"kw\">자녀세액공제</span>는 <span class=\"kw\">8세 이상</span> 자녀·손자녀가 대상이다.","id":"q139"},{"module":2,"subject":"세금설계","topic":"인적공제","ans":"X","html":"<span class=\"kw\">부녀자공제</span>와 <span class=\"kw\">한부모공제</span>는 <span class=\"kw\">중복 적용</span>된다.","explain":"<span class=\"kw\">중복</span>되는 경우 <span class=\"kw\">한부모공제만</span> 적용한다.","id":"q140"},{"module":2,"subject":"세금설계","topic":"부가가치세","ans":"O","html":"<span class=\"kw\">부가가치세</span> 일반과세자의 1기 확정신고는 <span class=\"kw\">7월 25일</span>, 2기 확정신고는 <span class=\"kw\">익년 1월 25일</span>까지다.","explain":"<span class=\"kw\">1기 예정신고</span>는 4월 25일, <span class=\"kw\">2기 예정신고</span>는 10월 25일이다.","id":"q141"},{"module":2,"subject":"세금설계","topic":"영세율","ans":"X","html":"<span class=\"kw\">영세율</span> 사업자는 매입세액을 <span class=\"kw\">공제받을 수 없다</span>.","explain":"영세율은 매입세액 <span class=\"kw\">공제가 가능</span>한 완전면세다. 면세가 공제 <span class=\"kw\">불가</span>다.","id":"q142"},{"module":2,"subject":"세금설계","topic":"전자세금계산서","ans":"O","html":"<span class=\"kw\">전자세금계산서</span>는 법인과 직전연도 <span class=\"kw\">공급가액 8천만 원 이상</span>인 개인사업자가 의무 발급한다.","explain":"<span class=\"kw\">전자세금계산서</span> 의무 위반 시 <span class=\"kw\">가산세</span>가 부과된다.","id":"q143"},{"module":2,"subject":"세금설계","topic":"현금영수증","ans":"X","html":"<span class=\"kw\">현금영수증</span>은 건당 <span class=\"kw\">5만 원</span> 이상 거래면 의무 발급되고, 미발급 시 <span class=\"kw\">10%</span> 가산세가 부과된다.","explain":"<span class=\"kw\">10만 원</span> 이상, 미발급 금액의 <span class=\"kw\">20%</span>다.","id":"q144"},{"module":2,"subject":"세금설계","topic":"금융소득 종합과세","ans":"O","html":"<span class=\"kw\">금융소득</span>이 <span class=\"kw\">2천만 원</span>을 넘으면 <span class=\"kw\">Gross-up 10%</span>를 더해 종합과세한다.","explain":"<span class=\"kw\">초과분</span>에만 <span class=\"kw\">기본세율</span>이 적용된다.","id":"q145"},{"module":2,"subject":"세금설계","topic":"대주주","ans":"X","html":"코스닥시장 상장주식의 <span class=\"kw\">대주주 기준</span>은 <span class=\"kw\">1%</span> 또는 50억 원이다.","explain":"코스닥은 <span class=\"kw\">2%</span>다(유가증권 <span class=\"kw\">1%</span>, 코넥스 4%).","id":"q146"},{"module":2,"subject":"세금설계","topic":"양도소득세","ans":"O","html":"1세대 1주택은 <span class=\"kw\">2년 이상 보유</span>하면 비과세되지만, <span class=\"kw\">12억 원 초과</span> 고가주택은 과세되고 <span class=\"kw\">장기보유특별공제</span>는 최대 <span class=\"kw\">80%</span>다.","explain":"<span class=\"kw\">조정대상지역 취득 주택</span>은 <span class=\"kw\">2년 이상 거주</span>도 필요하다.","id":"q147"},{"module":2,"subject":"세금설계","topic":"종합부동산세","ans":"X","html":"<span class=\"kw\">종합부동산세</span> 주택분 과세기준금액은 <span class=\"kw\">1세대 1주택자</span>도 <span class=\"kw\">9억 원</span>이다.","explain":"<span class=\"kw\">1세대 1주택자</span>는 <span class=\"kw\">12억 원</span>이다.","id":"q148"},{"module":2,"subject":"세금설계","topic":"퇴직소득","ans":"O","html":"<span class=\"kw\">퇴직소득</span>은 근속연수로 나눈 뒤 <span class=\"kw\">12를 곱한 환산급여</span>로 과세표준을 계산한다.","explain":"<span class=\"kw\">산출세액</span>도 12로 나눈 뒤 근속연수를 곱해 <span class=\"kw\">연분연승</span>한다.","id":"q149"},{"module":2,"subject":"세금설계","topic":"연금계좌 과세","ans":"X","html":"연금계좌 <span class=\"kw\">인출순서</span>는 <span class=\"kw\">운용수익 → 이연퇴직소득 → 과세제외금액</span>이다.","explain":"연금계좌 <span class=\"kw\">인출순서</span>는 <span class=\"kw\">과세제외금액 → 이연퇴직소득 → 그 외 소득</span>이다.","id":"q150"},{"module":1,"subject":"재무설계 개론·직업윤리","topic":"재무설계의 필요성","ans":"O","html":"<span class=\"kw\">재무설계의 필요성</span>으로 <span class=\"kw\">급격한 고령화</span>, <span class=\"kw\">금융환경의 변화</span>, <span class=\"kw\">소비자 니즈의 변화</span>가 꼽힌다.","explain":"기대수명 <span class=\"kw\">증가</span>와 노후준비 필요, 금융상품 복잡화, <span class=\"kw\">정보 비대칭</span>이 배경이다.","id":"q151"},{"module":1,"subject":"재무설계 개론·직업윤리","topic":"재무설계의 대상","ans":"X","html":"<span class=\"kw\">재무설계의 대상</span>은 <span class=\"kw\">고소득자</span>로 한정된다.","explain":"<span class=\"kw\">재무설계</span>는 <span class=\"kw\">모든 개인</span>을 대상으로 하며, 소득 수준과 무관하다.","id":"q152"},{"module":1,"subject":"재무설계 개론·직업윤리","topic":"국내 도입","ans":"O","html":"<span class=\"kw\">2000년 4월</span> 한국FP협회가 창립되었고, <span class=\"kw\">회원관리</span>는 FP협회가, <span class=\"kw\">자격인증·시험</span>은 <span class=\"kw\">한국재무설계협회</span>가 맡는다.","explain":"<span class=\"kw\">회원관리</span>는 FP협회, <span class=\"kw\">자격인증·시험</span>은 재무설계협회다.","id":"q153"},{"module":1,"subject":"재무설계 개론·직업윤리","topic":"필요역량","ans":"X","html":"<span class=\"kw\">재무설계</span>사의 필요역량은 <span class=\"kw\">지식·이해·적용·분석·평가</span>의 <span class=\"kw\">5가지</span>다.","explain":"<span class=\"kw\">여기</span>에 <span class=\"kw\">창조</span>가 더해져 6가지다.","id":"q154"},{"module":1,"subject":"재무설계 개론·직업윤리","topic":"자산 분류","ans":"O","html":"<span class=\"kw\">현금성자산</span>은 CD 만기 <span class=\"kw\">90일 이하</span>이고, <span class=\"kw\">투자자산</span>에는 변액보험·연금저축·DC·IRP가 들어간다.","explain":"<span class=\"kw\">저축성자산</span>은 <span class=\"kw\">정기예·적금</span>, 저축성보험처럼 만기와 확정 수익이 있는 자산이다.","id":"q155"},{"module":1,"subject":"재무설계 개론·직업윤리","topic":"자산 분류","ans":"X","html":"<span class=\"kw\">사용자산</span>에는 자동차·가구와 함께 <span class=\"kw\">투자목적의 미술품</span>이 포함된다.","explain":"투자목적 미술품·골동품은 <span class=\"kw\">기타자산</span>이다. 전세보증금은 <span class=\"kw\">사용자산</span>이다.","id":"q156"},{"module":1,"subject":"재무설계 개론·직업윤리","topic":"현금흐름표","ans":"O","html":"<span class=\"kw\">저축여력</span>은 수입 − 변동지출 − 고정지출이고, <span class=\"kw\">추가저축여력</span>은 월수입 − 지출 − 저축·투자액이다.","explain":"<span class=\"kw\">추가저축여력</span>은 <span class=\"kw\">순 현금흐름</span>이라고도 한다.","id":"q157"},{"module":1,"subject":"재무설계 개론·직업윤리","topic":"현금흐름표","ans":"X","html":"<span class=\"kw\">현금흐름표</span>의 수입은 <span class=\"kw\">근로소득자는 세전</span>, <span class=\"kw\">개인사업자는 세후</span>로 기록한다.","explain":"반대다. 근로소득자는 <span class=\"kw\">세후</span>, 개인사업자는 <span class=\"kw\">세전</span>으로 기록한다.","id":"q158"},{"module":1,"subject":"재무설계 개론·직업윤리","topic":"부채 부담률","ans":"O","html":"<span class=\"kw\">주거관련부채부담률</span>은 주거관련부채 ÷ 총자산, <span class=\"kw\">총부채부담률</span>은 총부채 ÷ 총자산이다.","explain":"<span class=\"kw\">총부채상환비율(DTI)</span>의 분모는 <span class=\"kw\">월 총수입</span>이다.","id":"q159"},{"module":1,"subject":"재무설계 개론·직업윤리","topic":"DSR","ans":"X","html":"<span class=\"kw\">DSR</span>의 분자는 <span class=\"kw\">주택담보대출의 연간 원리금</span>만 해당한다.","explain":"<span class=\"kw\">DSR</span>은 <span class=\"kw\">모든 금융회사 대출</span>의 연간 원리금 상환액을 분자로 한다.","id":"q160"},{"module":1,"subject":"재무설계 개론·직업윤리","topic":"신용정보","ans":"O","html":"<span class=\"kw\">3개월 이상 연체</span>가 발생하면 <span class=\"kw\">7영업일 이내</span> <span class=\"kw\">연체정보</span>가 등록되고, 상환하면 <span class=\"kw\">즉시 해제</span>된다.","explain":"등록일부터 <span class=\"kw\">90일</span> 내 상환하거나 1천만 원 이하(카드 5백만 원)면 <span class=\"kw\">기록이 삭제</span>된다.","id":"q161"},{"module":1,"subject":"재무설계 개론·직업윤리","topic":"신용정보","ans":"X","html":"<span class=\"kw\">금융질서 문란정보</span>는 <span class=\"kw\">10년</span>간 보존된 후 삭제된다.","explain":"<span class=\"kw\">금융질서 문란정보</span>는 <span class=\"kw\">5년</span> 보존 후 삭제된다.","id":"q162"},{"module":1,"subject":"재무설계 개론·직업윤리","topic":"행동재무학","ans":"O","html":"<span class=\"kw\">대표성 오류</span>, <span class=\"kw\">닻 내리기 효과</span>, 프레이밍 효과, 심적회계, 소유효과는 <span class=\"kw\">행동재무학</span>의 대표적 편향이다.","explain":"<span class=\"kw\">손실회피</span>·낙관주의 오류·<span class=\"kw\">자기통제 오류</span>도 여기에 속한다.","id":"q163"},{"module":1,"subject":"재무설계 개론·직업윤리","topic":"소비자신용","ans":"X","html":"<span class=\"kw\">금융리스</span>는 관리책임이 리스회사에 있고 <span class=\"kw\">중도해지가 자유롭다</span>.","explain":"<span class=\"kw\">금융리스</span>는 <span class=\"kw\">물적금융</span>으로 관리책임이 소비자에게 있고 중도해지가 원칙적으로 제한된다.","id":"q164"},{"module":1,"subject":"재무설계 개론·직업윤리","topic":"청약철회","ans":"O","html":"<span class=\"kw\">청약철회</span>는 보장성 상품은 <span class=\"kw\">15일과 30일 중 먼저 도래</span>한 기간, 투자성은 <span class=\"kw\">7일</span>, 대출성은 <span class=\"kw\">14일</span>이다.","explain":"<span class=\"kw\">철회 효과</span>는 <span class=\"kw\">의사표시를 발송한 때</span> 발생한다.","id":"q165"},{"module":1,"subject":"재무설계 개론·직업윤리","topic":"위법계약해지권","ans":"X","html":"<span class=\"kw\">위법계약해지권</span>은 위법사실을 안 날부터 <span class=\"kw\">3년</span>, 계약체결일부터 <span class=\"kw\">10년</span> 이내에 행사한다.","explain":"안 날부터 <span class=\"kw\">1년</span>, 계약체결일부터 <span class=\"kw\">5년</span>이다.","id":"q166"},{"module":1,"subject":"재무설계 개론·직업윤리","topic":"과징금","ans":"O","html":"과징금은 <span class=\"kw\">적합성·적정성 원칙</span> 위반을 제외한 6대 판매규제 위반에 부과되고, 관련 수입의 <span class=\"kw\">50% 이내</span>다.","explain":"<span class=\"kw\">과징금</span>은 <span class=\"kw\">징벌적 목적</span>을 가진다.","id":"q167"},{"module":1,"subject":"재무설계 개론·직업윤리","topic":"소액분쟁","ans":"X","html":"소액분쟁사건 특례는 일반<span class=\"kw\">금융소비자</span>가 신청한 <span class=\"kw\">5천만 원 이하</span> 사건에 적용된다.","explain":"<span class=\"kw\">2천만 원 이하</span>다(<span class=\"kw\">소송이탈금지제도</span>).","id":"q168"},{"module":1,"subject":"재무설계 개론·직업윤리","topic":"고객에 대한 의무","ans":"O","html":"재무설계사의 <span class=\"kw\">고객에 대한 의무</span>는 <span class=\"kw\">충실의무·고지의무·진단의무·자문의무·갱신유지의무</span>다.","explain":"<span class=\"kw\">진단의무</span><span class=\"kw\">는 투자자 적합성</span>을 판단하는 의무다.","id":"q169"},{"module":1,"subject":"재무설계 개론·직업윤리","topic":"과태료","ans":"X","html":"<span class=\"kw\">과태료</span>는 위반 사항에 따라 <span class=\"kw\">1천만 원·5천만 원·2억 원</span> 이하로 구별된다.","explain":"<span class=\"kw\">과태료</span>는 <span class=\"kw\">1천만 원·3천만 원·1억 원</span> 이하다.","id":"q170"},{"module":1,"subject":"은퇴설계","topic":"인구 지표","ans":"O","html":"<span class=\"kw\">노년부양비</span>는 생산연령인구 100명당 부양할 <span class=\"kw\">고령인구</span>를 나타낸다.","explain":"총부양비는 15~<span class=\"kw\">64세</span> 100명당 <span class=\"kw\">유소년+고령인구</span>다.","id":"q171"},{"module":1,"subject":"은퇴설계","topic":"인구 지표","ans":"X","html":"<span class=\"kw\">노령화지수</span>는 <span class=\"kw\">유소년인구 100명당</span> 고령인구를 나타낸다.","explain":"<span class=\"kw\">노령화지수</span>는 <span class=\"kw\">유소년인구 100명당</span> 고령인구다.","id":"q172"},{"module":1,"subject":"은퇴설계","topic":"노후소득 보장","ans":"O","html":"<span class=\"kw\">국민연금</span>은 <span class=\"kw\">1988년</span>, 개인연금은 1994년, 퇴직연금은 2005년, 기초연금은 <span class=\"kw\">2014년</span> 도입되었다.","explain":"<span class=\"kw\">공무원연금(1960)</span>·사학연금(1975)·<span class=\"kw\">별정우체국연금(1981)</span>이 먼저 시작됐다.","id":"q173"},{"module":1,"subject":"은퇴설계","topic":"소득대체율","ans":"O","html":"국제기구가 권고하는 <span class=\"kw\">소득대체율</span>은 <span class=\"kw\">70~80%</span>이고, 공적연금은 <span class=\"kw\">물가상승률</span>을 반영해 사망할 때까지 지급된다.","explain":"우리나라 <span class=\"kw\">소득대체율</span>은 <span class=\"kw\">43%</span> 수준이다.","id":"q174"},{"module":1,"subject":"은퇴설계","topic":"기초연금","ans":"X","html":"<span class=\"kw\">기초연금</span>은 65세 이상 노인의 <span class=\"kw\">50%</span>에게 지급된다.","explain":"<span class=\"kw\">기초연금</span>은 노인의 <span class=\"kw\">70%</span>에게 지급한다.","id":"q175"},{"module":1,"subject":"은퇴설계","topic":"농지연금","ans":"X","html":"<span class=\"kw\">농지연금</span>은 <span class=\"kw\">55세 이상</span>이고 영농경력 3년 이상이면 가입할 수 있다.","explain":"<span class=\"kw\">60세 이상</span>, 영농경력 <span class=\"kw\">5년 이상</span>이다.","id":"q176"},{"module":1,"subject":"은퇴설계","topic":"농지연금","ans":"O","html":"<span class=\"kw\">농지연금</span>은 담보농지를 <span class=\"kw\">경작하거나 임대</span>할 수 있고, <span class=\"kw\">6억 원</span> 기준 재산세 감면과 월지급금 <span class=\"kw\">300만 원</span> 상한이 있다.","explain":"<span class=\"kw\">주택연금</span>과 달리 <span class=\"kw\">계속 영농</span>이 가능하다.","id":"q177"},{"module":1,"subject":"은퇴설계","topic":"은퇴자산 평가","ans":"X","html":"은퇴자산을 평가할 때 <span class=\"kw\">공적연금</span>도 <span class=\"kw\">은퇴자산에 포함</span>한다.","explain":"<span class=\"kw\">공적연금</span>은 <span class=\"kw\">은퇴자산으로 평가하지 않는다</span>.","id":"q178"},{"module":1,"subject":"은퇴설계","topic":"TDF·TIF","ans":"O","html":"<span class=\"kw\">TDF</span>는 은퇴자산 <span class=\"kw\">축적</span>, <span class=\"kw\">TIF</span>는 은퇴 후 정기적 <span class=\"kw\">인출</span>을 목적으로 한다.","explain":"<span class=\"kw\">TDF</span>는 <span class=\"kw\">글라이드패스</span>를 따라 주식 비중을 줄인다.","id":"q179"},{"module":1,"subject":"은퇴설계","topic":"국민연금 가입","ans":"X","html":"<span class=\"kw\">국민연금 가입</span> 대상은 <span class=\"kw\">18세 이상 65세 미만</span>이다.","explain":"<span class=\"kw\">국민연금 가입</span> 대상은 <span class=\"kw\">18세 이상 60세 미만</span>이다.","id":"q180"},{"module":1,"subject":"은퇴설계","topic":"임의가입","ans":"O","html":"<span class=\"kw\">임의가입자·임의계속가입자</span>는 <span class=\"kw\">6개월 이상</span> 보험료를 체납하면 자격을 잃는다.","explain":"<span class=\"kw\">임의가입자</span>는 60세 이전, <span class=\"kw\">임의계속가입자</span>는 60세에 달한 자다.","id":"q181"},{"module":1,"subject":"은퇴설계","topic":"기본연금액","ans":"X","html":"<span class=\"kw\">기본연금액</span>의 <span class=\"kw\">A값</span>은 소득비례부분, <span class=\"kw\">B값</span>은 균등부분이다.","explain":"A값이 <span class=\"kw\">균등부분</span>, B값이 <span class=\"kw\">소득비례부분</span>이다.","id":"q182"},{"module":1,"subject":"은퇴설계","topic":"유족연금","ans":"O","html":"<span class=\"kw\">유족연금</span>은 배우자인 경우 <span class=\"kw\">3년</span> 동안 지급한 뒤 <span class=\"kw\">55세</span>가 될 때까지 지급이 정지된다.","explain":"<span class=\"kw\">예외사유</span>가 있으면 <span class=\"kw\">정지되지 않는다</span>.","id":"q183"},{"module":1,"subject":"은퇴설계","topic":"사망일시금","ans":"X","html":"<span class=\"kw\">사망일시금</span>의 소멸시효는 <span class=\"kw\">3년</span>이고, 지급대상에서 형제자매는 제외된다.","explain":"소멸시효는 <span class=\"kw\">5년</span>이며 <span class=\"kw\">4촌 이내 방계혈족</span>까지 포함한다.","id":"q184"},{"module":1,"subject":"은퇴설계","topic":"공무원연금","ans":"O","html":"<span class=\"kw\">공무원연금</span>은 기여금·부담금이 각 <span class=\"kw\">9%</span>이고, <span class=\"kw\">10년 이상</span> 재직해야 하며 조기퇴직연금은 1년당 <span class=\"kw\">5%</span> 감액된다.","explain":"납부기간은 <span class=\"kw\">36년</span>, 유족연금은 연금액의 <span class=\"kw\">60%</span>다.","id":"q185"},{"module":1,"subject":"은퇴설계","topic":"군인연금","ans":"X","html":"<span class=\"kw\">군인연금</span>의 기여금·부담금은 각 <span class=\"kw\">9%</span>이고 복무기간은 <span class=\"kw\">25년</span>이다.","explain":"각 <span class=\"kw\">7%</span>, 복무기간 <span class=\"kw\">20년</span>(납부 33년)이다.","id":"q186"},{"module":1,"subject":"은퇴설계","topic":"퇴직급여 지급","ans":"O","html":"<span class=\"kw\">퇴직급여</span>는 원칙적으로 <span class=\"kw\">14일 이내</span> 지급하고, 늦어지면 연 <span class=\"kw\">20%</span>의 지연이자를 붙이며 <span class=\"kw\">대출채권과 상계</span>할 수 없다.","explain":"<span class=\"kw\">지급기한</span>을 넘기면 <span class=\"kw\">지연이자</span>가 발생한다.","id":"q187"},{"module":1,"subject":"은퇴설계","topic":"퇴직금 수령","ans":"X","html":"<span class=\"kw
