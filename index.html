\">55세 미만</span>에 DC·DB형에서 퇴직한 근로자는 퇴직금을 <span class=\"kw\">연금저축계좌</span>로 받을 수 있다.","explain":"<span class=\"kw\">55세</span> 미만은 <span class=\"kw\">IRP 계좌로만</span> 받을 수 있다.","id":"q188"},{"module":1,"subject":"은퇴설계","topic":"DB·DC","ans":"X","html":"<span class=\"kw\">DC형</span>의 적립금 <span class=\"kw\">운용책임</span>은 사용자에게 있다.","explain":"<span class=\"kw\">DC형</span>은 <span class=\"kw\">근로자</span>가 운용책임을 진다(DB는 사용자).","id":"q189"},{"module":1,"subject":"은퇴설계","topic":"디폴트옵션","ans":"O","html":"<span class=\"kw\">디폴트옵션</span>에서 기존가입자는 만기일로부터 <span class=\"kw\">4주</span> 내 운용지시가 없으면 통지 후 <span class=\"kw\">2주</span> 대기, 신규가입자는 최초납입일부터 <span class=\"kw\">2주</span> 내 대기기간 없이 적용된다.","explain":"<span class=\"kw\">Opt-Out</span><span class=\"kw\">하면 언제든 다른 상품</span>으로 운용지시할 수 있다.","id":"q190"},{"module":1,"subject":"은퇴설계","topic":"IRP 납입","ans":"X","html":"<span class=\"kw\">IRP</span> 자기부담금의 연간 납입한도는 <span class=\"kw\">1,200만 원</span>이다.","explain":"<span class=\"kw\">IRP</span> 자기부담금 한도는 <span class=\"kw\">1,800만 원</span>이다.","id":"q191"},{"module":1,"subject":"은퇴설계","topic":"연금계좌 승계","ans":"O","html":"<span class=\"kw\">연금계좌 승계</span>는 <span class=\"kw\">배우자</span>에 한해 <span class=\"kw\">6개월 이내</span>에 할 수 있고, 새로 가입한 것으로 본다.","explain":"<span class=\"kw\">가입일·연금수령연차</span>는 <span class=\"kw\">피상속인 기준</span>을 적용한다.","id":"q192"},{"module":1,"subject":"은퇴설계","topic":"연금계좌 이체","ans":"O","html":"연금수령 요건을 갖춘 뒤 <span class=\"kw\">연금저축</span>과 IRP 사이에서 <span class=\"kw\">전액</span>을 이체하면 <span class=\"kw\">과세이연</span>된다.","explain":"<span class=\"kw\">일부 금액</span>만 이체하면 인출로 보아 <span class=\"kw\">과세</span>된다.","id":"q193"},{"module":1,"subject":"은퇴설계","topic":"연금수령 세율","ans":"X","html":"<span class=\"kw\">연금계좌</span>에서 <span class=\"kw\">70~79세</span>에 연금을 받으면 <span class=\"kw\">5%</span>의 연금소득세가 적용된다.","explain":"70~<span class=\"kw\">79세</span>는 <span class=\"kw\">4%</span>다(55~69세 5%, 80세 이상 3%, 종신형 3%).","id":"q194"},{"module":1,"subject":"부동산설계","topic":"주택의 분류","ans":"O","html":"<span class=\"kw\">다중주택</span>은 3층 이하·660㎡ 이하로 <span class=\"kw\">독립가구가 아니며</span>, <span class=\"kw\">다가구주택</span>은 3층 이하·<span class=\"kw\">19세대 이하</span>다.","explain":"연립주택은 <span class=\"kw\">4층 이하·660㎡ 초과</span>, 다세대는 <span class=\"kw\">4층 이하·660㎡ 이하</span>다.","id":"q195"},{"module":1,"subject":"부동산설계","topic":"주택의 분류","ans":"X","html":"<span class=\"kw\">다가구주택</span>은 3층 이하이면서 <span class=\"kw\">20세대 이상</span>이면 해당한다.","explain":"<span class=\"kw\">다가구주택</span>은 <span class=\"kw\">19세대 이하</span>다.","id":"q196"},{"module":1,"subject":"부동산설계","topic":"공동소유","ans":"O","html":"<span class=\"kw\">합유</span>는 지분 처분에 <span class=\"kw\">전원의 동의</span>가 필요하고, 목적물의 사용·수익은 <span class=\"kw\">합유물 전부</span>에 미친다.","explain":"<span class=\"kw\">공유</span>는 지분 처분이 자유롭고, 총유는 <span class=\"kw\">사원총회 결의</span>가 필요하다.","id":"q197"},{"module":1,"subject":"부동산설계","topic":"등기 순위","ans":"O","html":"<span class=\"kw\">별구(갑구와 을구)</span> 사이의 순위는 <span class=\"kw\">접수번호</span>에 따른다.","explain":"<span class=\"kw\">동구</span> 안에서는 <span class=\"kw\">순위번호</span>에 따른다.","id":"q198"},{"module":1,"subject":"부동산설계","topic":"가등기","ans":"O","html":"<span class=\"kw\">가등기</span> 후 본등기를 하면 본등기의 순위는 <span class=\"kw\">가등기의 순위</span>에 따른다.","explain":"<span class=\"kw\">가등기</span>는 장래의 물권변동 청구권을 <span class=\"kw\">보전</span>하는 등기다.","id":"q199"},{"module":1,"subject":"부동산설계","topic":"경매","ans":"X","html":"<span class=\"kw\">임의경매</span>는 채권자가 <span class=\"kw\">판결</span>을 받아 신청해야 한다.","explain":"<span class=\"kw\">임의경매</span>는 <span class=\"kw\">담보물권</span>에 기해 신청한다. 판결이 필요한 것은 강제경매다.","id":"q200"},{"module":1,"subject":"부동산설계","topic":"재경매·신경매","ans":"X","html":"<span class=\"kw\">신경매</span>는 최저매각가격을 <span class=\"kw\">그대로</span> 두고 진행한다.","explain":"<span class=\"kw\">신경매</span>는 최저매각가격이 <span class=\"kw\">20~30% 하락</span>한다. 재경매가 그대로 진행된다.","id":"q201"},{"module":1,"subject":"부동산설계","topic":"재경매","ans":"O","html":"<span class=\"kw\">재경매</span>는 낙찰자의 대금 미납으로 다시 진행하며, 매수신청보증금을 최저매각가격의 <span class=\"kw\">20~30%</span>로 정한다.","explain":"<span class=\"kw\">미납</span>을 막기 위한 <span class=\"kw\">보증금 인상</span> 장치다.","id":"q202"},{"module":1,"subject":"부동산설계","topic":"보증금 보호","ans":"O","html":"<span class=\"kw\">우선변제권</span>은 <span class=\"kw\">대항력 + 확정일자</span>를 갖춰야 하며, <span class=\"kw\">최우선변제</span> 한도는 주택가액의 <span class=\"kw\">2분의 1</span>이다.","explain":"<span class=\"kw\">최우선변제</span>는 <span class=\"kw\">대항력</span>만 있으면 된다.","id":"q203"},{"module":1,"subject":"부동산설계","topic":"상가임대차","ans":"X","html":"상가건물임대차에서 <span class=\"kw\">묵시적 갱신</span>은 임대인이 기간 종료 <span class=\"kw\">6개월 전부터 2개월 전</span>까지 갱신 거절을 통지하지 않으면 성립한다.","explain":"상가는 <span class=\"kw\">6개월 전부터 1개월 전</span>이다. <span class=\"kw\">2개월</span>은 주택 기준이다.","id":"q204"},{"module":1,"subject":"부동산설계","topic":"상가임대차","ans":"X","html":"상가 <span class=\"kw\">보증금</span>의 월차임 전환률은 <span class=\"kw\">연 12%</span> 또는 기준금리에 <span class=\"kw\">2%</span>를 더한 비율 중 낮은 비율이다.","explain":"<span class=\"kw\">기준금리</span>에 <span class=\"kw\">4.5배수</span>를 곱한 비율과 비교한다.","id":"q205"},{"module":1,"subject":"부동산설계","topic":"특별공급","ans":"O","html":"<span class=\"kw\">신혼부부 특별공급</span>은 혼인기간 <span class=\"kw\">7년 이내</span>, 계속 무주택, 월평균 소득 <span class=\"kw\">140%</span>(맞벌이 160%) 이하를 모두 충족해야 한다.","explain":"<span class=\"kw\">1세대</span>당 <span class=\"kw\">평생 1회</span>로 제한된다.","id":"q206"},{"module":1,"subject":"부동산설계","topic":"특별공급","ans":"X","html":"<span class=\"kw\">노부모부양</span> 특별공급은 만 <span class=\"kw\">60세 이상</span> 직계존속을 <span class=\"kw\">1년 이상</span> 부양하면 된다.","explain":"만 <span class=\"kw\">65세 이상</span>을 <span class=\"kw\">3년 이상</span> 계속 부양해야 한다.","id":"q207"},{"module":1,"subject":"부동산설계","topic":"용도지역","ans":"X","html":"<span class=\"kw\">용도지역</span>은 필요하면 <span class=\"kw\">중복 지정</span>할 수 있다.","explain":"<span class=\"kw\">용도지역</span>은 <span class=\"kw\">중복 지정되지 않는다</span>.","id":"q208"},{"module":1,"subject":"부동산설계","topic":"건폐율·용적률","ans":"O","html":"<span class=\"kw\">건폐율</span>은 대지면적에 대한 건축면적, <span class=\"kw\">용적률</span>은 대지면적에 대한 연면적의 비율이다.","explain":"용적률 계산 시 <span class=\"kw\">주차장·피난시설</span> 등 비주거 면적은 <span class=\"kw\">제외</span>한다.","id":"q209"},{"module":1,"subject":"부동산설계","topic":"건축허가","ans":"X","html":"<span class=\"kw\">건축허가</span> 후 <span class=\"kw\">2년</span> 내 착수하지 않으면 허가를 취소하되, 정당한 사유가 있으면 <span class=\"kw\">2년</span>까지 연장할 수 있다.","explain":"<span class=\"kw\">연장</span>은 <span class=\"kw\">1년</span> 범위에서 가능하다.","id":"q210"},{"module":1,"subject":"부동산설계","topic":"상가 투자","ans":"O","html":"<span class=\"kw\">주주형 상가</span>는 지분을 발행해 소액투자자를 모집하고, 준공 후 <span class=\"kw\">전문 경영인</span>이 운영한 영업이익을 배당한다.","explain":"<span class=\"kw\">주주형 상가</span>는 <span class=\"kw\">매각이 어렵다</span>는 단점이 있다.","id":"q211"},{"module":1,"subject":"부동산설계","topic":"아파트 단지 상가","ans":"X","html":"<span class=\"kw\">아파트 단지 상가</span>는 입주 <span class=\"kw\">초기부터</span> 임대료가 계속 낮아진다.","explain":"<span class=\"kw\">입주 초기</span>에는 높은 임대료를 받지만 <span class=\"kw\">2년 정도</span> 지나면 낮아진다.","id":"q212"},{"module":1,"subject":"부동산설계","topic":"생활형 숙박시설","ans":"X","html":"<span class=\"kw\">생활형 숙박시설</span>을 분양받으려면 <span class=\"kw\">주택청약종합저축</span>이 필요하다.","explain":"주택이 아니므로 청약통장이 <span class=\"kw\">필요 없고</span> 주택 수에도 <span class=\"kw\">포함</span>되지 않는다.","id":"q213"},{"module":1,"subject":"상속설계","topic":"동시사망","ans":"O","html":"동시사망이 추정되면 상호간 <span class=\"kw\">상속권은 인정되지 않지만</span> 상호간 <span class=\"kw\">대습상속</span>은 인정된다.","explain":"<span class=\"kw\">동시사망 추정</span>은 <span class=\"kw\">상속결격</span>과 함께 대습상속 원인이다.","id":"q214"},{"module":1,"subject":"상속설계","topic":"실종선고","ans":"X","html":"<span class=\"kw\">실종선고</span>의 상속개시 시기는 <span class=\"kw\">실종선고일</span>이다.","explain":"민법상 상속개시 시기는 <span class=\"kw\">실종기간이 만료된 때</span>다(보통 <span class=\"kw\">5년</span>, 특별 1년).","id":"q215"},{"module":1,"subject":"상속설계","topic":"상속인 자격","ans":"O","html":"<span class=\"kw\">태아</span>도 상속인이 될 수 있고 <span class=\"kw\">대습상속</span>도 가능하지만, <span class=\"kw\">법인</span>은 상속인이 될 수 없다.","explain":"<span class=\"kw\">상속인</span>은 <span class=\"kw\">자연인</span>이어야 한다.","id":"q216"},{"module":1,"subject":"상속설계","topic":"상속 순위","ans":"O","html":"<span class=\"kw\">친양자</span>는 양친의 성과 본으로 변경되지만 <span class=\"kw\">상속권이 인정되지 않는다</span>.","explain":"<span class=\"kw\">일반양자</span>는 친생부모의 성과 본을 유지하고 <span class=\"kw\">상속권이 인정</span>된다.","id":"q217"},{"module":1,"subject":"상속설계","topic":"공동상속","ans":"O","html":"<span class=\"kw\">공동상속</span>재산의 <span class=\"kw\">보존행위</span>는 각자가 단독으로 할 수 있지만, <span class=\"kw\">관리행위</span>는 법정상속분의 <span class=\"kw\">과반수</span>로 정한다.","explain":"<span class=\"kw\">처분행위</span>는 <span class=\"kw\">전원의 동의</span>가 필요하다.","id":"q218"},{"module":1,"subject":"상속설계","topic":"상속분","ans":"O","html":"동순위 상속인은 <span class=\"kw\">균분</span>하고, 배우자는 <span class=\"kw\">5할</span>을 가산한다.","explain":"<span class=\"kw\">배우자 상속분</span>은 다른 상속인보다 <span class=\"kw\">50% 더</span> 많다.","id":"q219"},{"module":1,"subject":"상속설계","topic":"상속재산 분할","ans":"X","html":"<span class=\"kw\">상속재산 분할</span>은 상속세 신고기한과 같이 <span class=\"kw\">6개월</span> 안에 해야 한다.","explain":"분할에는 <span class=\"kw\">정해진 기간이 없다</span>. <span class=\"kw\">5년</span> 내 분할 금지 약정은 가능하다.","id":"q220"},{"module":1,"subject":"상속설계","topic":"상속회복청구권","ans":"O","html":"<span class=\"kw\">상속회복청구권</span>은 <span class=\"kw\">재판상</span>으로만 행사할 수 있고, 침해를 안 날부터 <span class=\"kw\">3년</span>·침해행위가 있은 날부터 <span class=\"kw\">10년</span>이다.","explain":"<span class=\"kw\">참칭상속인</span>을 상대로 <span class=\"kw\">소송</span>으로 행사한다.","id":"q221"},{"module":1,"subject":"상속설계","topic":"유증","ans":"O","html":"<span class=\"kw\">유증(유언상속)</span>은 법정상속보다 <span class=\"kw\">우선 적용</span>되고, 법정상속은 <span class=\"kw\">보충적</span>으로 적용된다.","explain":"유증은 <span class=\"kw\">단독행위</span>, 사인증여는 <span class=\"kw\">계약</span>이다.","id":"q222"},{"module":1,"subject":"상속설계","topic":"유언의 철회","ans":"O","html":"유언의 철회는 <span class=\"kw\">대리인</span>이 할 수 없고 <span class=\"kw\">포기</span>도 할 수 없다.","explain":"<span class=\"kw\">유언</span>에 의한 철회와 <span class=\"kw\">생전행위</span>에 의한 철회가 있다.","id":"q223"},{"module":1,"subject":"상속설계","topic":"유류분 반환","ans":"O","html":"유류분 반환은 <span class=\"kw\">유증</span>으로 부족한 경우 <span class=\"kw\">증여</span> 순으로 청구한다.","explain":"<span class=\"kw\">기여분</span>은 유류분 반환 대상이 <span class=\"kw\">아니다</span>.","id":"q224"},{"module":1,"subject":"상속설계","topic":"상속세 방식","ans":"X","html":"<span class=\"kw\">상속세</span>는 재산을 받은 자별로 과세하는 <span class=\"kw\">유산취득세 방식</span>이다.","explain":"<span class=\"kw\">상속세</span>는 <span class=\"kw\">유산세 방식</span>, 증여세가 유산취득세 방식이다.","id":"q225"},{"module":1,"subject":"상속설계","topic":"세대생략","ans":"O","html":"<span class=\"kw\">세대생략</span> 가산은 산출세액의 <span class=\"kw\">30%</span>이고, 미성년자가 <span class=\"kw\">20억 원 초과</span>를 받으면 <span class=\"kw\">40%</span>다.","explain":"민법상 <span class=\"kw\">대습상속</span>은 세대생략 가산에서 <span class=\"kw\">제외</span>된다.","id":"q226"},{"module":1,"subject":"상속설계","topic":"신고세액공제","ans":"X","html":"상속세를 <span class=\"kw\">법정신고기한</span>까지 신고하면 산출세액의 <span class=\"kw\">10%</span>를 공제한다.","explain":"<span class=\"kw\">신고세액공제</span>는 <span class=\"kw\">3%</span>다.","id":"q227"},{"module":1,"subject":"상속설계","topic":"분납","ans":"X","html":"상속세 <span class=\"kw\">분납</span>은 납부할 세액이 <span class=\"kw\">2천만 원</span>을 초과할 때 신청할 수 있다.","explain":"분납은 <span class=\"kw\">1천만 원</span> 초과, 연부연납·물납은 <span class=\"kw\">2천만 원</span> 초과다.","id":"q228"},{"module":1,"subject":"상속설계","topic":"물납","ans":"X","html":"<span class=\"kw\">물납</span>은 상속세와 <span class=\"kw\">증여세</span> 모두에 허용된다.","explain":"<span class=\"kw\">물납</span>은 <span class=\"kw\">증여세에는 허용되지 않는다</span>.","id":"q229"},{"module":1,"subject":"상속설계","topic":"보험금 증여","ans":"X","html":"<span class=\"kw\">보험금</span>의 증여 시기는 <span class=\"kw\">보험료를 납입한 날</span>이다.","explain":"<span class=\"kw\">보험금</span>의 증여 시기는 <span class=\"kw\">보험사고 발생일</span>(연금보험은 연금개시일)이다.","id":"q230"},{"module":1,"subject":"상속설계","topic":"자금출처조사","ans":"X","html":"<span class=\"kw\">자금출처조사</span>에서 미입증금액이 <span class=\"kw\">취득재산가액의 30%와 3억 원</span> 중 작은 금액보다 적으면 증여추정에서 제외된다.","explain":"<span class=\"kw\">자금출처</span> 기준은 <span class=\"kw\">20%와 2억 원</span> 중 작은 금액이다.","id":"q231"},{"module":1,"subject":"상속설계","topic":"저가양수","ans":"X","html":"특수관계인 간 <span class=\"kw\">저가양수</span>는 차액이 시가의 <span class=\"kw\">20%</span> 이상이면 증여로 본다.","explain":"<span class=\"kw\">30% 이상</span> 또는 <span class=\"kw\">3억</span> 원 이상이다.","id":"q232"},{"module":1,"subject":"상속설계","topic":"금융재산공제","ans":"O","html":"<span class=\"kw\">금융재산상속공제</span>는 순금융재산 2천만 원 이하 전액, 1억 원 초과~10억 원 이하는 <span class=\"kw\">20%</span>, 10억 원 초과는 <span class=\"kw\">2억 원</span> 한도다.","explain":"<span class=\"kw\">2천만</span> 원 초과~1억 원 이하는 <span class=\"kw\">2천만 원</span>이다.","id":"q233"},{"module":1,"subject":"상속설계","topic":"동거주택공제","ans":"X","html":"<span class=\"kw\">동거주택상속공제</span>는 10년 이상 동거·1세대 1주택 요건으로 <span class=\"kw\">3억 원</span> 한도다.","explain":"<span class=\"kw\">동거주택상속공제</span>의 한도는 <span class=\"kw\">6억 원</span>이다.","id":"q234"},{"module":1,"subject":"상속설계","topic":"가업상속공제","ans":"O","html":"<span class=\"kw\">가업상속공제</span>는 피상속인이 <span class=\"kw\">10년 이상</span> 영위한 가업에 대해 최대 <span class=\"kw\">600억 원</span>까지 공제된다.","explain":"<span class=\"kw\">10년</span> 이상 300억, 20년 이상 400억, 30년 이상 <span class=\"kw\">600억</span>이다.","id":"q235"},{"module":1,"subject":"상속설계","topic":"사후관리","ans":"X","html":"상속세 결정세액의 <span class=\"kw\">사후관리</span>는 상속재산 가액 <span class=\"kw\">10억 원 이상</span>인 경우 <span class=\"kw\">3년</span>간 한다.","explain":"<span class=\"kw\">30억 원 이상</span>, <span class=\"kw\">5년</span>이다.","id":"q236"},{"module":1,"subject":"상속설계","topic":"증여재산공제","ans":"X","html":"수증자가 <span class=\"kw\">비거주자</span>여도 <span class=\"kw\">증여재산공제</span>를 받을 수 있다.","explain":"<span class=\"kw\">비거주자에게</span>는 <span class=\"kw\">증여재산공제가 적용되지 않는다</span>.","id":"q237"},{"module":2,"subject":"위험관리와 보험설계","topic":"위험의 구분","ans":"O","html":"위험은 <span class=\"kw\">순수위험·투자위험</span>, <span class=\"kw\">객관적·주관적 위험</span>, <span class=\"kw\">특정·기본위험</span>으로 구분된다.","explain":"<span class=\"kw\">보험</span>은 기본적으로 <span class=\"kw\">순수위험</span>을 대상으로 한다.","id":"q238"},{"module":2,"subject":"위험관리와 보험설계","topic":"위험의 구분","ans":"X","html":"<span class=\"kw\">순수위험</span>은 <span class=\"kw\">손실과 이익</span>이 모두 발생할 가능성이 있는 위험이다.","explain":"순수위험은 <span class=\"kw\">손실만</span> 발생 가능하다. 이익과 손실이 모두 가능한 것은 <span class=\"kw\">투자위험</span>이다.","id":"q239"},{"module":2,"subject":"위험관리와 보험설계","topic":"위험관리 프로세스","ans":"X","html":"<span class=\"kw\">위험관리 프로세스</span>는 <span class=\"kw\">위험측정·평가</span>를 먼저 하고 <span class=\"kw\">위험인식</span>을 나중에 한다.","explain":"<span class=\"kw\">위험관리</span>는 <span class=\"kw\">위험인식</span>이 가장 먼저다.","id":"q240"},{"module":2,"subject":"위험관리와 보험설계","topic":"손실 규모","ans":"O","html":"<span class=\"kw\">최대가능손실</span>은 최악의 상황에서 가능한 최대 손실, <span class=\"kw\">추정최대손실</span>은 정상 상황에서 합리적으로 예상되는 최대 손실이다.","explain":"<span class=\"kw\">추정최대손실</span>이 <span class=\"kw\">더 작은 값</span>이다.","id":"q241"},{"module":2,"subject":"위험관리와 보험설계","topic":"위험관리 방법","ans":"X","html":"손실 발생빈도와 심도가 <span class=\"kw\">모두 높으면</span> <span class=\"kw\">위험전가</span>가 적합하다.","explain":"<span class=\"kw\">손실 빈도</span>와 심도가 모두 높으면 <span class=\"kw\">위험회피·손실감소</span>가 적합하다.","id":"q242"},{"module":2,"subject":"위험관리와 보험설계","topic":"보험가능 위험","ans":"O","html":"<span class=\"kw\">보험가능 위험</span>은 <span class=\"kw\">다수의 동질성</span>, <span class=\"kw\">우연성</span>, <span class=\"kw\">측정가능성</span>, 회사가 감당 가능한 손실을 갖춰야 한다.","explain":"<span class=\"kw\">우연성</span>은 손실 발생 <span class=\"kw\">여부·시기·정도</span>의 불확실성이다.","id":"q243"},{"module":2,"subject":"위험관리와 보험설계","topic":"역선택","ans":"O","html":"<span class=\"kw\">역선택</span>은 보험계약자와 보험회사 사이의 <span class=\"kw\">정보의 비대칭</span>에서 발생한다.","explain":"<span class=\"kw\">도덕적 위태 방지책</span>으로 <span class=\"kw\">공제조항·대기기간·면책조항</span> 등이 있다.","id":"q244"},{"module":2,"subject":"위험관리와 보험설계","topic":"보험사고 요건","ans":"X","html":"<span class=\"kw\">보험사고</span>는 <span class=\"kw\">우연성</span>과 <span class=\"kw\">발생가능성</span>만 충족하면 된다.","explain":"<span class=\"kw\">보험사고</span>는 <span class=\"kw\">한정성</span>까지 충족해야 한다.","id":"q245"},{"module":2,"subject":"위험관리와 보험설계","topic":"보험계약의 특성","ans":"O","html":"보험계약은 <span class=\"kw\">불요식·낙성계약</span>, 유상·쌍무계약, <span class=\"kw\">조건부계약</span>, 사행계약, <span class=\"kw\">부합계약</span>의 특성을 갖는다.","explain":"<span class=\"kw\">사행계약적 특성 때문</span>에 <span class=\"kw\">최대선의원칙</span>이 적용된다.","id":"q246"},{"module":2,"subject":"위험관리와 보험설계","topic":"전부·일부보험","ans":"X","html":"<span class=\"kw\">일부보험</span>은 손해액 전액을 <span class=\"kw\">보험가입금액 한도</span>로 지급한다.","explain":"<span class=\"kw\">일부보험</span>은 <span class=\"kw\">비례보상</span>한다. 전액 지급은 전부보험이다.","id":"q247"},{"module":2,"subject":"위험관리와 보험설계","topic":"보험계약의 무효","ans":"X","html":"<span class=\"kw\">제1회 보험료를 내지 않은</span> 경우 계약은 <span class=\"kw\">취소</span>된다.","explain":"제<span class=\"kw\">1회</span> 보험료 미납은 <span class=\"kw\">무효(해제)</span> 사유다.","id":"q248"},{"module":2,"subject":"위험관리와 보험설계","topic":"겸영제한","ans":"O","html":"생명보험업과 손해보험업은 <span class=\"kw\">겸영할 수 없지만</span>, <span class=\"kw\">제3보험업</span>은 겸영이 허용된다.","explain":"<span class=\"kw\">연금저축계약·퇴직보험계약</span>도 <span class=\"kw\">겸영 허용</span> 대상이다.","id":"q249"},{"module":2,"subject":"위험관리와 보험설계","topic":"예금자보호","ans":"X","html":"<span class=\"kw\">변액보험 주계약</span>은 <span class=\"kw\">예금자보호 대상</span>이다.","explain":"<span class=\"kw\">변액보험 주계약</span>은 <span class=\"kw\">비보호</span>이며, 최저보증 부분만 보호된다.","id":"q250"},{"module":2,"subject":"위험관리와 보험설계","topic":"예금자보호","ans":"O","html":"<span class=\"kw\">DC·IRP</span>의 적립금 중 예금보호대상 상품은 합산해 <span class=\"kw\">1억 원</span>까지 별도 보호된다.","explain":"<span class=\"kw\">연금저축(신탁·보험)</span>도 각각 <span class=\"kw\">1억 원</span> 한도로 보호된다.","id":"q251"},{"module":2,"subject":"위험관리와 보험설계","topic":"계약자 권리","ans":"X","html":"보험금 청구권과 해약환급금 청구권의 <span class=\"kw\">소멸시효</span>는 <span class=\"kw\">2년</span>이다.","explain":"보험금 청구권의 <span class=\"kw\">소멸시효</span>는 <span class=\"kw\">3년</span>이다.","id":"q252"},{"module":2,"subject":"위험관리와 보험설계","topic":"사업방법서","ans":"X","html":"<span class=\"kw\">보험료 추가납입</span>은 주계약 기본보험료 납입한도의 <span class=\"kw\">1배</span>까지 가능하다.","explain":"주계약은 <span class=\"kw\">2배</span>, 보장성은 <span class=\"kw\">1배</span>다.","id":"q253"},{"module":2,"subject":"위험관리와 보험설계","topic":"청약","ans":"O","html":"보험회사는 <span class=\"kw\">청약</span>을 받으면 <span class=\"kw\">30일 이내</span> 승낙 여부를 통지하고, 통지하지 않으면 <span class=\"kw\">승낙한 것으로 본다</span>.","explain":"<span class=\"kw\">청약철회</span>는 증권을 받은 날부터 <span class=\"kw\">15일</span>이다.","id":"q254"},{"module":2,"subject":"위험관리와 보험설계","topic":"유통채널","ans":"X","html":"보험설계사가 모집한 계약의 손해<span class=\"kw\">배상책임</span>은 <span class=\"kw\">1차적으로 보험설계사</span>가 진다.","explain":"<span class=\"kw\">손해배상</span>의 1차적 책임은 <span class=\"kw\">보험회사</span>가 진다(중개사는 본인).","id":"q255"},{"module":2,"subject":"위험관리와 보험설계","topic":"국민건강보험","ans":"O","html":"건강보험 <span class=\"kw\">피부양자</span> 소득요건은 연소득 <span class=\"kw\">2,000만 원</span>이고, 보수외 소득이 연 <span class=\"kw\">2,000만 원</span>을 넘으면 소득월액 보험료가 부과된다.","explain":"<span class=\"kw\">지역가입자</span>는 <span class=\"kw\">소득·재산·자동차</span>를 기준으로 보험료를 매긴다.","id":"q256"},{"module":2,"subject":"위험관리와 보험설계","topic":"노인장기요양보험","ans":"X","html":"<span class=\"kw\">노인장기요양보험</span>은 <span class=\"kw\">재가급여 20%</span>, <span class=\"kw\">시설급여 15%</span>의 본인부담금이 있다.","explain":"재가 <span class=\"kw\">15%</span>, 시설 <span class=\"kw\">20%</span>다.","id":"q257"},{"module":2,"subject":"위험관리와 보험설계","topic":"고용보험","ans":"O","html":"<span class=\"kw\">구직급여</span>는 이직 전 평균임금의 <span class=\"kw\">60%</span>를 지급하고, 1일 상한 <span class=\"kw\">68,100원</span>·하한 <span class=\"kw\">66,048원</span>이 적용된다.","explain":"이직 전 <span class=\"kw\">18개월</span>간 피보험단위기간 <span class=\"kw\">180일 이상</span>이 필요하다.","id":"q258"},{"module":2,"subject":"위험관리와 보험설계","topic":"산재보험","ans":"X","html":"<span class=\"kw\">산업재해</span>보상보험료는 원칙적으로 <span class=\"kw\">근로자와 사업주가 반반</span> 부담한다.","explain":"<span class=\"kw\">원칙적</span>으로 <span class=\"kw\">사업주 전액</span> 부담이다(특수형태근로종사자는 반반).","id":"q259"},{"module":2,"subject":"위험관리와 보험설계","topic":"저축성보험 비과세","ans":"O","html":"<span class=\"kw\">저축성보험</span> 보험차익 비과세는 <span class=\"kw\">1억 원 이하</span>·<span class=\"kw\">10년 이상</span>, 월적립식은 <span class=\"kw\">월 150만 원 이하</span>·5년 이상 적립 요건을 갖춰야 한다.","explain":"<span class=\"kw\">종신형 연금보험</span>은 <span class=\"kw\">55세 이후</span> 연금으로 받는 조건이다.","id":"q260"},{"module":2,"subject":"위험관리와 보험설계","topic":"정기보험","ans":"X","html":"<span class=\"kw\">정기보험</span>은 <span class=\"kw\">저축기능</span>이 있어 만기에 환급금을 받을 수 있다.","explain":"정기보험은 <span class=\"kw\">순수보장성</span>으로 저축기능과 환급금이 <span class=\"kw\">없다</span>.","id":"q261"},{"module":2,"subject":"위험관리와 보험설계","topic":"종신보험","ans":"O","html":"<span class=\"kw\">종신보험</span>의 변동보험금 계산방법은 <span class=\"kw\">가산지급방법</span>, 일시납보험 추가가입방법, <span class=\"kw\">계약자적립액비례방법</span>이 있다.","explain":"<span class=\"kw\">수정종신보험</span><span class=\"kw\">은 기간</span>이 지나며 보험료가 오르므로 장래 소득이 높아질 사람에게 적합하다.","id":"q262"},{"module":2,"subject":"위험관리와 보험설계","topic":"변액보험","ans":"X","html":"<span class=\"kw\">변액보험</span>의 <span class=\"kw\">투자책임</span>은 보험회사에 있다.","explain":"변액보험은 <span class=\"kw\">보험계약자</span>가 투자책임을 지고, <span class=\"kw\">특별계정</span>에서 운용한다.","id":"q263"},{"module":2,"subject":"위험관리와 보험설계","topic":"계약유지 제도","ans":"X","html":"<span class=\"kw\">보험계약대출</span>을 받으면 <span class=\"kw\">해약환급금</span>이 감소한다.","explain":"<span class=\"kw\">보험계약대출</span>은 보험료·보험금·보장기간·<span class=\"kw\">해약환급금이 모두 동일</span>하다.","id":"q264"},{"module":2,"subject":"위험관리와 보험설계","topic":"언더라이팅","ans":"O","html":"<span class=\"kw\">언더라이팅</span>의 기본원칙은 <span class=\"kw\">대량위험·동질위험·분산가능위험·보험계속성·형평성</span> 원칙이다.","explain":"<span class=\"kw\">표준미달체</span>는 <span class=\"kw\">보험금 감액·보험료 할증·특정 보장 제한</span>으로 인수한다.","id":"q265"},{"module":2,"subject":"위험관리와 보험설계","topic":"표준약관","ans":"O","html":"피보험자가 <span class=\"kw\">자살</span>한 경우 보장개시일(<span class=\"kw\">부활</span> 시 부활청약일)부터 <span class=\"kw\">2년</span>이 지나면 사망보험금을 지급한다.","explain":"<span class=\"kw\">심신상실 상태</span>의 자해도 <span class=\"kw\">보험금을 지급</span>한다.","id":"q266"},{"module":2,"subject":"위험관리와 보험설계","topic":"보험나이","ans":"X","html":"<span class=\"kw\">보험나이</span>는 계약일 현재 만 나이에서 <span class=\"kw\">6개월 미만 끝수를 버리고</span> 계산하므로, 만 47년 9개월은 <span class=\"kw\">47세</span>가 된다.","explain":"<span class=\"kw\">6개월</span> 이상 끝수는 <span class=\"kw\">1년으로 올림</span>해 48세가 된다.","id":"q267"},{"module":2,"subject":"위험관리와 보험설계","topic":"상해보험","ans":"O","html":"<span class=\"kw\">상해보험</span>은 <span class=\"kw\">급격</span>하고 <span class=\"kw\">우연한 외래</span>의 사고 세 요건과 <span class=\"kw\">인과관계</span>를 충족해야 한다.","explain":"<span class=\"kw\">상해</span>의 사망·후유장해는 <span class=\"kw\">정액보상</span>으로 중복 지급된다.","id":"q268"},{"module":2,"subject":"위험관리와 보험설계","topic":"실손의료보험","ans":"X","html":"<span class=\"kw\">실손의료보험</span>의 <span class=\"kw\">재가입 주기</span>는 <span class=\"kw\">3년</span>이다.","explain":"<span class=\"kw\">5년</span>이다. 4세대 전환 후 6개월 내 수령이 없으면 <span class=\"kw\">전환 철회</span>가 가능하다.","id":"q269"},{"module":2,"subject":"위험관리와 보험설계","topic":"질병보험","ans":"X","html":"<span class=\"kw\">암보험</span>의 대기기간은 <span class=\"kw\">30일</span>이다.","explain":"<span class=\"kw\">암보험</span>의 대기기간은 <span class=\"kw\">90일</span>이다.","id":"q270"},{"module":2,"subject":"위험관리와 보험설계","topic":"화재보험","ans":"O","html":"<span class=\"kw\">화재의 3요소</span>는 <span class=\"kw\">불자리를 벗어난 우발적 연소</span>, <span class=\"kw\">연소작용</span>, <span class=\"kw\">경제적 손해</span>다.","explain":"<span class=\"kw\">화재보험</span>은 <span class=\"kw\">재산손해와 비용손해</span>를 보상한다.","id":"q271"},{"module":2,"subject":"위험관리와 보험설계","topic":"화재보험","ans":"X","html":"<span class=\"kw\">일반화재보험</span>은 폭발·파열에 따른 직접손해도 <span class=\"kw\">보상</span>한다.","explain":"<span class=\"kw\">일반화재보험</span>은 폭발·파열 직접손해를 <span class=\"kw\">보상하지 않는다</span>(주택화재보험은 보상).","id":"q272"},{"module":2,"subject":"위험관리와 보험설계","topic":"배상책임보험","ans":"O","html":"<span class=\"kw\">손해사고기준</span> <span class=\"kw\">배상책임보험</span>은 보험기간 중 사고가 발생하면 기간이 만료돼도 <span class=\"kw\">청구권이 소멸하지 않는다</span>.","explain":"<span class=\"kw\">시점 특정</span>이 어려운 위험은 <span class=\"kw\">배상청구기준</span>을 쓴다.","id":"q273"},{"module":2,"subject":"위험관리와 보험설계","topic":"장기손해보험","ans":"O","html":"장기손해보험의 <span class=\"kw\">저축성보험</span>은 보험기간이 <span class=\"kw\">15년 이내</span>이고, <span class=\"kw\">중도·만기환급금</span>이 있다.","explain":"<span class=\"kw\">보장성</span>은 <span class=\"kw\">100세 만기</span>도 가능하다.","id":"q274"},{"module":2,"subject":"위험관리와 보험설계","topic":"자동차보험","ans":"X","html":"사망사고·뺑소니·<span class=\"kw\">12대 중과실</span> 사고는 <span class=\"kw\">종합보험</span>에 가입하면 형사처벌 특례가 적용된다.","explain":"<span class=\"kw\">이 세 경우</span>는 <span class=\"kw\">특례가 적용되지 않아</span> 형사처벌을 받는다.","id":"q275"},{"module":2,"subject":"위험관리와 보험설계","topic":"대인배상Ⅰ","ans":"O","html":"<span class=\"kw\">대인배상Ⅰ</span>은 1인당 <span class=\"kw\">사망 1억 5천만 원</span>, 후유장해 1급 1억 5천만 원, 부상 1급 <span class=\"kw\">3천만 원</span> 한도다.","explain":"<span class=\"kw\">대인배상Ⅰ</span>은 1사고당 보상한도가 <span class=\"kw\">없다</span>.","id":"q276"},{"module":2,"subject":"위험관리와 보험설계","topic":"운전자보험","ans":"O","html":"<span class=\"kw\">운전자보험</span>은 <span class=\"kw\">형사상 책임</span>과 행정상 책임(면허취소 위로금 등)을 보상한다.","explain":"<span class=\"kw\">민사상 배상책임</span>은 <span class=\"kw\">자동차보험</span>이 보상한다.","id":"q277"},{"module":2,"subject":"투자설계","topic":"증권의 종류","ans":"X","html":"자본시장법상 증권은 <span class=\"kw\">채무·지분·수익·투자계약·파생결합</span>의 <span class=\"kw\">5종</span>이며 <span class=\"kw\">수익증권</span>은 제외된다.","explain":"수익증권을 <span class=\"kw\">포함</span>해 <span class=\"kw\">6종</span>이다.","id":"q278"},{"module":2,"subject":"투자설계","topic":"GDP 디플레이터","ans":"X","html":"<span class=\"kw\">GDP 디플레이터</span>는 <span class=\"kw\">실질 GDP ÷ 명목 GDP</span> × 100이다.","explain":"<span class=\"kw\">GDP 디플레이터</span>는 <span class=\"kw\">명목 GDP ÷ 실질 GDP</span> × 100이다.","id":"q279"},{"module":2,"subject":"투자설계","topic":"잠재GDP","ans":"X","html":"<span class=\"kw\">잠재GDP</span>는 생산요소 중 <span class=\"kw\">일부만 고용</span>한 상태에서 달성되는 GDP다.","explain":"<span class=\"kw\">잠재GDP</span>는 생산요소를 <span class=\"kw\">모두 고용</span>한 완전고용 상태의 GDP다.","id":"q280"},{"module":2,"subject":"투자설계","topic":"경제성장률","ans":"O","html":"<span class=\"kw\">경제성장률</span>은 <span class=\"kw\">실질 GDP</span>의 증가율로 측정한다.","explain":"명목 GDP <span class=\"kw\">증가</span>율은 <span class=\"kw\">물가 상승</span>이 섞여 있다.","id":"q281"},{"module":2,"subject":"투자설계","topic":"장단기 금리","ans":"X","html":"<span class=\"kw\">장단기 금리 역전</span>은 <span class=\"kw\">침체기에서 호황기</span>로 넘어갈 때 나타난다.","explain":"<span class=\"kw\">호황기</span>에서 <span class=\"kw\">침체기로 전환</span>되기 전에 나타나는 신호다.","id":"q282"},{"module":2,"subject":"투자설계","topic":"경기지표","ans":"X","html":"<span class=\"kw\">BSI</span>는 긍정 응답 업체 수를 <span class=\"kw\">전체 응답 업체 수</span>로 나눈 뒤 100을 더한 값이다.","explain":"<span class=\"kw\">BSI</span>는 <span class=\"kw\">부정 응답 업체 수</span>를 빼야 한다.","id":"q283"},{"module":2,"subject":"투자설계","topic":"평균수익률","ans":"X","html":"<span class=\"kw\">여러 기간</span>에 걸친 투자수익률을 계산할 때는 <span class=\"kw\">산술평균</span>이 더 바람직하다.","explain":"<span class=\"kw\">다기간</span>은 <span class=\"kw\">기하평균</span>, 미래 예측에는 산술평균이 적절하다.","id":"q284"},{"module":2,"subject":"투자설계","topic":"가중수익률","ans":"X","html":"<span class=\"kw\">시간가중수익률</span>은 현금 유출입의 현재가치를 같게 만드는 <span class=\"kw\">내부수익률</span>과 같다.","explain":"시간가중은 <span class=\"kw\">기하평균</span>, 내부수익률은 <span class=\"kw\">금액가중수익률</span>이다.","id":"q285"},{"module":2,"subject":"투자설계","topic":"정규분포","ans":"O","html":"<span class=\"kw\">정규분포</span>에서 기대수익률 ± <span class=\"kw\">1σ는 약 68%</span>, ±2σ는 95%, ±3σ는 <span class=\"kw\">99%</span>의 확률범위다.","explain":"표준편차가 클수록 <span class=\"kw\">위험</span>이 <span class=\"kw\">크다</span>.","id":"q286"},{"module":2,"subject":"투자설계","topic":"체계적 위험","ans":"O","html":"<span class=\"kw\">체계적 위험</span>은 경기·금리·환율 등 거시요인에서 발생하고, <span class=\"kw\">비체계적 위험</span>은 기업 고유요인에서 발생한다.","explain":"<span class=\"kw\">분산투자</span>로 줄일 수 있는 것은 <span class=\"kw\">비체계적 위험</span>이다.","id":"q287"},{"module":2,"subject":"투자설계","topic":"유상증자","ans":"O","html":"<span class=\"kw\">유상증자</span> 배정방식에는 <span class=\"kw\">주주배정·주주우선공모·제3자배정·일반공모</span> 방식이 있다.","explain":"<span class=\"kw\">제3자배정</span>은 <span class=\"kw\">기존주주 대신</span> 관계사·채권은행 등에 배정한다.","id":"q288"},{"module":2,"subject":"투자설계","topic":"배당 지표","ans":"X","html":"<span class=\"kw\">배당수익률</span>은 주당배당금을 <span class=\"kw\">주당순이익(EPS)</span>으로 나눈 값이다.","explain":"배당수익률은 <span class=\"kw\">주가</span>로 나눈다. DPS/EPS는 <span class=\"kw\">배당성향</span>이다.","id":"q289"},{"module":2,"subject":"투자설계","topic":"주식과 채권","ans":"O","html":"주식은 <span class=\"kw\">자기자본</span>으로 원금상환이 없고, 채권은 <span class=\"kw\">타인자본</span>으로 만기에 원금이 상환된다.","explain":"<span class=\"kw\">청구권</span>은 채권자가 <span class=\"kw\">우선</span>한다.","id":"q290"},{"module":2,"subject":"투자설계","topic":"기본적 분석","ans":"O","html":"<span class=\"kw\">기본적분석</span>은 <span class=\"kw\">회계정보의 신뢰성·시의성</span> 문제와 <span class=\"kw\">투자심리</span> 반영의 한계를 갖는다.","explain":"대부분 공개자료를 쓰므로 <span class=\"kw\">초과이익</span> 실현 가능성이 <span class=\"kw\">낮다</span>.","id":"q291"},{"module":2,"subject":"투자설계","topic":"모자형 펀드","ans":"O","html":"<span class=\"kw\">모자형 펀드</span>는 자펀드 자금을 모펀드에 투자하며, 수수료·보수는 <span class=\"kw\">자펀드에서만</span> 부과한다.","explain":"<span class=\"kw\">모펀드</span>와 자펀드는 <span class=\"kw\">같은 운용사</span>가 운용한다.","id":"q292"},{"module":2,"subject":"투자설계","topic":"종류형 펀드","ans":"X","html":"<span class=\"kw\">종류형 펀드</span>의 A클래스와 C클래스는 <span class=\"kw\">운용보수</span>가 다르다.","explain":"<span class=\"kw\">판매수수료·판매보수</span>만 다르고 <span class=\"kw\">운용보수는 동일</span>하다.","id":"q293"},{"module":2,"subject":"투자설계","topic":"ETF","ans":"O","html":"국내 <span class=\"kw\">ETF</span>는 <span class=\"kw\">10종목 이상</span>에 투자해야 하고, <span class=\"kw\">비교지수를 반드시</span> 선정해야 한다.","explain":"<span class=\"kw\">액티브 ETF</span>도 비교지수를 <span class=\"kw\">선정</span>한다.","id":"q294"},{"module":2,"subject":"투자설계","topic":"자산유동화증권","ans":"O","html":"<span class=\"kw\">CBO</span>는 채권, <span class=\"kw\">CLO</span>는 대출채권을 기초자산으로 발행한다.","explain":"<span class=\"kw\">CBO·CLO</span>는 둘 다 <span class=\"kw\">자산유동화증권</span>이다.","id":"q295"},{"module":2,"subject":"투자설계","topic":"ELW","ans":"X","html":"<span class=\"kw\">ELW</span>는 옵션의 매도포지션까지 증권화해 최대 손실이 <span class=\"kw\">무한</span>하다.","explain":"ELW는 <span class=\"kw\">매수포지션만</span> 증권화해 최대 손실이 <span class=\"kw\">투자원금</span>으로 한정된다.","id":"q296"},{"module":2,"subject":"투자설계","topic":"ELS 손익구조","ans":"O","html":"<span class=\"kw\">ELS 손익구조</span>에는 <span class=\"kw\">디지털형·클리켓형·유러피안형·베리어형·조기상환형</span>이 있다.","explain":"<span class=\"kw\">조기상환형</span>은 <span class=\"kw\">Knock-in</span> 여부와 조기상환일 평가가격으로 수익률이 정해진다.","id":"q297"},{"module":2,"subject":"투자설계","topic":"채권투자전략","ans":"X","html":"채권 액티브전략에서 기업의 <span class=\"kw\">신용등급 상승</span>은 <span class=\"kw\">신용스프레드 확대</span>로 이어져 채권가격이 하락한다.","explain":"등급이 오르면 스프레드가 <span class=\"kw\">축소</span>되어 채권금리가 하락하고 가격은 <span class=\"kw\">상승</span>한다.","id":"q298"},{"module":2,"subject":"투자설계","topic":"선물","ans":"O","html":"<span class=\"kw\">선물</span>의 <span class=\"kw\">개시증거금</span>은 거래 개시 시, <span class=\"kw\">유지증거금</span>은 매일 유지해야 하는 최소 수준이다.","explain":"<span class=\"kw\">잔액</span>이 유지증거금을 밑돌면 <span class=\"kw\">추가증거금</span>을 낸다.","id":"q299"},{"module":2,"subject":"투자설계","topic":"옵션","ans":"X","html":"<span class=\"kw\">콜옵션 매도</span>의 손실은 <span class=\"kw\">프리미엄</span>으로 제한된다.","explain":"<span class=\"kw\">콜옵션 매</span>도 손실은 <span class=\"kw\">무한대</span>다(매수는 프리미엄 한도).","id":"q300"},{"module":2,"subject":"투자설계","topic":"핵심-위성전략","ans":"O","html":"<span class=\"kw\">핵심포트폴리오</span>는 인덱스펀드·ETF로 비교지수 수익률을 추구하고, <span class=\"kw\">위성포트폴리오</span>는 액티브로 초과수익을 추구한다.","explain":"<span class=\"kw\">핵심</span>은 <span class=\"kw\">장기 보유</span>, 위성은 단기 초과수익이 목표다.","id":"q301"},{"module":2,"subject":"투자설계","topic":"헤지펀드","ans":"X","html":"<span class=\"kw\">헤지펀드</span>의 <span class=\"kw\">이벤트드리븐전략</span>은 <span class=\"kw\">방향성 전략</span>이다.","explain":"<span class=\"kw\">이벤트드리븐</span>은 <span class=\"kw\">비방향성 전략</span>이다(방향성은 롱숏·글로벌매크로·이머징).","id":"q302"},{"module":2,"subject":"세금설계","topic":"납세의무 소멸","ans":"X","html":"<span class=\"kw\">납세의무 소멸</span>사유에 <span class=\"kw\">부과제척기간 만료</span>와 <span class=\"kw\">징수권 소멸시효 완성</span>은 포함되지 않는다.","explain":"둘 다 <span class=\"kw\">소멸사유</span>다. 납부·충당·부과처분 취소도 <span class=\"kw\">포함</span>된다.","id":"q303"},{"module":2,"subject":"세금설계","topic":"수정신고·경정청구","ans":"X","html":"<span class=\"kw\">수정신고</span>는 이미 신고한 세액이 <span class=\"kw\">과대</span>한 경우 납세자가 정정하는 제도다.","explain":"<span class=\"kw\">과대신고 정정</span>은 <span class=\"kw\">경정청구</span>, 과소신고 정정이 수정신고다.","id":"q304"},{"module":2,"subject":"세금설계","topic":"국선대리인","ans":"X","html":"<span class=\"kw\">국선대리인</span>은 <span class=\"kw\">상속세·증여세·종부세</span>에도 지원된다.","explain":"<span class=\"kw\">세 가지</span>는 <span class=\"kw\">지원 대상에서 제외</span>된다.","id":"q305"},{"module":2,"subject":"세금설계","topic":"세법적용 원칙","ans":"X","html":"<span class=\"kw\">소급과세 금지</span>는 <span class=\"kw\">국세부과의 원칙</span>에 해당한다.","explain":"소급<span class=\"kw\">과세</span> 금지는 <span class=\"kw\">세법적용의 원칙</span>이다.","id":"q306"},{"module":2,"subject":"세금설계","topic":"소득세 과세원칙","ans":"X","html":"소득세는 <span class=\"kw\">포괄주의</span>를 원칙으로 하고, 법인세는 <span class=\"kw\">열거주의</span>를 채택한다.","explain":"반대다. 소득세는 <span class=\"kw\">열거주의</span>(이자·배당은 유형별 포괄), 법인세는 <span class=\"kw\">포괄주의</span>다.","id":"q307"},{"module":2,"subject":"세금설계","topic":"기장","ans":"X","html":"<span class=\"kw\">복식부기의무자</span>가 필수서류를 첨부하지 않아도 <span class=\"kw\">신고한 것</span>으로 본다.","explain":"<span class=\"kw\">복식부기</span> 미첨부는 <span class=\"kw\">신고하지 않은 것</span>으로 본다.","id":"q308"},{"module":2,"subject":"세금설계","topic":"필요경비","ans":"X","html":"<span class=\"kw\">60% 필요경비</span>가 인정되는 기타소득에는 <span class=\"kw\">강연료</span>가 포함되지 않는다.","explain":"고용관계 없이 일시 제공한 <span class=\"kw\">강연료</span>도 <span class=\"kw\">60%</span> 필요경비 대상이다.","id":"q309"},{"module":2,"subject":"세금설계","topic":"서화·골동품","ans":"X","html":"<span class=\"kw\">서화·골동품</span> 양도소득은 수입금액 <span class=\"kw\">1억 원 이하</span>이면 <span class=\"kw\">80%</span>를 필요경비로 인정한다.","explain":"<span class=\"kw\">90%</span>를 인정한다(<span class=\"kw\">10년</span> 이상 보유도 90%).","id":"q310"},{"module":2,"subject":"세금설계","topic":"인적공제","ans":"X","html":"<span class=\"kw\">기본공제</span> 대상 배우자는 연간 <span class=\"kw\">소득금액 500만 원 이하</span>여야 한다.","explain":"소득금액 <span class=\"kw\">100만 원 이하</span>(근로소득만 있으면 총급여 <span class=\"kw\">500만</span> 원 이하)다.","id":"q311"},{"module":2,"subject":"세금설계","topic":"추가공제","ans":"X","html":"<span class=\"kw\">추가공제</span>에서 <span class=\"kw\">경로우대</span>는 100만 원, <span class=\"kw\">장애인공제</span>는 <span class=\"kw\">100만 원</span>이다.","explain":"<span class=\"kw\">장애인공제</span>는 <span class=\"kw\">200만 원</span>이다.","id":"q312"},{"module":2,"subject":"세금설계","topic":"자녀세액공제","ans":"O","html":"<span class=\"kw\">자녀세액공제</span>는 첫째 <span class=\"kw\">25만 원</span>, 둘째 30만 원, 셋째 이상 1명당 <span class=\"kw\">40만 원</span>이다.","explain":"출산·입양 시 <span class=\"kw\">첫째 30만</span>·둘째 50만·<span class=\"kw\">셋째 70만 원</span>이다.","id":"q313"},{"module":2,"subject":"세금설계","topic":"특별세액공제","ans":"X","html":"기부금 세액공제는 <span class=\"kw\">사업소득만 있는 자</span>에게도 <span class=\"kw\">적용</span>된다.","explain":"<span class=\"kw\">사업소득</span>만 있는 자는 <span class=\"kw\">적용되지 않는다</span>(보험모집인은 예외).","id":"q314"},{"module":2,"subject":"세금설계","topic":"법인세 세무조정","ans":"O","html":"<span class=\"kw\">세무조정</span>에서 <span class=\"kw\">익금산입·손금불산입</span>은 가산조정, <span class=\"kw\">익금불산입·손금산입</span>은 차감조정이다.","explain":"<span class=\"kw\">당기순이익</span>에 세무조정을 반영해 <span class=\"kw\">각 사업연도 소득금액</span>을 구한다.","id":"q315"},{"module":2,"subject":"세금설계","topic":"부가가치세 특징","ans":"O","html":"<span class=\"kw\">부가가치세</span>는 <span class=\"kw\">간접세·일반소비세</span>이자 <span class=\"kw\">소비지국 과세원칙</span>을 따르는 다단계거래세다.","explain":"<span class=\"kw\">전단계세액공제법</span><span class=\"kw\">과 신고납세제도</span>를 채택한다.","id":"q316"},{"module":2,"subject":"세금설계","topic":"간주공급","ans":"O","html":"재화의 <span class=\"kw\">간주공급</span>에는 <span class=\"kw\">자가공급</span>, 개인적 공급, <span class=\"kw\">사업상 증여</span>, <span class=\"kw\">폐업 시 잔존재화</span>가 있다.","explain":"<span class=\"kw\">재화</span>의 수입은 <span class=\"kw\">수입신고 수리 전</span> 물품을 말한다.","id":"q317"},{"module":2,"subject":"세금설계","topic":"매입세액 불공제","ans":"O","html":"<span class=\"kw\">비영업용 소형승용차</span>, 면세사업 관련, <span class=\"kw\">토지 관련</span> <span class=\"kw\">매입세액</span>은 공제되지 않는다.","explain":"<span class=\"kw\">매입세액</span>은 <span class=\"kw\">사업자등록 전</span>이면 공제되지 않는다.","id":"q318"},{"module":2,"subject":"세금설계","topic":"과세표준","ans":"X","html":"<span class=\"kw\">부가가치세</span> 과세표준에서 <span class=\"kw\">대손금·판매장려금</span>은 공제한다.","explain":"<span class=\"kw\">과세표준</span>에서 대손금·판매장려금·하자보증금·마일리지는 <span class=\"kw\">공제하지 않는다</span>.","id":"q319"},{"module":2,"subject":"세금설계","topic":"금융소득 종합과세","ans":"O","html":"<span class=\"kw\">출자공동사업자</span>의 손익분배금, 국외 미원천 <span class=\"kw\">금융소득</span>, <span class=\"kw\">비영업대금 이익</span>은 무조건 종합과세된다.","explain":"그 외 금융소득은 <span class=\"kw\">2천만 원 초과</span> 시 조건부 <span class=\"kw\">종합과세</span>된다.","id":"q320"},{"module":2,"subject":"세금설계","topic":"Gross-up","ans":"X","html":"배당가산액(<span class=\"kw\">Gross-up</span>)은 종합과세되는 배당소득 <span class=\"kw\">전체</span>에 <span class=\"kw\">10%</span>를 더한다.","explain":"<span class=\"kw\">Gross-up</span>은 <span class=\"kw\">2천만 원 초과분</span>에만 적용된다.","id":"q321"},{"module":2,"subject":"세금설계","topic":"주식 양도소득세","ans":"O","html":"상장주식 <span class=\"kw\">대주주</span> 기준은 <span class=\"kw\">유가증권 1%</span>, 코스닥 2%, <span class=\"kw\">코넥스 4%</span> 또는 50억 원이다.","explain":"<span class=\"kw\">장외거래</span>는 대주주 여부와 관계없이 <span class=\"kw\">과세</span>된다.","id":"q322"},{"module":2,"subject":"세금설계","topic":"취득세","ans":"O","html":"1주택자가 주택을 유상취득하면 <span class=\"kw\">6억 원 이하 1%</span>, 6억~9억 원은 <span class=\"kw\">가액에 따른 세율</span>, 9억 원 초과 3%다.","explain":"상속에 따른 무상취득은 <span class=\"kw\">시가표준액</span>으로 <span class=\"kw\">과세</span>한다.","id":"q323"},{"module":2,"subject":"세금설계","topic":"재산세","ans":"O","html":"<span class=\"kw\">재산세</span>는 <span class=\"kw\">6월 1일</span> 기준으로 부과되고 <span class=\"kw\">20% 지방교육세</span>가 부가되며, 직전 연도 세액의 <span class=\"kw\">150%</span>가 상한이다.","explain":"<span class=\"kw\">주택</span>에는 세부담 상한을 <span class=\"kw\">적용하지 않는다</span>.","id":"q324"},{"module":2,"subject":"세금설계","topic":"종합부동산세","ans":"O","html":"<span class=\"kw\">종부세</span>는 <span class=\"kw\">6월 1일</span> 기준으로 주택 <span class=\"kw\">9억 원</span>(1세대 1주택 12억 원), 종합합산토지 5억 원, 별도합산토지 <span class=\"kw\">80억 원</span> 초과분에 과세된다.","explain":"<span class=\"kw\">종부세</span>에는 <span class=\"kw\">20% 농어촌특별세</span>가 부가된다.","id":"q325"},{"module":2,"subject":"세금설계","topic":"양도소득세","ans":"O","html":"<span class=\"kw\">부담부증여</span>, 위자료 대물변제, <span class=\"kw\">공동사업 현물출자</span>, 협의매수·수용은 양도로 본다.","explain":"<span class=\"kw\">양도소득세</span>에서 <span class=\"kw\">환지처분</span>·양도담보 제공·신탁해지·재산분할은 양도로 보지 않는다.","id":"q326"},{"module":2,"subject":"세금설계","topic":"장기보유특별공제","ans":"O","html":"<span class=\"kw\">장기보유특별공제</span>는 토지·건물은 <span class=\"kw\">연 2%씩 15년</span> 최대 30%, 1세대 1주택은 <span class=\"kw\">보유 40%+거주 40%</span>로 최대 80%다.","explain":"<span class=\"kw\">1세대 1주택자</span>는 <span class=\"kw\">12억 원</span>이다.","id":"q327"},{"module":2,"subject":"세금설계","topic":"고가주택","ans":"X","html":"<span class=\"kw\">1세대 1주택 비과세</span>는 양도가액 <span class=\"kw\">9억 원</span> 이하 주택에 적용된다.","explain":"<span class=\"kw\">고가주택 기준</span>은 <span class=\"kw\">12억 원</span>이다.","id":"q328"},{"module":2,"subject":"세금설계","topic":"퇴직소득","ans":"O","html":"<span class=\"kw\">퇴직소득</span>은 근속연수 공제 후 근속연수로 나눠 <span class=\"kw\">12를 곱한 환산급여</span>에서 다시 공제하고, 산출세액을 <span class=\"kw\">12로 나눈 뒤 근속연수를 곱한다</span>.","explain":"<span class=\"kw\">퇴직소득</span>의 <span class=\"kw\">연분연승</span> 구조다.","id":"q329"},{"module":2,"subject":"세금설계","topic":"퇴직소득 과세이연","ans":"O","html":"세후 퇴직금을 받은 날부터 <span class=\"kw\">60일 이내</span> 연금계좌에 입금하면 낸 <span class=\"kw\">퇴직소득</span>세를 <span class=\"kw\">환급</span>받는다.","explain":"<span class=\"kw\">퇴직 전 계좌</span>를 열어 받으면 <span class=\"kw\">세전 금액</span>이 들어간다.","id":"q330"},{"module":2,"subject":"세금설계","topic":"사적연금","ans":"X","html":"<span class=\"kw\">사적연금</span> 자기부담금 납입한도는 연 <span class=\"kw\">1,200만 원</span>이다.","explain":"연 <span class=\"kw\">1,800만 원</span>에 ISA 전환금, 1주택 고령가구 차액(<span class=\"kw\">1억</span> 한도)이 더해진다.","id":"q331"},{"module":2,"subject":"세금설계","topic":"연금계좌 과세","ans":"O","html":"연금계좌에서 연금으로 받는 이연<span class=\"kw\">퇴직소득</span>은 퇴직소득세율의 <span class=\"kw\">70%</span>(11년차 60%, 21년차 50%)로 <span class=\"kw\">무조건 분리과세</span>된다.","explain":"그 외 소득은 <span class=\"kw\">3~5%</span> 원천징수되고, 연 <span class=\"kw\">1,500만</span> 원을 넘으면 합산 또는 15% 분리과세다.","id":"q332"},{"module":1,"subject":"재무설계 개론·직업윤리","topic":"기본 회계원칙","ans":"O","html":"개인재무제표의 기본 회계원칙은 <span class=\"kw\">객관성·중요성·일관성</span>, <span class=\"kw\">보수주의</span>, <span class=\"kw\">완전공개</span>다.","explain":"<span class=\"kw\">보수주의</span>는 <span class=\"kw\">불확실한 상황</span>에서 신중하게 평가하는 원칙이다.","id":"q333"},{"module":1,"subject":"재무설계 개론·직업윤리","topic":"금융상품 유형","ans":"O","html":"금융상품은 <span class=\"kw\">예금성·대출성·투자성·보장성</span>으로 나뉘고, 판매채널은 <span class=\"kw\">직접판매·대리중개·자문</span>으로 구분된다.","explain":"<span class=\"kw\">보장성 상품</span>은 <span class=\"kw\">보험</span>이 대표적이다.","id":"q334"},{"module":1,"subject":"재무설계 개론·직업윤리","topic":"행동규범","ans":"O","html":"재무설계사 행동규범은 <span class=\"kw\">업무수임과 계약</span>, 정보제공·투명성, 고객 자산·정보 보호, <span class=\"kw\">전문적 직무 수행</span>, 인증기관·사회에 대한 의무의 5영역이다.","explain":"<span class=\"kw\">고객 자산·정보 보호</span>는 <span class=\"kw\">기본적 윤리적 책무</span>다.","id":"q335"},{"module":1,"subject":"재무설계 개론·직업윤리","topic":"대출금리","ans":"O","html":"연체이자율은 <span class=\"kw\">법정 최고금리 20%</span> 범위에서 <span class=\"kw\">약정이자율 + 3%</span> 이내로 제한된다.","explain":"<span class=\"kw\">금리인하요구권</span>을 <span class=\"kw\">위반하면 과태료</span>가 부과된다.","id":"q336"},{"module":1,"subject":"재무설계 개론·직업윤리","topic":"대출상환방식","ans":"X","html":"초기 상환 부담은 <span class=\"kw\">만기일시상환</span>이 <span class=\"kw\">원금균등분할상환</span>보다 크다.","explain":"<span class=\"kw\">부담 순서</span>는 <span class=\"kw\">원금균등 &lt; 원리금균등 &lt; 만기일시</span>다. 만기일시가 초기 부담이 가장 작다.","id":"q337"},{"module":1,"subject":"재무설계 개론·직업윤리","topic":"LTV","ans":"X","html":"<span class=\"kw\">LTV</span>는 분자에 <span class=\"kw\">주택담보대출금액만</span> 넣어 계산한다.","explain":"<span class=\"kw\">분자</span>에 <span class=\"kw\">선순위채권·임차보증금</span>도 포함한다.","id":"q338"},{"module":1,"subject":"재무설계 개론·직업윤리","topic":"신용정보","ans":"X","html":"신용정보 <span class=\"kw\">고지 요구권</span>은 고지받은 날부터 <span class=\"kw\">30일</span> 이내에 자료의 정확성 확인을 요청하는 권리다.","explain":"<span class=\"kw\">고지 요구권</span>은 <span class=\"kw\">60일 이내</span>에 요청할 수 있다.","id":"q339"},{"module":1,"subject":"재무설계 개론·직업윤리","topic":"금리인하요구권","ans":"X","html":"<span class=\"kw\">금리인하요구권</span>을 위반한 금융회사는 <span class=\"kw\">형사처벌</span>을 받는다.","explain":"<span class=\"kw\">과태료</span>가 부과된다. <span class=\"kw\">형사처벌</span>이 아니다.","id":"q340"},{"module":1,"subject":"은퇴설계","topic":"은퇴설계 절차","ans":"O","html":"은퇴설계는 <span class=\"kw\">총은퇴일시금 산정</span> → 은퇴자산 평가 → 추가저축액 계산 → <span class=\"kw\">저축·투자계획 수립</span> 순으로 진행한다.","explain":"<span class=\"kw\">연간 저축액</span>과 <span class=\"kw\">저축여력</span>을 비교해 목표를 수정한다.","id":"q341"},{"module":1,"subject":"은퇴설계","topic":"소득 있는 업무","ans":"O","html":"소득이 있는 업무에 종사하면 지급개시연령부터 <span class=\"kw\">5년 동안</span> 연금액의 <span class=\"kw\">1/2 한도</span>로 감액되고 <span class=\"kw\">부양가족연금액은 지급되지 않는다</span>.","explain":"<span class=\"kw\">감액 기준</span>은 <span class=\"kw\">소득 수준</span>에 따라 달라진다.","id":"q342"},{"module":1,"subject":"은퇴설계","topic":"반환일시금","ans":"O","html":"반환일시금 <span class=\"kw\">반납</span>은 <span class=\"kw\">최대 24개월</span>까지 허용되고, 이자는 1년 만기 정기예금 이자율을 적용한다.","explain":"<span class=\"kw\">반환일시금</span>은 <span class=\"kw\">납부예외자</span>도 반납할 수 있다.","id":"q343"},{"module":1,"subject":"은퇴설계","topic":"공적연금 연계","ans":"O","html":"공적연금 연계에서 <span class=\"kw\">군복무·출산크레딧</span>은 연계대상기간에서 제외되고, <span class=\"kw\">장해연금 간 연계</span>는 없다.","explain":"<span class=\"kw\">연계기간</span>이 <span class=\"kw\">1년 미만</span>이면 일시금으로 지급한다.","id":"q344"},{"module":1,"subject":"은퇴설계","topic":"중소기업퇴직연금기금","ans":"X","html":"중소기업퇴직연금기금은 <span class=\"kw\">100인 이하</span> 사업장이면 <span class=\"kw\">2026년부터</span> 바로 가입할 수 있다.","explain":"현재는 <span class=\"kw\">50인 이하</span>이고, 100인 이하는 <span class=\"kw\">2027년 1월</span>부터다.","id":"q345"},{"module":1,"subject":"은퇴설계","topic":"연금저축 종류","ans":"X","html":"<span class=\"kw\">연금저축펀드</span>는 <span class=\"kw\">예금자보호 대상</span>이고 원금이 보장된다.","explain":"<span class=\"kw\">연금저축펀드</span>는 <span class=\"kw\">예금자보호 대상이 아니고</span> 원금이 보장되지 않는다.","id":"q346"},{"module":1,"subject":"은퇴설계","topic":"DB형","ans":"X","html":"DB형 퇴직연금은 <span class=\"kw\">상시 100인 이상</span> 사업장에서 <span class=\"kw\">운영위원회</span>를 구성해야 한다.","explain":"<span class=\"kw\">300인 이상</span> <span class=\"kw\">사업장</span>이 대상이다.","id":"q347"},{"module":1,"subject":"은퇴설계","topic":"IRP 과세","ans":"X","html":"IRP에서 <span class=\"kw\">퇴직급여 납입액</span>을 일시금으로 받으면 <span class=\"kw\">기타소득세 15%</span>가 과세된다.","explain":"퇴직급여 납입액은 <span class=\"kw\">퇴직소득세 100%</span>다. 기타소득세 15%는 <span class=\"kw\">가입자 납입액·운용수익</span>이다.","id":"q348"},{"module":1,"subject":"부동산설계","topic":"도시·군관리계획","ans":"O","html":"도시·군관리계획에는 <span class=\"kw\">용도지역·용도지구</span> 지정, <span class=\"kw\">기반시설</span> 설치, <span class=\"kw\">지구단위계획</span>이 포함된다.","explain":"<span class=\"kw\">개발제한구역·시가화조정구역</span> 지정도 <span class=\"kw\">도시·군관리계획</span>이다.","id":"q349"},{"module":1,"subject":"부동산설계","topic":"용도구역","ans":"O","html":"2025년 개정으로 <span class=\"kw\">도시혁신구역</span>, <span class=\"kw\">복합용도구역</span>, 도시·군계획시설<span class=\"kw\">입체복합구역</span>이 추가되었다.","explain":"<span class=\"kw\">입체복합구역</span>은 시설 <span class=\"kw\">준공 후 10년</span> 경과 등이 요건이다.","id":"q350"},{"module":1,"subject":"부동산설계","topic":"묵시적 갱신","ans":"O","html":"주택 임대차에서 임대인이 기간 종료 <span class=\"kw\">6개월 전부터 2개월 전</span>까지 갱신 거절을 통지하지 않으면 <span class=\"kw\">묵시적 갱신</span>된다.","explain":"<span class=\"kw\">임차인</span>은 언제든 해지 통고를 할 수 있고 <span class=\"kw\">3개월</span> 뒤 효력이 생긴다.","id":"q351"},{"module":1,"subject":"부동산설계","topic":"전문(테마)상가","ans":"X","html":"<span class=\"kw\">전문(테마)상가</span>는 <span class=\"kw\">투자금액이 작아</span> 위험 부담이 적다.","explain":"유사 품목이 밀집해 <span class=\"kw\">고객응집력</span>은 강하지만 <span class=\"kw\">투자금액이 커</span> 위험이 따른다.","id":"q352"},{"module":1,"subject":"부동산설계","topic":"상가임대차","ans":"X","html":"<span class=\"kw\">상가건물임대차</span>에서 차임 연체액이 <span class=\"kw\">2기</span>에 달하면 임대인이 계약을 해지할 수 있다.","explain":"<span class=\"kw\">상가</span>는 <span class=\"kw\">3기</span> 차임 연체 시 해지할 수 있다(주택은 2기).","id":"q353"},{"module":1,"subject":"부동산설계","topic":"총유","ans":"X","html":"<span class=\"kw\">총유</span>는 <span class=\"kw\">지분이 있어</span> 각자가 지분을 자유롭게 처분할 수 있다.","explain":"총유는 <span class=\"kw\">지분이 없고</span> 목적물 처분은 <span class=\"kw\">사원총회 결의</span>로 한다.","id":"q354"},{"module":1,"subject":"상속설계","topic":"상속인 부존재","ans":"O","html":"상속인이 없으면 <span class=\"kw\">특별연고자</span>의 청구에 따라 가정법원이 재산을 분여하고, 남은 재산은 <span class=\"kw\">국가에 귀속</span>된다.","explain":"<span class=\"kw\">특별연고자</span>에게 분여하고 남은 재산은 <span class=\"kw\">국가에 귀속</span>된다.","id":"q355"},{"module":1,"subject":"상속설계","topic":"특별수익","ans":"O","html":"<span class=\"kw\">특별수익</span>은 공동상속인에 한정되고, 상속개시 당시의 <span class=\"kw\">시가</span>로 평가한다.","explain":"<span class=\"kw\">대습상속인</span>이 대습 지위에서 받은 증여도 <span class=\"kw\">특별수익</span>이다.","id":"q356"},{"module":1,"subject":"상속설계","topic":"기여분","ans":"O","html":"<span class=\"kw\">기여분</span>은 공동상속인의 협의 또는 <span class=\"kw\">가정법원</span>이 결정하며, <span class=\"kw\">유증이 기여분보다 우선</span>한다.","explain":"<span class=\"kw\">기여분</span>은 <span class=\"kw\">유류분과 관계없다</span>.","id":"q357"},{"module":1,"subject":"상속설계","topic":"자필증서 유언","ans":"O","html":"<span class=\"kw\">자필증서</span> 유언은 전문·작성연월일·주소·성명을 <span class=\"kw\">자서하고 날인</span>해야 한다.","explain":"<span class=\"kw\">자필증서</span>는 <span class=\"kw\">증인이 필요 없다</span>.","id":"q358"},{"module":1,"subject":"상속설계","topic":"유언 증인","ans":"O","html":"유언의 <span class=\"kw\">증인</span>이 될 수 없는 자에는 <span class=\"kw\">미성년자</span>, 피성년·피한정후견인, <span class=\"kw\">유언으로 이익을 받는 자</span>가 있다.","explain":"<span class=\"kw\">미성년자</span>는 <span class=\"kw\">법정대리인 동의가 있어도</span> 결격이다.","id":"q359"},{"module":1,"subject":"상속설계","topic":"장례비 공제","ans":"O","html":"장례비는 증빙이 없으면 <span class=\"kw\">최소 500만 원</span>, 증빙이 있으면 <span class=\"kw\">최대 1천만 원</span>까지 공제된다.","explain":"봉안시설·<span class=\"kw\">자연장지 비용</span>은 <span class=\"kw\">500만 원 한도</span>로 추가 공제된다.","id":"q360"},{"module":1,"subject":"상속설계","topic":"후견제도","ans":"X","html":"<span class=\"kw\">성년후견</span>은 원칙적으로 <span class=\"kw\">행위능력자</span>로 본다.","explain":"<span class=\"kw\">성년후견</span>은 <span class=\"kw\">행위능력이 원칙적으로 제한</span>된다. 한정후견이 원칙적 행위능력자다.","id":"q361"},{"module":1,"subject":"상속설계","topic":"자녀공제","ans":"X","html":"<span class=\"kw\">자녀공제</span>는 피상속인의 자녀 수 × <span class=\"kw\">1억 원</span>이다.","explain":"<span class=\"kw\">자녀공제</span>는 자녀 수 × <span class=\"kw\">5천만 원</span>이다.","id":"q362"},{"module":1,"subject":"상속설계","topic":"단기재상속","ans":"X","html":"<span class=\"kw\">단기재상속세액공제</span>는 <span class=\"kw\">5년 이내</span> 상속에 대해 1년당 10%를 공제한다.","explain":"<span class=\"kw\">10년 이내</span> <span class=\"kw\">상속</span>이 대상이다.","id":"q363"},{"module":1,"subject":"상속설계","topic":"증여재산 반환","ans":"X","html":"증여세 신고기한이 지난 후 <span class=\"kw\">3개월 뒤</span> 증여받은 재산을 반환하면 <span class=\"kw\">과세제외</span>된다.","explain":"신고기한 후 <span class=\"kw\">3개월</span>이 지나면 <span class=\"kw\">모두 과세</span>된다.","id":"q364"},{"module":1,"subject":"상속설계","topic":"가업승계","ans":"X","html":"<span class=\"kw\">가업승계</span> 증여세 과세특례의 증여재산가액 <span class=\"kw\">한도</span>는 <span class=\"kw\">500억 원</span>이다.","explain":"<span class=\"kw\">가업승계증여특례</span>는 <span class=\"kw\">600억 원</span> 한도다.","id":"q365"},{"module":1,"subject":"상속설계","topic":"상장주식 평가","ans":"X","html":"<span class=\"kw\">상장주식</span>은 평가기준일 전·후 각 <span class=\"kw\">1개월</span>의 <span class=\"kw\">종가평균액</span>으로 평가한다.","explain":"상장주식은 각 <span class=\"kw\">2개월</span>의 <span class=\"kw\">종가평균액</span>이다.","id":"q366"},{"module":2,"subject":"위험관리와 보험설계","topic":"보험료 결정","ans":"O","html":"보험료는 <span class=\"kw\">예정위험률</span>이 높아지면 오르고, <span class=\"kw\">예정이자율</span>이 높아지면 내려가며, <span class=\"kw\">예정사업비율</span>이 높아지면 오른다.","explain":"<span class=\"kw\">세 요소</span>를 합쳐 <span class=\"kw\">영업보험료</span>를 산출한다.","id":"q367"},{"module":2,"subject":"위험관리와 보험설계","topic":"노후·유병력자 실손","ans":"O","html":"<span class=\"kw\">노후실손</span>은 급여 20%·비급여 30% 자기부담에 <span class=\"kw\">우선공제 30만 원</span>이 있고, <span class=\"kw\">유병력자 실손</span>은 최소 자기부담금이 10만 원이다.","explain":"<span class=\"kw\">노후실손</span>은 <span class=\"kw\">75세까지</span> 가입할 수 있다.","id":"q368"},{"module":2,"subject":"위험관리와 보험설계","topic":"장기간병보험","ans":"O","html":"장기간병보험은 <span class=\"kw\">일상생활장해 면책 90일</span>, <span class=\"kw\">중증치매 면책 2년</span>을 두지만 <span class=\"kw\">재해</span>로 인한 경우 면책 중에도 보장한다.","explain":"<span class=\"kw\">민간보험</span>은 <span class=\"kw\">임의가입</span>이다.","id":"q369"},{"module":2,"subject":"위험관리와 보험설계","topic":"무보험자동차","ans":"O","html":"<span class=\"kw\">무보험자동차에 의한 상해</span>는 대인배상Ⅰ·Ⅱ, 대물배상, <span class=\"kw\">자기신체사고</span>가 함께 체결된 경우 가입할 수 있다.","explain":"무보험차는 <span class=\"kw\">비례 보상</span>하고 <span class=\"kw\">자기신체사고</span>가 필요하다.","id":"q370"},{"module":2,"subject":"위험관리와 보험설계","topic":"다중이용업소","ans":"X","html":"<span class=\"kw\">다중이용업소 화재배상책임보험</span>은 <span class=\"kw\">과실책임</span>을 담보한다.","explain":"<span class=\"kw\">다중이용업소</span>는 2021년부터 <span class=\"kw\">무과실 배상</span>이다.","id":"q371"},{"module":2,"subject":"위험관리와 보험설계","topic":"화재보험","ans":"X","html":"화재보험은 <span class=\"kw\">자연발화</span>로 생긴 손해도 <span class=\"kw\">보상</span>한다.","explain":"<span class=\"kw\">자연발화 손해</span>는 <span class=\"kw\">보상하지 않는다</span>. 다만 그로 인해 연소된 다른 목적의 손해는 보상한다.","id":"q372"},{"module":2,"subject":"위험관리와 보험설계","topic":"보험료 결정","ans":"X","html":"<span class=\"kw\">예정이자율</span>이 높아지면 <span class=\"kw\">보험료가 오른다</span>.","explain":"<span class=\"kw\">예정이자율</span>이 높아지면 <span class=\"kw\">보험료가 내려간다</span>.","id":"q373"},{"module":2,"subject":"위험관리와 보험설계","topic":"유병력자 실손","ans":"X","html":"<span class=\"kw\">유병력자 실손</span>은 <span class=\"kw\">최소 자기부담금이 없다</span>.","explain":"<span class=\"kw\">최소 자기부담금</span>이 <span class=\"kw\">10만 원</span>(통원 2만 원) 있다.","id":"q374"},{"module":2,"subject":"투자설계","topic":"공분산·상관계수","ans":"O","html":"<span class=\"kw\">공분산</span>은 값의 범위에 제한이 없어 표준화가 필요하고, <span class=\"kw\">상관계수</span>는 −1에서 +1 사이의 값이다.","explain":"<span class=\"kw\">상관계수</span>가 <span class=\"kw\">−1에 가까울수록</span> 분산투자 효과가 크다.","id":"q375"},{"module":2,"subject":"투자설계","topic":"경기지표","ans":"O","html":"<span class=\"kw\">CSI</span>와 <span class=\"kw\">ESI</span>는 <span class=\"kw\">한국은행</span>이 조사해 발표하는 경제심리지표다.","explain":"<span class=\"kw\">ESI</span>는 <span class=\"kw\">BSI와 CSI</span>를 합성한 지수다.","id":"q376"},{"module":2,"subject":"투자설계","topic":"환율","ans":"O","html":"<span class=\"kw\">매입률</span>은 은행이 고객에게서 외환을 살 때, <span class=\"kw\">매도율</span>은 고객에게 팔 때 적용하는 환율이다.","explain":"<span class=\"kw\">원화→달러</span> 환전에는 <span class=\"kw\">현찰매도율</span>이 적용된다.","id":"q377"},{"module":2,"subject":"투자설계","topic":"옵션","ans":"O","html":"<span class=\"kw\">콜옵션 매수</span>의 손익분기점은 행사가격 + 프리미엄, <span class=\"kw\">풋옵션 매수</span>는 행사가격 − 프리미엄이다.","explain":"옵션 <span class=\"kw\">매수</span>의 손실은 <span class=\"kw\">프리미엄</span>으로 제한된다.","id":"q378"},{"module":2,"subject":"투자설계","topic":"선물","ans":"X","html":"선물 <span class=\"kw\">매도자</span>의 손익은 (만기 현물가격 − 매도가격) × <span class=\"kw\">거래승수</span>다.","explain":"<span class=\"kw\">매도자</span>는 (매도가격 − 만기 현물가격)으로 계산한다. 부호가 <span class=\"kw\">반대</span>다.","id":"q379"},{"module":2,"subject":"투자설계","topic":"TIF","ans":"X","html":"<span class=\"kw\">TIF</span>는 은퇴가 가까워질수록 <span class=\"kw\">주식 비중을 늘리는</span> 펀드다.","explain":"TIF는 주식·<span class=\"kw\">채권 비중</span>을 <span class=\"kw\">일정하게 유지</span>하는 밸런스 전략이다.","id":"q380"},{"module":2,"subject":"투자설계","topic":"유상증자","ans":"X","html":"<span class=\"kw\">일반공모방식</span>은 기존 주주에게 <span class=\"kw\">신주인수권</span>을 주고 청약을 받는다.","explain":"<span class=\"kw\">일반공모</span>는 신주인수권 <span class=\"kw\">없이</span> 일반투자자에게 청약을 받는다.","id":"q381"},{"module":2,"subject":"세금설계","topic":"재산세","ans":"O","html":"재산세는 토지 <span class=\"kw\">9월 16~30일</span>, 건축물 <span class=\"kw\">7월 16~31일</span>이 납기이고, <span class=\"kw\">250만 원 초과</span>면 3개월 이내 분납할 수 있다.","explain":"<span class=\"kw\">주택분 재산세</span>는 <span class=\"kw\">7월과 9월</span>에 나눠 부과된다.","id":"q382"},{"module":2,"subject":"세금설계","topic":"양도소득세","ans":"O","html":"양도소득 필요경비는 취득가액을 확인할 수 있으면 <span class=\"kw\">실비공제</span>, 확인할 수 없으면 <span class=\"kw\">개산공제</span>한다.","explain":"상속·<span class=\"kw\">증여 취득</span>도 <span class=\"kw\">실지거래가액</span>을 확인할 수 있으면 실비공제다.","id":"q383"},{"module":2,"subject":"세금설계","topic":"1세대 1주택","ans":"O","html":"1세대 1주택 비과세의 <span class=\"kw\">보유기간 요건</span>은 해외이주로 출국해 <span class=\"kw\">2년 이내</span> 양도하면 배제된다.","explain":"1년 이상 거주 후 <span class=\"kw\">취학·질병·근무</span>로 다른 <span class=\"kw\">시·군</span>으로 이사한 경우도 제외된다.","id":"q384"},{"module":2,"subject":"세금설계","topic":"퇴직소득","ans":"O","html":"퇴직소득은 <span class=\"kw\">근속연수공제</span> 후 근속연수로 나눠 12를 곱하고, <span class=\"kw\">환산급여공제</span>를 다시 적용한다.","explain":"<span class=\"kw\">산출세액</span>은 12로 나눈 뒤 <span class=\"kw\">근속연수</span>를 곱한다.","id":"q385"},{"module":2,"subject":"세금설계","topic":"종합부동산세","ans":"X","html":"1세대 1주택자의 종부세는 <span class=\"kw\">장기보유·노령자 세액공제</span>를 합쳐 <span class=\"kw\">100%</span>까지 공제된다.","explain":"<span class=\"kw\">공제 한도</span>는 <span class=\"kw\">80%</span>다.","id":"q386"},{"module":2,"subject":"세금설계","topic":"취득세","ans":"X","html":"1주택자가 <span class=\"kw\">6억 원 초과 9억 원 이하</span> 주택을 유상취득하면 세율은 <span class=\"kw\">2%</span>다.","explain":"<span class=\"kw\">가액</span>에 따라 <span class=\"kw\">1~3%</span> 사이의 세율이 적용된다(6억 이하 1%, 9억 초과 3%).","id":"q387"},{"module":2,"subject":"세금설계","topic":"현금영수증","ans":"X","html":"<span class=\"kw\">현금영수증</span> 의무발급 업종에는 <span class=\"kw\">부동산중개업</span>이 포함되지 않는다.","explain":"<span class=\"kw\">부동산중개업</span>은 <span class=\"kw\">의무발급 업종</span>이다.","id":"q388"},{"module":1,"subject":"재무설계 개론·직업윤리","topic":"생애주기별 재무관심사","ans":"O","html":"<span class=\"kw\">사회초년기</span>는 주거자금·학자금 상환·결혼자금이, <span class=\"kw\">생애전환기</span>는 자녀독립자금·<span class=\"kw\">노후종합설계</span>가 관심사다.","explain":"노후생활기는 <span class=\"kw\">노후생활비·의료비</span>와 <span class=\"kw\">자산 이전</span>의 세무관리가 핵심이다.","id":"q389"},{"module":1,"subject":"재무설계 개론·직업윤리","topic":"재무목표 구체화","ans":"X","html":"<span class=\"kw\">재무목표 구체화</span>는 인생목표를 <span class=\"kw\">정성적으로 서술</span>하는 것이다.","explain":"인생목표를 <span class=\"kw\">수치화(정량화)</span>하고 <span class=\"kw\">우선순위</span>를 정하는 것이다.","id":"q390"},{"module":1,"subject":"재무설계 개론·직업윤리","topic":"장단기 배분","ans":"O","html":"<span class=\"kw\">안정자산</span>은 위험관리·은퇴설계에, <span class=\"kw\">운용자산</span>은 비상예비자금·<span class=\"kw\">초단기 목적자금</span>에 배분한다.","explain":"<span class=\"kw\">투자자산</span>은 <span class=\"kw\">장기 목표</span> 자금에 배분한다.","id":"q391"},{"module":1,"subject":"은퇴설계","topic":"기초연금","ans":"X","html":"기초연금은 <span class=\"kw\">국외 체류</span>가 <span class=\"kw\">30일</span> 이상 지속되면 지급이 정지된다.","explain":"<span class=\"kw\">60일 이상</span> 지속될 때 <span class=\"kw\">지급이 정지</span>된다.","id":"q392"},{"module":1,"subject":"은퇴설계","topic":"주택연금","ans":"O","html":"주택연금은 <span class=\"kw\">12억 원 이하</span> 주택이 대상이고, 12억 원 초과 <span class=\"kw\">2주택자</span>는 <span class=\"kw\">3년 이내 1주택 처분</span> 조건으로 가입할 수 있다.","explain":"<span class=\"kw\">우대방식</span>은 <span class=\"kw\">기초연금 수급자</span>·2.5억 원 미만 1주택이 대상이다.","id":"q393"},{"module":1,"subject":"은퇴설계","topic":"연금저축 종류","ans":"X","html":"연금저축은 <span class=\"kw\">연금저축보험</span>과 <span class=\"kw\">연금저축신탁</span>의 <span class=\"kw\">2종류</span>다.","explain":"<span class=\"kw\">연금저축펀드</span>까지 3종류다. 펀드는 <span class=\"kw\">원금 비보장</span>이다.","id":"q394"},{"module":1,"subject":"은퇴설계","topic":"기초연금 감액","ans":"O","html":"기초연금은 <span class=\"kw\">단독·부부 1인</span> 수급이면 기준연금액의 <span class=\"kw\">10%</span>, <span class=\"kw\">부부 2인</span> 수급이면 <span class=\"kw\">20%</span> 감액된다.","explain":"감액 후에도 <span class=\"kw\">최저연금액</span>은 <span class=\"kw\">지급</span>된다.","id":"q395"},{"module":1,"subject":"부동산설계","topic":"용도지역","ans":"O","html":"용도지역은 <span class=\"kw\">도시지역</span>, 관리지역, <span class=\"kw\">농림지역</span>, <span class=\"kw\">자연환경보전지역</span>으로 구분된다.","explain":"도시지역은 <span class=\"kw\">주거·상업·공업·녹지</span>의 <span class=\"kw\">4종</span>으로 나뉜다.","id":"q396"},{"module":1,"subject":"부동산설계","topic":"상가임대차","ans":"O","html":"상가의 <span class=\"kw\">월차임</span>을 보증금으로 전환할 때는 월차임의 <span class=\"kw\">100배</span>로 환산한다.","explain":"상가는 <span class=\"kw\">100배</span>, 주택은 <span class=\"kw\">연 10%</span> 또는 기준금리+2%가 적용된다.","id":"q397"},{"module":1,"subject":"부동산설계","topic":"지목","ans":"X","html":"<span class=\"kw\">하천</span>은 인공적인 수로 부지, <span class=\"kw\">구거</span>는 자연적 유수가 있는 부지다.","explain":"반대다. 하천은 <span class=\"kw\">자연적 유수</span>, 구거는 <span class=\"kw\">인공 수로</span> 또는 소규모 수로다.","id":"q398"},{"module":1,"subject":"상속설계","topic":"유류분 부족액","ans":"O","html":"유류분 부족액은 <span class=\"kw\">기초재산 × 유류분 비율</span>에서 <span class=\"kw\">특별수익</span>과 <span class=\"kw\">순상속액</span>을 빼서 계산한다.","explain":"유류분 비율은 <span class=\"kw\">법정상속분의 1/2 또는 1/3</span>이고, <span class=\"kw\">기여분은 반환대상이 아니다</span>.","id":"q399"},{"module":1,"subject":"상속설계","topic":"유언의 방식","ans":"X","html":"<span class=\"kw\">공정증서</span> 유언은 유언자가 <span class=\"kw\">증인 1인</span>과 공증인에게 구술해 작성한다.","explain":"<span class=\"kw\">증인 2인</span>과 <span class=\"kw\">공증인</span>이 필요하다. 녹음 유언은 증인 1인 이상이 확인한다.","id":"q400"},{"module":1,"subject":"상속설계","topic":"유언대용신탁","ans":"X","html":"<span class=\"kw\">유언대용신탁</span>은 위탁자가 생전에 신탁하고 사후 수익자를 정하지만, <span class=\"kw\">유류분 침해</span> 시에도 청구 대상이 될 수 없다.","explain":"유류분 침해 시 <span class=\"kw\">청구 대상</span>이 <span class=\"kw\">될 수 있다</span>.","id":"q401"},{"module":1,"subject":"상속설계","topic":"상속재산","ans":"O","html":"<span class=\"kw\">생명보험 청구권</span>, 퇴직연금·<span class=\"kw\">유족연금</span> 청구권처럼 법률·계약으로 구속이 정해진 권리는 <span class=\"kw\">상속재산이 아니다</span>.","explain":"다만 계약자가 <span class=\"kw\">본인을 피보험자·수익자</span>로 정한 보험금 청구권은 <span class=\"kw\">상속재산</span>이다.","id":"q402"},{"module":1,"subject":"상속설계","topic":"부담부유증","ans":"X","html":"<span class=\"kw\">부담부유증</span>에서 수유자가 부담을 이행하지 않아도 <span class=\"kw\">유언을 취소할 수 없다</span>.","explain":"이행 최고 후 <span class=\"kw\">가정법원에 취소를 청구</span>할 수 있고, 취소 심판 시 <span class=\"kw\">상속개시 시로 소급</span>한다.","id":"q403"},{"module":1,"subject":"상속설계","topic":"창업자금 특례","ans":"O","html":"창업자금 증여특례는 <span class=\"kw\">50억 원</span>(10인 이상 고용 시 100억 원) 한도에 <span class=\"kw\">5억 원 공제</span>와 <span class=\"kw\">10% 세율</span>이 적용된다.","explain":"수증자는 <span class=\"kw\">18세 이상</span>, 증여자는 <span class=\"kw\">60세 이상</span> 부모다.","id":"q404"},{"module":2,"subject":"위험관리와 보험설계","topic":"보장 개시","ans":"X","html":"<span class=\"kw\">보장 개시</span>는 <span class=\"kw\">청약을 승낙한 날</span>부터다.","explain":"<span class=\"kw\">제1회 보험료를 받은 날</span>부터 개시되고, 진단일이 늦으면 <span class=\"kw\">진단일</span>부터다.","id":"q405"},{"module":2,"subject":"위험관리와 보험설계","topic":"청약철회","ans":"O","html":"청약철회는 보험증권을 받은 날부터 <span class=\"kw\">15일</span>과 청약일부터 <span class=\"kw\">30일</span> 중 먼저 도래한 기간 내에 할 수 있다.","explain":"<span class=\"kw\">건강진단지원계약</span>, <span class=\"kw\">90일 이내</span> 계약, 전문소비자 계약은 제외된다.","id":"q406"},{"module":2,"subject":"위험관리와 보험설계","topic":"보험계약자 의무","ans":"X","html":"<span class=\"kw\">위험변경·증가 통지의무</span>는 <span class=\"kw\">보험회사</span>가 부담하는 의무다.","explain":"<span class=\"kw\">보험계약자</span>의 의무다. <span class=\"kw\">고지·손해방지</span> 의무도 계약자 몫이다.","id":"q407"},{"module":2,"subject":"위험관리와 보험설계","topic":"화재 비용손해","ans":"O","html":"<span class=\"kw\">잔존물제거비용</span>은 보험증권에 기재된 보험가입금액 범위 내에서 <span class=\"kw\">재산손해액의 10%</span>를 한도로 보상한다.","explain":"<span class=\"kw\">손해방지비용</span>·<span class=\"kw\">대위권 보전비용</span>도 비용손해다.","id":"q408"},{"module":2,"subject":"세금설계","topic":"소득세 계산구조","ans":"X","html":"종합소득세는 <span class=\"kw\">세액공제</span>를 먼저 적용한 뒤 <span class=\"kw\">세율</span>을 곱해 계산한다.","explain":"<span class=\"kw\">과세표준 × 세율</span>로 산출세액을 구한 뒤 <span clas       url: prov === "groq" ? "https://api.groq.com/openai/v1/chat/completions" : "https://api.openai.com/v1/chat/completions",

        method: "POST",

  function aiCopyText() {

        method: "POST",
        headers: { "Authorization": "Bearer " + key },
        body: fd
      }).then(function (res) {
        if (res.ok) {
          return res.json().then(function (d) {
            var t = ((d && d.text) || "").replace(/\s+/g, " ").trim();
            if (!t) throw { kind: "empty" };
            return t;
          });
        }
        return res.text().then(function (b) { return b || ""; }, function () { return ""; }).then(function (b) {
          var retry = res.status === 404 || res.status === 429 || res.status >= 500 ||
            (res.status === 400 && /model|not found|not supported|unsupported/i.test(b));
          if (retry) return attempt();
          throw { kind: (res.status === 401 || res.status === 403) ? "key" : "fail", status: res.status };
        });
      }, function () { throw { kind: "net" }; });
    }
    attempt().then(function (txt) {
      voiceCommit(txt);
      voiceHint("받아쓰기 완료 — 확인하고 전송을 눌러 주세요.", "", 4000);
    }, function (err) {
      voiceHint(aiErrText(err), "warn", 5000);
    });
  }

  function voiceNeedKey() {
    setKeyPanel(true);
    if (aiCfg.prov === "gemini") {
      voiceHint("음성 인식이 지원되지 않는 브라우저라 Gemini 무료 키를 먼저 저장하면 음성 녹음 질문이 가능해요", "warn", 10000);
    } else {
      voiceHint(AI_NAMES[aiCfg.prov] + " 키를 저장하면 녹음한 음성을 글로 바꿔 입력창에 넣어 드려요.", "warn", 9000);
    }
  }

  on(eAiMic, "click", voiceToggle);
  on(document, "visibilitychange", function () { if (document.hidden && VOICE.mode) voiceAbort(); });
  on(window, "pagehide", voiceAbort);
  on(window, "beforeunload", voiceAbort);

  on(eAiClose, "click", aiClose);
  on(eAiBack, "click", aiClose);
  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", aiFit);
    window.visualViewport.addEventListener("scroll", aiFit);
  }
  window.addEventListener("resize", function () { if (aiS.open) aiFit(); });
  window.addEventListener("orientationchange", function () {
    if (!aiFocused()) aiBaseH = 0;
    setTimeout(aiFit, 300);
  });
  document.addEventListener("focusin", function (e) {
    if (eAiSheet && e.target && eAiSheet.contains(e.target)) aiFitSoon(300);
  });
  document.addEventListener("focusout", function (e) {
    if (eAiSheet && e.target && eAiSheet.contains(e.target)) setTimeout(aiFit, 300);
  });
  on(eAiKeyBtn, "click", function () { if (eAiPanel) setKeyPanel(!!eAiPanel.hidden); });
  on(el("aiKeySave"), "click", aiSaveKey);
  on(el("aiKeyDel"), "click", aiDelKey);
  on(eAiProv, "click", function (e) {
    var t = e && e.target, p = t && t.getAttribute ? t.getAttribute("data-prov") : null;
    if (!p || !AI_MODELS[p] || p === aiCfg.prov) return;
    aiCfg.prov = p;
    saveAiCfg();
    setKeyPanel(!aiCfg.keys[p]);
    paintKeyBtn();
  });
  on(eAiChips, "click", function (e) {
    var t = e && e.target, c = t && t.getAttribute ? t.getAttribute("data-chip") : null;
    if (!c) return;
    aiSend(c);
  });
  on(eAiSend, "click", function () { if (VOICE.mode) voiceAbort(); aiSend(null); });
  on(eAiCopy, "click", aiCopy);
  on(eAiInput, "keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); if (VOICE.mode) voiceAbort(); aiSend(null); }
  });
  on(eAiKeyInput, "keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); aiSaveKey(); }
  });
  on(eList, "click", function (e) {
    var t = e && e.target;
    if (!t || t.nodeType !== 1) return;
    var askId = t.getAttribute("data-ask");
    if (askId && byId[askId]) { selHide(); aiOpenFor(byId[askId], ""); return; }
    var kw = kwAt(t, eList);
    if (!kw) return;
    var li = kw, qid = "";
    while (li && li !== eList) {
      if (li.classList && li.classList.contains("li")) { qid = li.getAttribute("data-qid") || ""; break; }
      li = li.parentNode;
    }
    selS.kwAt = Date.now();
    selShow(kw.textContent, qid, kw.getBoundingClientRect());
  });

  /* 지문·해설 끝 아이콘, 강조 단어 탭, 텍스트 선택으로 질문하기 */
  on(eCard, "click", function (e) {
    var t = e && e.target;
    if (!t || t.nodeType !== 1) return;
    var askId = t.getAttribute("data-ask");
    if (askId) { selHide(); aiOpenFor(byId[askId] || cur(), ""); return; }
    var kw = kwAt(t, eCard);
    if (!kw) return;
    var c = cur();
    selS.kwAt = Date.now();
    selShow(kw.textContent, c ? c.id : "", kw.getBoundingClientRect());
  });

  on(eSelAsk, "click", selAskOpen);
  on(document, "selectionchange", function () { if (eSelAsk) selSchedule(); });
  on(window, "scroll", selHide, true);
  on(window, "resize", selHide);
  on(document, "mousedown", selOutside, { passive: true });
  on(document, "touchstart", selOutside, { passive: true });

  loadAiCfg();

  window.__afpk = {
    state: state,
    questions: Q,
    view: function () { return view; },
    current: cur,
    answer: answer,
    go: go,
    setMode: setMode,
    setFilter: setFilter,
    setView: setView,
    reshuffle: reshuffle,
    refresh: refreshRandom,
    toast: toastShow,
    renderList: renderList,
    key: KEY,
    ai: {
      open: aiOpenFor,
      close: aiClose,
      fit: aiFit,
      send: aiSend,
      ask: aiAsk,
      req: aiReq,
      models: AI_MODELS,
      names: AI_NAMES,
      ctx: aiCtxText,
      cfg: function () { return aiCfg; },
      state: function () { return aiS; },
      key: AI_KEY,
      sel: { show: selShow, hide: selHide, ctx: selCtx, at: kwAt },
      chips: aiChipList,
      toast: aiToast,
      voice: {
        toggle: voiceToggle,
        stop: voiceAbort,
        hint: function () { return eAiVoiceHint && !eAiVoiceHint.hidden ? eAiVoiceHint.textContent : ""; },
        state: function () {
          return {
            mode: VOICE.mode, base: VOICE.base, finalText: VOICE.finalText,
            interim: VOICE.interim, mime: VOICE.mime, err: VOICE.err
          };
        },
        secure: voiceSecure
      }
    }
  };
})();
</script>
</body>
</html>
