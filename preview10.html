<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AFPK O/X v10 preview</title>
<style>
  html,body{margin:0;padding:0;background:#0F1115}
  iframe{display:block;border:0;background:#F2F4F6}
</style>
</head>
<body>
<script>
(function(){
  var q = location.search || "";
  var p = (/[?&]p=([a-z]+)/.exec(q) || [])[1] || "base";
  var W = +((/[?&]w=(\d+)/.exec(q) || [])[1] || 390);
  var KEY = "afpk-all-ox-v1";
  try { localStorage.removeItem(KEY); } catch (e) {}

  var plans = {
    base: function (a) {},
    subject: function (a) { a.setOrder("subject"); },
    wrong: function (a) {
      a.setOrder("subject");
      if (a.current() && a.current().ans !== "X") a.go(1);
      var qq = a.current();
      a.answer(qq.ans === "O" ? "X" : "O");   /* 틀린 답: 빨강 + 정답 힌트 + 해설 */
      a.setFilter("wrong");
    },
    many: function (a) { a.setView("many"); },
    subjectfocus: function (a) {
      a.setOrder("subject");
      a.setSubject("상속설계");
    }
  };

  var f = document.createElement("iframe");
  f.id = "f";
  f.style.width = W + "px";
  f.style.height = "844px";
  f.src = "index.html?p=" + p + "&cb=" + Date.now();
  document.body.appendChild(f);

  var tries = 0;
  var t = setInterval(function () {
    tries++;
    var a = null;
    try { a = f.contentWindow && f.contentWindow.__afpk; } catch (e) { a = null; }
    if (!a) { if (tries > 250) clearInterval(t); return; }
    clearInterval(t);
    /* 아이폰 상태바(59px)를 흉내 낸다 */
    try {
      var s = f.contentDocument.createElement("style");
      s.textContent = "header{padding-top:67px !important}";
      f.contentDocument.head.appendChild(s);
    } catch (e) {}
    try { (plans[p] || plans.base)(a); } catch (e) { document.title = "ERR: " + e; }
    document.title = "ready:" + p;
  }, 40);
})();
</script>
</body>
</html>
